<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Firstsun Dev — build, operate, share</title>
  <desc id="desc">A warm field-journal inspired Firstsun graphic showing Build, Operate, and Share as one continuous engineering loop.</desc>

  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffcf6"/>
      <stop offset="100%" stop-color="#f6f0e6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#2f211a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b99a82"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1198" height="418" rx="28" fill="url(#paper)" stroke="#dfcdbc" stroke-width="2"/>
  <circle cx="1090" cy="-18" r="164" fill="#dba15d" opacity="0.16"/>
  <circle cx="1090" cy="-18" r="112" fill="#dba15d" opacity="0.12"/>
  <path d="M70 142 H1130" stroke="#ecdfcc" stroke-width="1.5"/>

  <text x="70" y="70" font-family="Georgia, 'Times New Roman', serif" font-size="18" letter-spacing="4" fill="#985f4b">FIRSTSUN DEV</text>
  <text x="70" y="110" font-family="Georgia, 'Times New Roman', serif" font-size="31" font-weight="700" fill="#2f211a">Build useful things. Operate them well. Share what we learn.</text>
  <text x="1130" y="71" text-anchor="end" font-family="Arial, sans-serif" font-size="15" letter-spacing="1.4" fill="#754434">首陽問路 · ENGINEERING</text>

  <path d="M332 277 C 392 325, 458 325, 522 280" fill="none" stroke="#b99a82" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M677 280 C 742 325, 808 325, 868 277" fill="none" stroke="#b99a82" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M871 222 C 773 173, 435 173, 329 222" fill="none" stroke="#b99a82" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 9" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="85" y="190" width="270" height="128" rx="20" fill="#fff9ef" stroke="#dfcdbc" stroke-width="1.5"/>
    <circle cx="127" cy="232" r="15" fill="#985f4b"/>
    <text x="158" y="237" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#754434">BUILD</text>
    <text x="115" y="275" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="700" fill="#2f211a">Useful tools</text>
    <text x="115" y="302" font-family="Arial, sans-serif" font-size="14" fill="#5d4a40">Plugins · apps · public services</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="465" y="190" width="270" height="128" rx="20" fill="#fff9ef" stroke="#dfcdbc" stroke-width="1.5"/>
    <circle cx="507" cy="232" r="15" fill="#809277"/>
    <text x="538" y="237" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#5d4a40">OPERATE</text>
    <text x="495" y="275" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="700" fill="#2f211a">Reliable systems</text>
    <text x="495" y="302" font-family="Arial, sans-serif" font-size="14" fill="#5d4a40">CI/CD · infrastructure · status</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="845" y="190" width="270" height="128" rx="20" fill="#fff9ef" stroke="#dfcdbc" stroke-width="1.5"/>
    <circle cx="887" cy="232" r="15" fill="#dba15d"/>
    <text x="918" y="237" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#754434">SHARE</text>
    <text x="875" y="275" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="700" fill="#2f211a">Reusable knowledge</text>
    <text x="875" y="302" font-family="Arial, sans-serif" font-size="14" fill="#5d4a40">Open source · notes · automation</text>
  </g>

  <text x="600" y="377" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="1.4" fill="#897669">FIRSTSUN / 首陽問路  ·  SOFTWARE  ·  OPERATIONS  ·  KNOWLEDGE</text>
</svg>
