<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Firstsun Dev software operating loop</title>
  <desc id="desc">A three-stage loop: Ship, Operate, and Learn.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eff6ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1200" height="430" rx="28" fill="url(#background)"/>
  <circle cx="1100" cy="-40" r="200" fill="#dbeafe" opacity="0.75"/>
  <circle cx="80" cy="405" r="150" fill="#dcfce7" opacity="0.65"/>

  <text x="70" y="88" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="700" fill="#0f172a">A connected system built to keep improving.</text>
  <text x="70" y="122" font-family="Inter, Arial, sans-serif" font-size="18" fill="#475569">From useful products to dependable operations—and back into the next iteration.</text>

  <path d="M 320 285 C 410 350, 500 350, 575 288" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M 630 288 C 715 350, 810 350, 885 285" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M 890 230 C 790 178, 490 178, 325 230" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 9" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="95" y="205" width="250" height="128" rx="22" fill="#0f172a"/>
    <circle cx="135" cy="246" r="16" fill="#818cf8"/>
    <text x="165" y="250" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.8" fill="#c7d2fe">SHIP</text>
    <text x="125" y="290" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#ffffff">Useful products</text>
    <text x="125" y="316" font-family="Inter, Arial, sans-serif" font-size="14" fill="#cbd5e1">Tools · apps · public services</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="475" y="205" width="250" height="128" rx="22" fill="#ffffff" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="515" cy="246" r="16" fill="#38bdf8"/>
    <text x="545" y="250" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.8" fill="#0369a1">OPERATE</text>
    <text x="505" y="290" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#0f172a">Dependable systems</text>
    <text x="505" y="316" font-family="Inter, Arial, sans-serif" font-size="14" fill="#475569">CI/CD · infrastructure · status</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="855" y="205" width="250" height="128" rx="22" fill="#ffffff" stroke="#4ade80" stroke-width="2"/>
    <circle cx="895" cy="246" r="16" fill="#4ade80"/>
    <text x="925" y="250" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.8" fill="#15803d">LEARN</text>
    <text x="885" y="290" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#0f172a">Better workflows</text>
    <text x="885" y="316" font-family="Inter, Arial, sans-serif" font-size="14" fill="#475569">Analytics · automation · AI</text>
  </g>

  <text x="600" y="390" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#64748b">PUBLIC TOOLS  ·  RELIABLE SERVICES  ·  SHARED INFRASTRUCTURE  ·  AI WORKFLOWS</text>
</svg>
