# actionlint 1.7.12 predates two GitHub features this pipeline uses; ONLY these messages are ignored, everything else is still linted.
#  * `concurrency.queue` (GitHub changelog 2026-05-07), reported as an unknown key; only the shared Worker workflow uses it.
#  * the self-repository reference `uses: $/...` (GitHub changelog 2026-07-30, runner >= 2.336.0): actionlint still demands
#    `owner/repo@ref` for actions and `owner/repo/path.yml@ref` for reusable workflows. The contract test (test-workflow-contract.py)
#    validates every `$/` reference itself: static, no @ref, the target exists in this repository. Drop these entries once actionlint
#    learns `$/`.
paths:
  .github/workflows/_cf-worker-v2.yml:
    ignore:
      - 'unexpected key "queue" for "concurrency" section'
  .github/workflows/_cf-worker-*.yml:
    ignore:
      - 'specifying action "\$/[a-z/-]+" in invalid format because ref is missing'
      - 'reusable workflow call "\$/\.github/workflows/_cf-worker-[a-z-]+\.yml" at "uses" is not following the format'
