name: CF Worker CI (stages)

# ---------------------------------------------------------------------------
# INTERNAL — called ONLY by _cf-worker-v2.yml (one `uses:` per run). Not a public entrypoint. Contract: docs/cf-worker-v2.md
#
#   Plan  ->  Verify tasks (matrix) || Test tasks (matrix) || E2E (matrix)  ->  Gate
#
# The caller owns the task lists (`verify_tasks`, `test_tasks`: JSON [{"id","cmd"}]); this workflow owns orchestration. Which stages run
# is decided from the event by the Plan (actions/cf-preview/stages.mjs): push = Verify; pull_request / merge_group = Verify + Test on the
# merge candidate; workflow_dispatch = Verify. Verify and Test tasks have NO `needs` between them, so they run concurrently. The Gate is
# the ONE aggregation: every expected job succeeded, every unexpected one was skipped, the plan succeeded - otherwise red.
# Credential-free: no Cloudflare secret is ever passed here and no build artifact leaves this workflow (the delivery engine rebuilds for
# its real target). A fork PR can only run on the explicitly named `fork_runner`, never on the privileged `runner`.
# No workflow-level `concurrency` here (the public workflow owns the run-level group; reusing it would deadlock).
# ---------------------------------------------------------------------------

on:
  workflow_call:
    inputs:
      app_name:
        type: string
        required: true
      app_path:
        type: string
        default: .
      app_version:
        type: string
        default: ''
      runner:
        type: string
        default: linux
      fork_runner:
        description: GitHub-hosted runner label for fork pull requests. Empty = a fork PR fails closed (untrusted code never reaches `runner`).
        type: string
        default: ''
      verify_tasks:
        description: 'JSON array of {"id","cmd"}: fast checks (lint, check, build, unit, fast integration, ...). Runs on every eligible push and PR.'
        type: string
        default: ''
      test_tasks:
        description: 'JSON array of {"id","cmd"}: costly checks (heavy integration, contract, ...). Runs on pull_request and merge_group only. Empty is valid.'
        type: string
        default: ''
      ci_env:
        type: string
        default: ''
      use_mailpit:
        type: boolean
        default: false
      build_env_prod:
        type: string
        default: ''
      build_env_preview:
        type: string
        default: ''
      build_env_dev:
        type: string
        default: ''
      test_e2e_cmd:
        type: string
        default: ''
      test_e2e_setup_cmd:
        type: string
        default: ''
      test_e2e_build_cmd:
        type: string
        default: ''
      test_e2e_variants:
        type: string
        default: '[{"name":"","args":"","artifact_suffix":""}]'
      test_e2e_env:
        type: string
        default: ''
    outputs:
      validation:
        description: passed ONLY when the Gate passed (every expected job succeeded); empty otherwise
        value: ${{ jobs.gate.outputs.validation }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  PLAYWRIGHT_BROWSERS_PATH: /opt/playwright-browsers

jobs:
  # Plan - pure data, no checkout, no credentials. Validates the task lists (malformed -> red before any command runs) and routes the event.
  plan:
    name: Plan
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && (inputs.fork_runner || 'ubuntu-latest') || inputs.runner }}
    timeout-minutes: 5
    outputs:
      stages: ${{ steps.plan.outputs.stages }}
      runner: ${{ steps.plan.outputs.runner }}
      target_env: ${{ steps.plan.outputs.target_env }}
      run_verify: ${{ steps.plan.outputs.run_verify }}
      run_test: ${{ steps.plan.outputs.run_test }}
      run_e2e: ${{ steps.plan.outputs.run_e2e }}
      verify_tasks: ${{ steps.plan.outputs.verify_tasks }}
      test_tasks: ${{ steps.plan.outputs.test_tasks }}
    steps:
      - uses: $/actions/cf-tools
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          VERIFY_TASKS: ${{ inputs.verify_tasks }}
          TEST_TASKS: ${{ inputs.test_tasks }}
          E2E_CMD: ${{ inputs.test_e2e_cmd }}
          RUNNER: ${{ inputs.runner }}
          FORK_RUNNER: ${{ inputs.fork_runner }}
        run: node "$TOOLS_DIR/stages.mjs" plan | tee -a "$GITHUB_OUTPUT"

  verify:
    name: Verify (${{ matrix.task.id }})
    needs: [plan]
    if: needs.plan.outputs.run_verify == 'true'
    strategy:
      fail-fast: false
      matrix:
        task: ${{ fromJSON(needs.plan.outputs.verify_tasks) }}
    runs-on: ${{ needs.plan.outputs.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: $/actions/cf-ci-check
        with:
          title: Verify ${{ matrix.task.id }}
          cmd: ${{ matrix.task.cmd }}
          app_path: ${{ inputs.app_path }}
          build_env_prod: ${{ inputs.build_env_prod }}
          build_env_preview: ${{ inputs.build_env_preview }}
          build_env_dev: ${{ inputs.build_env_dev }}
          target_env: ${{ needs.plan.outputs.target_env }}
          ci_env: ${{ inputs.ci_env }}
          app_version: ${{ inputs.app_version }}
          use_mailpit: ${{ inputs.use_mailpit }}

  test:
    name: Test (${{ matrix.task.id }})
    needs: [plan]
    if: needs.plan.outputs.run_test == 'true'
    strategy:
      fail-fast: false
      matrix:
        task: ${{ fromJSON(needs.plan.outputs.test_tasks) }}
    runs-on: ${{ needs.plan.outputs.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: $/actions/cf-ci-check
        with:
          title: Test ${{ matrix.task.id }}
          cmd: ${{ matrix.task.cmd }}
          app_path: ${{ inputs.app_path }}
          build_env_prod: ${{ inputs.build_env_prod }}
          build_env_preview: ${{ inputs.build_env_preview }}
          build_env_dev: ${{ inputs.build_env_dev }}
          target_env: ${{ needs.plan.outputs.target_env }}
          ci_env: ${{ inputs.ci_env }}
          app_version: ${{ inputs.app_version }}
          use_mailpit: ${{ inputs.use_mailpit }}

  # E2E — own setup and own TEST build (local URLs, mock services); never reused for a deployment.
  e2e:
    name: E2E
    needs: [plan]
    if: needs.plan.outputs.run_e2e == 'true'
    strategy:
      fail-fast: false
      matrix:
        e2e: ${{ fromJSON(inputs.test_e2e_variants) }}
    runs-on: ${{ needs.plan.outputs.runner }}
    timeout-minutes: 45
    env:
      E2E_ENV: ${{ inputs.test_e2e_env }}
    steps:
      - uses: actions/checkout@v6
      - uses: $/actions/cf-tools
      - name: Import E2E env
        run: node "$TOOLS_DIR/parse-env.mjs" E2E_ENV "$GITHUB_ENV"
      - uses: $/actions/setup
        with:
          setup-node: 'false'
          setup-pnpm: 'false'
      - name: Start Mailpit
        if: inputs.use_mailpit
        uses: $/actions/mailpit
      - name: E2E setup
        if: inputs.test_e2e_setup_cmd != ''
        working-directory: ${{ inputs.app_path }}
        env:
          CMD: ${{ inputs.test_e2e_setup_cmd }}
        run: bash -c "$CMD"
      - name: E2E test build
        if: inputs.test_e2e_build_cmd != ''
        working-directory: ${{ inputs.app_path }}
        env:
          CMD: ${{ inputs.test_e2e_build_cmd }}
        run: bash -c "$CMD"
      - name: E2E tests
        working-directory: ${{ inputs.app_path }}
        env:
          CMD: ${{ inputs.test_e2e_cmd }} ${{ matrix.e2e.args }}
        run: bash -c "$CMD"
      # Failure-only evidence with short retention; never a delivery dependency.
      - name: Upload E2E report (failure only)
        uses: actions/upload-artifact@v7
        if: failure()
        continue-on-error: true
        with:
          name: ${{ matrix.e2e.artifact_suffix != '' && format('e2e-report-{0}-{1}-{2}', inputs.app_name, matrix.e2e.artifact_suffix, github.run_id) || format('e2e-report-{0}-{1}', inputs.app_name, github.run_id) }}
          path: |
            ${{ inputs.app_path }}/playwright-report/
            ${{ inputs.app_path }}/test-results/
          if-no-files-found: ignore
          retention-days: 3

  # Gate - fail closed (logic and its tests: actions/cf-preview/stages.mjs gateVerdict). `always()` makes it run (and fail) even when a job it
  # needs failed or was cancelled, so the called workflow's conclusion is never a skipped-looking green.
  gate:
    name: Gate
    needs: [plan, verify, test, e2e]
    if: always()
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && (inputs.fork_runner || 'ubuntu-latest') || inputs.runner }}
    timeout-minutes: 5
    outputs:
      validation: ${{ steps.gate.outputs.validation }}
    steps:
      - uses: $/actions/cf-tools
      - id: gate
        name: Every expected job succeeded, every other one was skipped
        env:
          PLAN: ${{ needs.plan.result }}
          VERIFY: ${{ needs.verify.result }}
          TEST: ${{ needs.test.result }}
          E2E: ${{ needs.e2e.result }}
          RUN_VERIFY: ${{ needs.plan.outputs.run_verify }}
          RUN_TEST: ${{ needs.plan.outputs.run_test }}
          RUN_E2E: ${{ needs.plan.outputs.run_e2e }}
        run: node "$TOOLS_DIR/stages.mjs" gate | tee -a "$GITHUB_OUTPUT"
