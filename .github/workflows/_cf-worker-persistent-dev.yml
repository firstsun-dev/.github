name: CF Worker persistent Dev (Hybrid, manual)

# ---------------------------------------------------------------------------
# INTERNAL — called ONLY by _cf-worker-v2.yml for an explicit workflow_dispatch of the approved ref (the caller's `if` checks
# dispatch_target, strategy hybrid and persistent_dev_ref). Never a side effect of a feature-branch push. The GitHub Environment
# `<app>/dev` is a property of the job below, so its protection rules and approvals apply exactly as before.
#
#   dev_build_cmd set   : the SAME delivery engine as every other kind, in manual mode (build -> audit -> migration -> publish -> smoke ->
#                         ledger; no automatic recovery) - `uses: $/actions/cf-deploy`
#   dev_build_cmd empty : the legacy two-command contract, unchanged (dev_deploy_cmd builds AND publishes, dev_smoke_cmd checks). It is
#                         never recorded in the Shared Dev last-good ledger, so automatic recovery can never treat it as known-good.
# ---------------------------------------------------------------------------

on:
  workflow_call:
    inputs:
      inputs_json:
        description: toJSON(inputs) of the public workflow (data only; the engine reads its policy from it)
        type: string
        required: true
      app_name:
        type: string
        required: true
      app_path:
        type: string
        default: .
      d1_lock_scope:
        type: string
        default: ''
      dev_build_cmd:
        type: string
        default: ''
      dev_deploy_cmd:
        type: string
        default: ''
      dev_smoke_cmd:
        type: string
        default: ''
      runner:
        type: string
        default: linux
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false
      SMOKE_USERNAME:
        required: false
      SMOKE_PASSWORD:
        required: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  persistent-dev:
    name: manual
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 45
    environment: ${{ inputs.app_name }}/dev
    concurrency:
      group: cfv2-dev-${{ github.repository }}-${{ inputs.d1_lock_scope != '' && inputs.d1_lock_scope || inputs.app_name }}
      cancel-in-progress: false
    permissions:
      contents: read
      deployments: write # engine mode only: Dev ledger entry, recorded verified ONLY after the smoke passes
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      # ---- Engine contract (dev_build_cmd set)
      - id: engine
        if: inputs.dev_build_cmd != ''
        uses: $/actions/cf-deploy
        with:
          target: dev
          mode: manual
          inputs_json: ${{ inputs.inputs_json }}
          smoke_username: ${{ secrets.SMOKE_USERNAME }}
          smoke_password: ${{ secrets.SMOKE_PASSWORD }}
      # ---- Legacy contract (dev_build_cmd empty)
      - uses: $/actions/setup
        if: inputs.dev_build_cmd == ''
        with:
          setup-node: 'false'
          setup-pnpm: 'false'
      - name: Deploy persistent Dev
        if: inputs.dev_build_cmd == ''
        working-directory: ${{ inputs.app_path }}
        env:
          CMD: ${{ inputs.dev_deploy_cmd }}
        run: |
          [ -n "$CMD" ] || { echo "::error::dev_deploy_cmd required"; exit 1; }
          bash -c "$CMD"
      - name: Dev smoke (Cron/Queue-adjacent checks)
        if: inputs.dev_build_cmd == '' && inputs.dev_smoke_cmd != ''
        working-directory: ${{ inputs.app_path }}
        env:
          CMD: ${{ inputs.dev_smoke_cmd }}
        run: bash -c "$CMD"
