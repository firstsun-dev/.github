name: CF Worker Preview lifecycle

# ---------------------------------------------------------------------------
# INTERNAL — called ONLY by _cf-worker-v2.yml, when a same-repository PR with preview_policy `pr` is CLOSED. Never deploys, no Cloudflare credentials.
#   PR closed : retire the GitHub ledger of the PR Preview `pr-<number>`; the Cloudflare Native Preview is KEPT (owner policy: deleting it is a
#               separate, explicitly approved retention / GC action, see _cf-worker-preview-gc.yml).
# Cloudflare cannot remove only a Preview's stable URL (`urls` is read-only; `wrangler preview delete` removes the Preview with all its
# deployments), so closing a PR never deletes its Preview.
# ---------------------------------------------------------------------------

on:
  workflow_call:
    inputs:
      app_name:
        type: string
        required: true
      preview_worker_name:
        description: Host Worker of the Native Previews (empty = app_name)
        type: string
        default: ''
      runner:
        type: string
        default: linux

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  lifecycle:
    name: ledger
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    concurrency:
      group: cfv2-lifecycle-${{ github.repository }}-${{ inputs.app_name }}-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      APP: ${{ inputs.app_name }}
      BRANCH: ${{ github.event.pull_request.head.ref }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      WORKER_NAME: ${{ inputs.preview_worker_name != '' && inputs.preview_worker_name || inputs.app_name }}
    steps:
      - uses: $/actions/cf-tools
      - name: Retire the PR Preview ledger (the Preview is kept)
        run: |
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]{0,8}$ ]] || { echo "::error::unsafe pull request number"; exit 1; }
          NAME="pr-$PR_NUMBER"; ENV_NAME="$APP/preview/$NAME"
          # Only touch the ledger if THIS PR's branch owns the name.
          OWNER="$("$TOOLS_DIR/gh.sh" owner "$ENV_NAME")"
          if [ -n "$OWNER" ] && [ "$OWNER" != "refs/heads/$BRANCH" ]; then
            echo "::notice::$NAME is owned by $OWNER, not this PR's branch; leaving the ledger alone."; exit 0
          fi
          "$TOOLS_DIR/gh.sh" retire "$ENV_NAME"
          {
            echo "### 📌 PR #$PR_NUMBER closed — Preview \`$NAME\` is **kept**"
            echo "- Cloudflare Preview and its stable URL were not touched; GitHub Deployments are marked inactive."
            echo "- No automatic reclaim. To remove it manually:"
            echo "  \`wrangler preview delete --name $NAME --worker-name $WORKER_NAME --skip-confirmation\`"
          } >> "$GITHUB_STEP_SUMMARY"
