name: CF Worker Pipeline v2

# ---------------------------------------------------------------------------
# Cloudflare Worker CI/CD v2 — thin workflow, ONE reusable delivery engine.
# OpenSpec: openspec/changes/refactor-cloudflare-worker-cicd-v2 (PR #57), openspec/changes/add-cloudflare-shared-dev-channel.
# Interface / migration guide: docs/cf-worker-v2-refactor.md
#
#   Lint  Typecheck  Unit  Integration  Build Validation  E2E        six independent, parallel jobs (no `needs` between them)
#                         |
#                  Validation Gate -> Delivery plan (enabled kinds, D1 owners; pure data)
#                         |
#      Preflight (one call per kind)   non-publishing: canonical URL, target build, effective-config audit, exact D1 binding
#                         |  (every Migration waits for EVERY enabled kind's Preflight: nothing mutates while a target is unvalidated)
#      Migration (one call per distinct physical D1; Native Branch + Native Dev on one D1 -> one migration)
#                         |
#      Delivery  (one call per kind of _cf-worker-delivery.yml):  Deploy -> Smoke -> conditional Rollback,
#                         |                                       independent of every other kind
#                      Release  optional, main only, only after a VERIFIED Production delivery with no rollback
#
# ONE delivery implementation (_cf-worker-delivery.yml -> actions/cf-deploy -> engine.sh) serves every kind; a call handles exactly one
# target, so job outputs are unambiguous (no matrix output merging). The run-level concurrency group below spans the whole run.
# Event handlers outside the DAG: `lifecycle` (PR comment / branch delete), `config-guard` and `persistent-dev` (Hybrid, protected
# manual dispatch; the same engine in one job, manual mode).
#
# Local composite actions: a reusable workflow called from another repository resolves `uses: ./...` against the
# CALLER's workspace and `uses:` cannot take an expression. Every job therefore checks out firstsun-dev/.github at
# `tools_ref` into `.cf-tools` and references the actions as the static path `./.cf-tools/actions/<name>`.
# `tools_ref` MUST equal the ref the caller pins this workflow at.
#
# Caller MUST trigger on: push (all branches), pull_request, delete, workflow_dispatch.
# `delete` only fires from the DEFAULT branch's workflow file.
# ---------------------------------------------------------------------------

on:
  workflow_call:
    outputs:
      deploy_url:
        description: URL that was published (Preview URL or app_url_prod); empty when nothing was deployed. May be published-but-unverified or rolled back - gate on deploy_verified_url
        value: ${{ fromJSON((jobs.plan.outputs.on_production == 'true' && jobs.delivery_production.outputs.handoff) || (jobs.plan.outputs.on_native_branch == 'true' && jobs.delivery_native_branch.outputs.handoff) || '{}').url }}
      deploy_verified_url:
        description: Same URL, only when the Smoke passed content-level verification; empty for Access-liveness-only, failed, rolled-back, smoke_mode=skip or skipped deployments
        value: ${{ fromJSON((jobs.plan.outputs.on_production == 'true' && jobs.delivery_production.outputs.smoke_json) || (jobs.plan.outputs.on_native_branch == 'true' && jobs.delivery_native_branch.outputs.smoke_json) || '{}').verified_url }}
      deploy_published_unverified:
        description: true when the deployment is reachable but NOT content-verified (Access liveness only, or smoke_mode=skip)
        value: ${{ fromJSON((jobs.plan.outputs.on_production == 'true' && jobs.delivery_production.outputs.smoke_json) || (jobs.plan.outputs.on_native_branch == 'true' && jobs.delivery_native_branch.outputs.smoke_json) || '{}').published_unverified }}
      deploy_verified:
        description: true ONLY when this run published its own SHA and its Smoke passed at content level
        value: ${{ fromJSON((jobs.plan.outputs.on_production == 'true' && jobs.delivery_production.outputs.smoke_json) || (jobs.plan.outputs.on_native_branch == 'true' && jobs.delivery_native_branch.outputs.smoke_json) || '{}').deployed_and_verified }}
      deploy_smoke_level:
        description: skipped | liveness | content | content-sha (verification level of the Smoke; empty when it did not run)
        value: ${{ fromJSON((jobs.plan.outputs.on_production == 'true' && jobs.delivery_production.outputs.smoke_json) || (jobs.plan.outputs.on_native_branch == 'true' && jobs.delivery_native_branch.outputs.smoke_json) || '{}').smoke_level }}
      deploy_target:
        description: prod | preview (the Production / per-branch Native Preview delivery)
        value: ${{ jobs.plan.outputs.on_production == 'true' && 'prod' || jobs.plan.outputs.on_native_branch == 'true' && 'preview' || '' }}
      version_id:
        description: Production Worker version id (prod only)
        value: ${{ fromJSON((jobs.plan.outputs.on_production == 'true' && jobs.delivery_production.outputs.handoff) || (jobs.plan.outputs.on_native_branch == 'true' && jobs.delivery_native_branch.outputs.handoff) || '{}').version_id }}
      previous_version_id:
        description: Production Worker version that was live before this run's publish (prod only; the rollback target)
        value: ${{ fromJSON((jobs.plan.outputs.on_production == 'true' && jobs.delivery_production.outputs.handoff) || (jobs.plan.outputs.on_native_branch == 'true' && jobs.delivery_native_branch.outputs.handoff) || '{}').previous_version_id }}
      migration_status:
        description: applied | failed | none (Migration stage; none when d1_migrations is false). First migrated D1 of the plan (Production, else Native Branch, Native Dev, persistent Dev)
        value: ${{ (jobs.plan.outputs.owns_production == 'true' && fromJSON(jobs.migration_production.outputs.migration_json || '{}').migration) || (jobs.plan.outputs.owns_native_branch == 'true' && fromJSON(jobs.migration_native_branch.outputs.migration_json || '{}').migration) || (jobs.plan.outputs.owns_native_dev == 'true' && fromJSON(jobs.migration_native_dev.outputs.migration_json || '{}').migration) || (jobs.plan.outputs.owns_persistent_dev == 'true' && fromJSON(jobs.migration_persistent_dev.outputs.migration_json || '{}').migration) || '' }}
      rollback_result:
        description: restored_verified | restored_unverified | restored_unhealthy | blocked | failed | no_known_good; empty when no rollback ran. Anything but empty is a FAILED run (first kind of the run that rolled back)
        value: ${{ (jobs.plan.outputs.on_production == 'true' && jobs.delivery_production.outputs.rollback_result) || (jobs.plan.outputs.on_native_branch == 'true' && jobs.delivery_native_branch.outputs.rollback_result) || (jobs.plan.outputs.on_native_dev == 'true' && jobs.delivery_native_dev.outputs.rollback_result) || (jobs.plan.outputs.on_persistent_dev == 'true' && jobs.delivery_persistent_dev.outputs.rollback_result) || '' }}
      dev_url:
        description: persistent-dev (separate Dev Worker) URL that was published (app_url_dev); empty when it did not deploy. May be published-but-unverified - gate on dev_verified_url
        value: ${{ fromJSON((jobs.plan.outputs.on_persistent_dev == 'true' && jobs.delivery_persistent_dev.outputs.handoff) || '{}').url }}
      dev_verified_url:
        description: persistent-dev URL only when content-level verification passed
        value: ${{ fromJSON((jobs.plan.outputs.on_persistent_dev == 'true' && jobs.delivery_persistent_dev.outputs.smoke_json) || '{}').verified_url }}
      dev_published_unverified:
        description: true when persistent-dev published a reachable but NOT content-verified deployment (Access liveness only, or smoke_mode=skip)
        value: ${{ fromJSON((jobs.plan.outputs.on_persistent_dev == 'true' && jobs.delivery_persistent_dev.outputs.smoke_json) || '{}').published_unverified }}
      native_dev_url:
        description: Native Dev Preview URL that was published; empty when Native Dev did not deploy. May be published-but-unverified - gate on native_dev_verified_url
        value: ${{ fromJSON((jobs.plan.outputs.on_native_dev == 'true' && jobs.delivery_native_dev.outputs.handoff) || '{}').url }}
      native_dev_verified_url:
        description: Native Dev URL only when content-level verification passed
        value: ${{ fromJSON((jobs.plan.outputs.on_native_dev == 'true' && jobs.delivery_native_dev.outputs.smoke_json) || '{}').verified_url }}
      native_dev_published_unverified:
        description: true when Native Dev published a reachable but NOT content-verified deployment (Access liveness only, or smoke_mode=skip)
        value: ${{ fromJSON((jobs.plan.outputs.on_native_dev == 'true' && jobs.delivery_native_dev.outputs.smoke_json) || '{}').published_unverified }}
      native_dev_verified:
        description: true ONLY when this run published its own SHA to Native Dev and its Smoke passed at content level
        value: ${{ fromJSON((jobs.plan.outputs.on_native_dev == 'true' && jobs.delivery_native_dev.outputs.smoke_json) || '{}').deployed_and_verified }}
      native_dev_smoke_level:
        description: skipped | liveness | content | content-sha for Native Dev; empty when its Smoke did not run
        value: ${{ fromJSON((jobs.plan.outputs.on_native_dev == 'true' && jobs.delivery_native_dev.outputs.smoke_json) || '{}').smoke_level }}
      deploy_gate_blocked:
        description: true when the cross-service gate (upstream_gate) blocked a verification - the deployment is published but NOT verified and was not rolled back (pipeline_phase verify)
        value: ${{ fromJSON(jobs.delivery_production.outputs.smoke_json || '{}').gate_blocked == 'true' || fromJSON(jobs.delivery_native_branch.outputs.smoke_json || '{}').gate_blocked == 'true' || fromJSON(jobs.delivery_native_dev.outputs.smoke_json || '{}').gate_blocked == 'true' || fromJSON(jobs.delivery_persistent_dev.outputs.smoke_json || '{}').gate_blocked == 'true' }}
      phase_state:
        description: pipeline_phase deploy - the validated hand-off (inputs, enabled kinds, per-kind Deploy / Migration results, per-kind D1 ids, concurrency group) for the verify call. Pass it unchanged as phase_state
        value: ${{ format('{{"inputs":{0},"kinds":{1},"deploy":{2},"migration":{3},"d1":{4},"group":"{5}"}}', toJSON(inputs), toJSON(fromJSON(jobs.plan.outputs.kinds || '[]')), format('{{"h_production":{0},"h_native_branch":{1},"h_native_dev":{2},"h_persistent_dev":{3}}}', toJSON(jobs.delivery_production.outputs.handoff), toJSON(jobs.delivery_native_branch.outputs.handoff), toJSON(jobs.delivery_native_dev.outputs.handoff), toJSON(jobs.delivery_persistent_dev.outputs.handoff)), format('{{"mj_production":{0},"mj_native_branch":{1},"mj_native_dev":{2},"mj_persistent_dev":{3}}}', toJSON(jobs.delivery_production.outputs.migration_used), toJSON(jobs.delivery_native_branch.outputs.migration_used), toJSON(jobs.delivery_native_dev.outputs.migration_used), toJSON(jobs.delivery_persistent_dev.outputs.migration_used)), format('{{"production":{0},"native_branch":{1},"native_dev":{2},"persistent_dev":{3}}}', toJSON(jobs.plan.outputs.d1_production), toJSON(jobs.plan.outputs.d1_native_branch), toJSON(jobs.plan.outputs.d1_native_dev), toJSON(jobs.plan.outputs.d1_persistent_dev)), ((github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dispatch_target != 'persistent-dev')) && github.ref_type == 'branch') && (github.ref == 'refs/heads/main' && format('cfv2-prod-{0}', inputs.d1_lock_scope != '' && inputs.d1_lock_scope || inputs.app_name) || (inputs.deployment_strategy != 'production-only' && (inputs.preview_on_branch_push || inputs.shared_dev_on_branch_push || inputs.shared_dev_native_preview_on_branch_push) && inputs.d1_migrations && format('cfv2-nonprod-d1-{0}', inputs.d1_lock_scope != '' && inputs.d1_lock_scope || inputs.app_name) || (inputs.deployment_strategy != 'production-only' && (inputs.shared_dev_on_branch_push || inputs.shared_dev_native_preview_on_branch_push) && format('cfv2-shared-dev-{0}', inputs.app_name) || format('cfv2-{0}-preview-{1}', inputs.app_name, github.ref_name)))) || format('cfv2-run-{0}', github.run_id)) }}
    inputs:
      tools_ref:
        description: >
          Ref of firstsun-dev/.github providing actions/cf-preview tooling.
          MUST equal the ref the caller pins this workflow at (SHA or immutable v2.x.y).
        type: string
        required: true
      app_name:
        description: Unique deployment/identity name (e.g. www, heaven-id). Part of the Preview identity (Worker scope).
        type: string
        required: true
      app_path:
        type: string
        default: .
      app_version:
        type: string
        default: ''
      deployment_strategy:
        description: production-preview | hybrid | production-only
        type: string
        default: production-preview
      preview_on_branch_push:
        description: Feature Native Preview — one stable Preview URL per non-main branch. Independent of shared_dev_on_branch_push.
        type: boolean
        default: true
      shared_dev_on_branch_push:
        description: >
          Shared Dev — every non-main branch push deploys the ONE configured Dev Worker (app_url_dev); the last
          verified deployment wins. Independent of preview_on_branch_push. Rejected with production-only.
        type: boolean
        default: false
      shared_dev_native_preview_on_branch_push:
        description: >
          Native Dev — every non-main branch push updates the ONE stable, named Native Preview `dev` (host Worker =
          preview_worker_name or app_name, `[previews]` bindings; NOT a Wrangler [env.dev] Worker). The last verified
          deployment of ANY branch wins; pushes are serialized per Worker. Independent of preview_on_branch_push; conflicts
          with shared_dev_on_branch_push (two automatic Dev channels). Rejected with production-only.
        type: boolean
        default: false
      preview_worker_name:
        description: >
          Host Native Previews under this existing Worker instead of the config's `name`
          (wrangler preview --worker-name). Use when the production Worker must keep workers.dev /
          Preview URLs disabled (Preview URLs need Worker-level previews_enabled).
        type: string
        default: ''
      wrangler_config:
        description: Source Wrangler config path relative to app_path
        type: string
        default: wrangler.toml
      # ---- CI (one job; these are steps) ----
      lint_cmd:
        type: string
        default: ''
      typecheck_cmd:
        type: string
        default: ''
      test_unit_cmd:
        type: string
        default: ''
      test_integration_cmd:
        type: string
        default: ''
      build_cmd:
        description: >
          Application build, run from app_path. The Build Validation job runs it as validation (no deploy artifact);
          Deploy runs it again, independently, for the real target (build_env_prod / build_env_preview).
        type: string
        required: true
      ci_env:
        description: Extra nonsecret env for the Lint/Typecheck/Unit/Integration/Build Validation jobs, one KEY=VALUE per line (applied after the target build env)
        type: string
        default: ''
      use_mailpit:
        description: Start Mailpit for integration/E2E tests
        type: boolean
        default: false
      # ---- E2E (own setup and own test build) ----
      test_e2e_cmd:
        description: E2E command. Empty = no E2E job (an intentional skip never blocks Migration/Deploy).
        type: string
        default: ''
      test_e2e_setup_cmd:
        type: string
        default: ''
      test_e2e_build_cmd:
        description: Test build for E2E (local URLs, mock services). Never reused for Deploy.
        type: string
        default: ''
      test_e2e_variants:
        description: JSON array of E2E variants (name, args, artifact_suffix); the default is a single run.
        type: string
        default: '[{"name":"","args":"","artifact_suffix":""}]'
      test_e2e_env:
        description: Extra env vars for E2E, one KEY=VALUE per line
        type: string
        default: ''
      # ---- Deploy ----
      build_env_prod:
        description: Build-time env for the Production build, one KEY=VALUE per line (VITE_APP_ENV/VERSION are set automatically)
        type: string
        default: ''
      build_env_preview:
        description: Build-time env for the Preview build, one KEY=VALUE per line
        type: string
        default: ''
      build_env_shared_dev_native_preview:
        description: Build-time env for the Native Dev build, one KEY=VALUE per line (never falls back to build_env_preview / build_env_prod / build_env_dev; each target compiles its own URLs)
        type: string
        default: ''
      app_url_shared_dev_native_preview:
        description: >
          Optional canonical URL of the Native Dev Preview, known before the build. When set it is exported to the build as
          CFV2_TARGET_URL and the URL Cloudflare returns after the publish MUST equal it (otherwise the publish is rejected: the
          build embeds the wrong URL). Also used as the smoke target.
        type: string
        default: ''
      preview_url_suffix:
        description: >
          Optional host suffix of the Preview URLs (`-<worker>.<subdomain>.workers.dev` for workers.dev, `.<custom domain>` for custom-domain
          Preview hosting): the canonical Preview URL is `https://<preview-name><suffix>` (Cloudflare Previews documentation). Normally
          empty: the suffix is read from Cloudflare (Workers subdomain API `preview_url_suffix`) BEFORE the build. Required for custom-domain
          hosting (preview_host_check: false); when both exist they must agree.
        type: string
        default: ''
      smoke_mode:
        description: >
          full (default: built-in HTTP probe + smoke_cmd, current behaviour) | basic (content-level HTTP/health verification
          only, no smoke_cmd) | skip (no request at all: the deployment is Published/Unverified - never Verified, never
          known-good, never released). Applies to every delivery kind unless smoke_mode_overrides names it.
        type: string
        default: full
      smoke_mode_overrides:
        description: 'Optional JSON object keyed by delivery kind (production | native-branch | native-dev | persistent-dev), e.g. {"native-dev":"basic"}; values full | basic | skip. Unknown keys / values fail the plan.'
        type: string
        default: '{}'
      build_env_dev:
        description: Build-time env for the Shared Dev build, one KEY=VALUE per line (never falls back to the Preview or Production env)
        type: string
        default: ''
      smoke_cmd:
        description: Smoke command from app_path (both targets); receives TARGET_URL, EXPECTED_SHA, DEPLOY_TARGET. Default is an HTTP 2xx probe.
        type: string
        default: ''
      smoke_env:
        description: Extra env vars for smoke_cmd, one KEY=VALUE per line
        type: string
        default: ''
      access_protected_targets:
        description: >
          Space-separated targets (preview and/or prod) where a redirect to Cloudflare Access counts as LIVENESS only
          (published but NOT content/SHA-verified: no Release, not a known-good deployment). Any target not listed fails
          smoke on an Access redirect. For content verification of an Access-protected target, send service-token
          headers through smoke_env PROBE_HEADERS so the probe reaches the application itself.
        type: string
        default: preview
      probe_path:
        description: >
          Path the built-in liveness probe requests on the deployed URL (default `/`). Use when the Worker has no
          route at `/` (e.g. an API-only Worker). Must start with `/`. Applies to Production, Preview and Dev.
        type: string
        default: /
      probe_expect_status:
        description: >
          Exact HTTP status the probe must see at probe_path (e.g. `405` for a POST-only route). Empty = any 2xx. A
          redirect to Cloudflare Access is still handled by access_protected_targets. Pair it with smoke_cmd for
          application-level assertions.
        type: string
        default: ''
      sha_path:
        description: Optional path (e.g. /version.json) that must contain the commit SHA once served (smoke_level content-sha)
        type: string
        default: ''
      preview_host_check:
        description: >
          Before a Native Preview publish, read-only check that the host Worker has previews_enabled (Cloudflare
          Workers subdomain API). Set false for approved custom-domain Preview hosting, where that flag does not
          apply; the strict post-publish URL validation always runs.
        type: boolean
        default: true
      preview_binding_allow:
        description: Space-separated approved high-risk Preview bindings, e.g. "services:ID hyperdrive:H"
        type: string
        default: ''
      preview_deny_resources:
        description: Space-separated Production resource identities Previews must never bind
        type: string
        default: ''
      app_url_prod:
        description: Production URL (environment URL, smoke target)
        type: string
        default: ''
      production_rollback_policy:
        description: automatic | manual | disabled. Worker rollback never reverts D1 schema.
        type: string
        default: manual
      # ---- Migration ----
      d1_migrations:
        description: >
          The Worker has remote D1 migrations; enables the Migration STEP of the delivery engine (after the build and
          config audit, before the publish). Production, Preview and Shared Dev apply the same project-owned SQL to
          their own D1. Leave false for D1-less Workers.
        type: boolean
        default: false
      d1_binding:
        description: D1 binding to migrate when the target declares more than one
        type: string
        default: ''
      d1_lock_scope:
        description: >
          Identity of the PHYSICAL shared D1 (default: app_name). Apps in this repository that share one D1 must use
          the same value so their runs are serialized together: it names the run-level concurrency group (separate
          Production and non-Production groups) and the Shared Dev / persistent-Dev group. GitHub concurrency is
          repository-scoped: it CANNOT lock a D1 shared with ANOTHER repository.
        type: string
        default: ''
      d1_rollback_compat:
        description: >
          Expand/contract attestation for AUTOMATIC Production rollback (production_rollback_policy: automatic). A Worker
          rollback never reverts D1. `expand-contract` = the previous Worker version keeps working on the schema this
          run migrates to (migrations are additive, destructive changes ship one release later). With any other value
          (default `unknown`) a rollback after a run that APPLIED D1 migrations is blocked (fail closed; manual commands
          are printed); the engine additionally refuses it when the applied SQL is not provably additive. Without
          pending migrations the rollback is unaffected.
        type: string
        default: unknown
      # ---- Release ----
      release_cmd:
        description: Optional main-only release command (e.g. semantic-release), run after a verified Production deploy
        type: string
        default: ''
      # ---- Hybrid persistent Dev ----
      persistent_dev_ref:
        description: Approved ref (refs/heads/...) allowed to deploy persistent Dev via dispatch
        type: string
        default: ''
      dev_deploy_cmd:
        description: >
          OPTIONAL publish-only command for the Dev Worker (default: `wrangler deploy --config <audited config>`).
          The engine builds with dev_build_cmd (or build_cmd) and audits the effective config FIRST; this command runs
          afterwards with CF_AUDITED_CONFIG exported, must publish THAT config (`wrangler deploy --config
          "$CF_AUDITED_CONFIG"`) and must not rebuild: a changed config or deployable fails the run. Legacy manual
          dispatch (dev_build_cmd empty): dev_deploy_cmd builds and publishes exactly as before.
        type: string
        default: ''
      dev_smoke_cmd:
        description: Dev smoke command (persistent-dev and Shared Dev); Shared Dev also receives TARGET_URL=app_url_dev, EXPECTED_SHA, DEPLOY_TARGET=dev
        type: string
        default: ''
      app_url_dev:
        description: Stable Shared Dev URL (environment URL, smoke target). Required when shared_dev_on_branch_push is true.
        type: string
        default: ''
      dev_build_cmd:
        description: Dev build from app_path (with build_env_dev), build only; falls back to build_cmd when empty. REQUIRED with d1_migrations (the Dev build must succeed before the Dev D1 is migrated). Setting it also opts the manual persistent-dev dispatch into the engine. Leave empty only for a legacy persistent-dev caller whose dev_deploy_cmd builds itself.
        type: string
        default: ''
      dev_wrangler_env:
        description: Named Wrangler environment of the Shared Dev Worker (exported as CLOUDFLARE_ENV; its D1 is env.<name>.d1_databases)
        type: string
        default: dev
      dev_binding_allow:
        description: >
          Shared Dev resource-sharing approvals, whitespace/newline separated `kind:BINDING=exact-identity`
          (r2_buckets=bucket_name, kv_namespaces=id, vectorize=index_name, analytics_engine_datasets=dataset,
          services=worker[#environment]). Only the exact resource is approved; any other bucket/id/service, an unknown
          kind, a D1, a malformed or duplicate entry, or an entry matching no Dev binding fails the audit.
          Example: `r2_buckets:SHINYI_MUYU_VOICE_CACHE=firstsun-blog-assets`.
        type: string
        default: ''
      dev_deny_resources:
        description: Space-separated resource identities (bucket, id, queue, Worker) Shared Dev must never bind. Independent of preview_deny_resources; always wins over dev_binding_allow.
        type: string
        default: ''
      dev_worker_name:
        description: Expected Worker name of the Shared Dev deployment; the Astro/adapter-generated effective Wrangler config must match it (e.g. blog-preview)
        type: string
        default: ''
      dispatch_target:
        description: Pass github.event.inputs.target from the caller; "persistent-dev" triggers the protected Dev path
        type: string
        default: ''
      pipeline_phase:
        description: >
          all (default) | deploy | verify. Opt-in split for a Worker whose Smoke must wait for ANOTHER Worker's job (a job
          inside a reusable workflow cannot `needs` a job of a different call). `deploy` = CI/E2E, Migration, Deploy
          and Shared Dev publish; NO smoke, rollback or release; its `phase_state` output is the hand-off. `verify` = a
          SECOND call (same workflow, `needs` the deploy call and the other Worker's call) that runs only Smoke,
          Rollback, Shared Dev smoke / recovery and Release. The default `all` is the unchanged single call.
        type: string
        default: all
      phase_state:
        description: pipeline_phase verify only - the `phase_state` output of the deploy call, passed unchanged. Validated as data; the engine inputs come from it, so a verify call repeats only app_name, app_path, tools_ref, runner, production_rollback_policy, release_cmd and the secrets.
        type: string
        default: '{}'
      upstream_gate:
        description: pipeline_phase verify only - `needs.<job>.result` of the job the cross-service smoke depends on. success or skipped (unchanged Worker, existing verified environment) satisfies it; anything else blocks the verification, fail closed (no rollback)
        type: string
        default: ''
      runner:
        type: string
        default: linux
    secrets:
      CLOUDFLARE_API_TOKEN:
        description: Account token for Production, Preview and Dev
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false
      PREVIEW_SECRETS:
        description: Optional KEY=VALUE lines of Preview-only secrets exported to the Preview build and smoke
        required: false
      SMOKE_USERNAME:
        required: false
      SMOKE_PASSWORD:
        required: false
      RELEASE_TOKEN:
        description: Token for release_cmd (exported as GH_TOKEN); defaults to nothing, GITHUB_TOKEN is NOT used for releases
        required: false

# One run-level concurrency group per piece of shared mutable state (GitHub `concurrency` cannot span two jobs, so
# the whole RUN is the unit; CI and E2E still run in parallel inside a run). `queue: max` keeps FIFO instead of
# cancelling an older pending run (beyond 100 GitHub cancels the extra run: fail-closed, it deploys nothing).
# The identity is the RESOURCE, not the app: `d1_lock_scope` replaces app_name so apps that share one physical D1
# share one group, and Production and non-Production are always different groups:
#   main                               -> cfv2-prod-<d1_lock_scope|app_name>
#   branch, d1_migrations, a non-main channel enabled (Preview and/or Shared Dev, strategy != production-only)
#                                      -> cfv2-nonprod-d1-<d1_lock_scope|app_name>   (Preview AND Shared Dev D1)
#   branch, Shared Dev on, no D1 lock  -> cfv2-shared-dev-<app_name>                  (the ONE Dev Worker)
#   branch, both channels off          -> cfv2-<app_name>-preview-<branch>            (CI-only: no shared D1 serialization)
#   PR / delete / persistent-dev / any other event -> a private group (never queues behind a deploy)
# The Shared Dev and persistent-Dev jobs additionally share the job-level group cfv2-dev-<repo>-<scope|app_name>.
# The `cfv2-` prefix is static on purpose: never reuse it (or ${{ github.workflow }}) in a CALLER group, or caller
# and callee deadlock. A repo-local group does NOT protect a D1 shared with another repository.
# `queue` is not known to actionlint 1.7.12: see .github/actionlint.yaml.
concurrency:
  group: ${{ inputs.pipeline_phase == 'verify' && fromJSON(inputs.phase_state).group || (((github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dispatch_target != 'persistent-dev')) && github.ref_type == 'branch') && (github.ref == 'refs/heads/main' && format('cfv2-prod-{0}', inputs.d1_lock_scope != '' && inputs.d1_lock_scope || inputs.app_name) || (inputs.deployment_strategy != 'production-only' && (inputs.preview_on_branch_push || inputs.shared_dev_on_branch_push || inputs.shared_dev_native_preview_on_branch_push) && inputs.d1_migrations && format('cfv2-nonprod-d1-{0}', inputs.d1_lock_scope != '' && inputs.d1_lock_scope || inputs.app_name) || (inputs.deployment_strategy != 'production-only' && (inputs.shared_dev_on_branch_push || inputs.shared_dev_native_preview_on_branch_push) && format('cfv2-shared-dev-{0}', inputs.app_name) || format('cfv2-{0}-preview-{1}', inputs.app_name, github.ref_name)))) || format('cfv2-run-{0}', github.run_id)) }}
  queue: max

permissions:
  contents: read

# bash -eo pipefail everywhere.
defaults:
  run:
    shell: bash

env:
  NODE_VERSION: 24
  PNPM_STORE_PATH: /cache/pnpm-store
  TOOLS_DIR: .cf-tools/actions/cf-preview
  PLAYWRIGHT_BROWSERS_PATH: /opt/playwright-browsers

jobs:
  # -------------------------------------------------------------------------
  # Validation — six independent jobs, no `needs` between them: each has its own checkout / setup / logs / check
  # conclusion and can be re-run alone. Bodies are actions/cf-ci-check. None receives Cloudflare credentials and
  # none uploads a build artifact (Build Validation builds for validation only; the engine builds again for its
  # real target). Same-repo PRs are covered by the push run of the same SHA; fork PRs run these credential-free.
  # -------------------------------------------------------------------------
  lint:
    name: Lint
    if: inputs.lint_cmd != '' && github.event_name != 'delete' && inputs.dispatch_target != 'persistent-dev' && inputs.pipeline_phase != 'verify' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Fetch CI action and env-import tool
        uses: actions/checkout@v6
        with:
          repository: firstsun-dev/.github
          ref: ${{ inputs.tools_ref }}
          path: .cf-tools
          sparse-checkout: |
            actions/cf-ci-check
            actions/cf-preview/parse-env.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: ./.cf-tools/actions/cf-ci-check
        with:
          title: Lint
          cmd: ${{ inputs.lint_cmd }}
          app_path: ${{ inputs.app_path }}
          build_env_prod: ${{ inputs.build_env_prod }}
          build_env_preview: ${{ inputs.build_env_preview }}
          ci_env: ${{ inputs.ci_env }}
          app_version: ${{ inputs.app_version }}
  typecheck:
    name: Typecheck
    if: inputs.typecheck_cmd != '' && github.event_name != 'delete' && inputs.dispatch_target != 'persistent-dev' && inputs.pipeline_phase != 'verify' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Fetch CI action and env-import tool
        uses: actions/checkout@v6
        with:
          repository: firstsun-dev/.github
          ref: ${{ inputs.tools_ref }}
          path: .cf-tools
          sparse-checkout: |
            actions/cf-ci-check
            actions/cf-preview/parse-env.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: ./.cf-tools/actions/cf-ci-check
        with:
          title: Typecheck
          cmd: ${{ inputs.typecheck_cmd }}
          app_path: ${{ inputs.app_path }}
          build_env_prod: ${{ inputs.build_env_prod }}
          build_env_preview: ${{ inputs.build_env_preview }}
          ci_env: ${{ inputs.ci_env }}
          app_version: ${{ inputs.app_version }}
  unit:
    name: Unit Tests
    if: inputs.test_unit_cmd != '' && github.event_name != 'delete' && inputs.dispatch_target != 'persistent-dev' && inputs.pipeline_phase != 'verify' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Fetch CI action and env-import tool
        uses: actions/checkout@v6
        with:
          repository: firstsun-dev/.github
          ref: ${{ inputs.tools_ref }}
          path: .cf-tools
          sparse-checkout: |
            actions/cf-ci-check
            actions/cf-preview/parse-env.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: ./.cf-tools/actions/cf-ci-check
        with:
          title: Unit Tests
          cmd: ${{ inputs.test_unit_cmd }}
          app_path: ${{ inputs.app_path }}
          build_env_prod: ${{ inputs.build_env_prod }}
          build_env_preview: ${{ inputs.build_env_preview }}
          ci_env: ${{ inputs.ci_env }}
          app_version: ${{ inputs.app_version }}
          use_mailpit: ${{ inputs.use_mailpit }}
  integration:
    name: Integration Tests
    if: inputs.test_integration_cmd != '' && github.event_name != 'delete' && inputs.dispatch_target != 'persistent-dev' && inputs.pipeline_phase != 'verify' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Fetch CI action and env-import tool
        uses: actions/checkout@v6
        with:
          repository: firstsun-dev/.github
          ref: ${{ inputs.tools_ref }}
          path: .cf-tools
          sparse-checkout: |
            actions/cf-ci-check
            actions/cf-preview/parse-env.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: ./.cf-tools/actions/cf-ci-check
        with:
          title: Integration Tests
          cmd: ${{ inputs.test_integration_cmd }}
          app_path: ${{ inputs.app_path }}
          build_env_prod: ${{ inputs.build_env_prod }}
          build_env_preview: ${{ inputs.build_env_preview }}
          ci_env: ${{ inputs.ci_env }}
          app_version: ${{ inputs.app_version }}
          use_mailpit: ${{ inputs.use_mailpit }}
  build:
    name: Build Validation
    if: github.event_name != 'delete' && inputs.dispatch_target != 'persistent-dev' && inputs.pipeline_phase != 'verify' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Fetch CI action and env-import tool
        uses: actions/checkout@v6
        with:
          repository: firstsun-dev/.github
          ref: ${{ inputs.tools_ref }}
          path: .cf-tools
          sparse-checkout: |
            actions/cf-ci-check
            actions/cf-preview/parse-env.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: ./.cf-tools/actions/cf-ci-check
        with:
          title: Build Validation
          cmd: ${{ inputs.build_cmd }}
          app_path: ${{ inputs.app_path }}
          build_env_prod: ${{ inputs.build_env_prod }}
          build_env_preview: ${{ inputs.build_env_preview }}
          ci_env: ${{ inputs.ci_env }}
          app_version: ${{ inputs.app_version }}

  # E2E — own setup and own TEST build (local URLs, mock services); never reused for a deployment.
  e2e:
    name: E2E
    if: inputs.test_e2e_cmd != '' && github.event_name != 'delete' && inputs.dispatch_target != 'persistent-dev' && inputs.pipeline_phase != 'verify' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository)
    strategy:
      fail-fast: false
      matrix:
        e2e: ${{ fromJSON(inputs.test_e2e_variants) }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 45
    env:
      E2E_ENV: ${{ inputs.test_e2e_env }}
    steps:
      - uses: actions/checkout@v6
      - name: Fetch env-import tool
        uses: actions/checkout@v6
        with:
          repository: firstsun-dev/.github
          ref: ${{ inputs.tools_ref }}
          path: .cf-tools
          sparse-checkout: actions/cf-preview/parse-env.mjs
          sparse-checkout-cone-mode: false
      - name: Import E2E env
        run: |
          node "$TOOLS_DIR/parse-env.mjs" E2E_ENV "$GITHUB_ENV"
          rm -rf .cf-tools
      - uses: firstsun-dev/.github/actions/setup@v1
        with:
          setup-node: 'false'
          setup-pnpm: 'false'
      - name: Start Mailpit
        if: inputs.use_mailpit
        uses: firstsun-dev/.github/actions/mailpit@v1
      - name: E2E setup
        if: inputs.test_e2e_setup_cmd != ''
        working-directory: ${{ inputs.app_path }}
        env:
          CMD: ${{ inputs.test_e2e_setup_cmd }}
        run: bash -c "$CMD"
      - name: E2E test build
        if: inputs.test_e2e_build_cmd != ''
        working-directory: ${{ inputs.app_path }}
        env:
          CMD: ${{ inputs.test_e2e_build_cmd }}
        run: bash -c "$CMD"
      - name: E2E tests
        working-directory: ${{ inputs.app_path }}
        env:
          CMD: ${{ inputs.test_e2e_cmd }} ${{ matrix.e2e.args }}
        run: bash -c "$CMD"
      # Failure-only evidence with short retention; never a delivery dependency.
      - name: Upload E2E report (failure only)
        uses: actions/upload-artifact@v7
        if: failure()
        continue-on-error: true
        with:
          name: ${{ matrix.e2e.artifact_suffix != '' && format('e2e-report-{0}-{1}-{2}', inputs.app_name, matrix.e2e.artifact_suffix, github.run_id) || format('e2e-report-{0}-{1}', inputs.app_name, github.run_id) }}
          path: |
            ${{ inputs.app_path }}/playwright-report/
            ${{ inputs.app_path }}/test-results/
          if-no-files-found: ignore
          retention-days: 3

  # -------------------------------------------------------------------------
  # Validation Gate — the ONE aggregation of the six independent validation jobs above. Every CONFIGURED job must have
  # succeeded; an unconfigured one must have been skipped; anything else (failure, cancellation, unexpected skip) is
  # fail-closed. Planning, Migration and every delivery depend on this gate and on nothing else upstream.
  # -------------------------------------------------------------------------
  gate:
    name: Validation Gate
    needs: [lint, typecheck, unit, integration, build, e2e]
    if: always() && inputs.pipeline_phase != 'verify' && github.event_name != 'delete' && inputs.dispatch_target != 'persistent-dev' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 5
    steps:
      - name: Every configured validation job succeeded
        env:
          LINT: ${{ needs.lint.result }}
          LINT_CONFIGURED: ${{ inputs.lint_cmd != '' }}
          TYPECHECK: ${{ needs.typecheck.result }}
          TYPECHECK_CONFIGURED: ${{ inputs.typecheck_cmd != '' }}
          UNIT: ${{ needs.unit.result }}
          UNIT_CONFIGURED: ${{ inputs.test_unit_cmd != '' }}
          INTEGRATION: ${{ needs.integration.result }}
          INTEGRATION_CONFIGURED: ${{ inputs.test_integration_cmd != '' }}
          BUILD: ${{ needs.build.result }}
          BUILD_CONFIGURED: 'true'
          E2E: ${{ needs.e2e.result }}
          E2E_CONFIGURED: ${{ inputs.test_e2e_cmd != '' }}
        run: |
          bad=0
          for j in LINT TYPECHECK UNIT INTEGRATION BUILD E2E; do
            r="${j}"; c="${j}_CONFIGURED"
            if [ "${!c}" = true ]; then
              [ "${!r}" = success ] || { echo "::error::$j finished '${!r}' (configured: must succeed)"; bad=1; }
            else
              [ "${!r}" = skipped ] || { echo "::error::$j is not configured but finished '${!r}'"; bad=1; }
            fi
          done
          [ "$bad" = 0 ] || exit 1
          echo "Validation Gate passed."

  # -------------------------------------------------------------------------
  # Delivery plan — pure data, no Cloudflare credentials. Resolves the enabled delivery kinds of THIS event (production |
  # native-branch | native-dev | persistent-dev: exactly the enabled ones, no phantom paths), validates smoke modes and the Dev
  # channel combination, and groups the kinds by PHYSICAL D1 (account/database id): per kind `on_<kind>`, the D1 id `d1_<kind>`,
  # the kind that OWNS that D1's migration `owner_of_<kind>` and `owns_<kind>`. pipeline_phase verify re-uses the kinds handed over
  # in phase_state. Everything downstream is one `uses:` call of the internal _cf-worker-delivery.yml per kind (no matrix).
  # -------------------------------------------------------------------------
  plan:
    name: Delivery plan
    needs: [gate]
    if: always() && (inputs.pipeline_phase == 'verify' || (needs.gate.result == 'success' && github.ref_type == 'branch' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')))
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    outputs:
      kinds: ${{ steps.plan.outputs.kinds }}
      has_targets: ${{ steps.plan.outputs.has_targets }}
      has_migrations: ${{ steps.plan.outputs.has_migrations }}
      on_production: ${{ steps.plan.outputs.on_production }}
      d1_production: ${{ steps.plan.outputs.d1_production }}
      owner_of_production: ${{ steps.plan.outputs.owner_of_production }}
      owns_production: ${{ steps.plan.outputs.owns_production }}
      on_native_branch: ${{ steps.plan.outputs.on_native_branch }}
      d1_native_branch: ${{ steps.plan.outputs.d1_native_branch }}
      owner_of_native_branch: ${{ steps.plan.outputs.owner_of_native_branch }}
      owns_native_branch: ${{ steps.plan.outputs.owns_native_branch }}
      on_native_dev: ${{ steps.plan.outputs.on_native_dev }}
      d1_native_dev: ${{ steps.plan.outputs.d1_native_dev }}
      owner_of_native_dev: ${{ steps.plan.outputs.owner_of_native_dev }}
      owns_native_dev: ${{ steps.plan.outputs.owns_native_dev }}
      on_persistent_dev: ${{ steps.plan.outputs.on_persistent_dev }}
      d1_persistent_dev: ${{ steps.plan.outputs.d1_persistent_dev }}
      owner_of_persistent_dev: ${{ steps.plan.outputs.owner_of_persistent_dev }}
      owns_persistent_dev: ${{ steps.plan.outputs.owns_persistent_dev }}
    steps:
      - uses: actions/checkout@v6
        if: inputs.pipeline_phase != 'verify'
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Fetch delivery tooling
        uses: actions/checkout@v6
        with:
          repository: firstsun-dev/.github
          ref: ${{ inputs.tools_ref }}
          path: .cf-tools
          sparse-checkout: actions/cf-preview
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: cd "$TOOLS_DIR" && npm ci --ignore-scripts --no-audit --no-fund
      - id: plan
        env:
          INPUTS_JSON: ${{ toJSON(inputs) }}
          PHASE_STATE: ${{ inputs.pipeline_phase == 'verify' && inputs.phase_state || '{}' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PHASE: ${{ inputs.pipeline_phase }}
        run: |
          node "$TOOLS_DIR/cli.mjs" plan --event "$GITHUB_EVENT_NAME" --ref "$GITHUB_REF" --phase "$PHASE" --app-dir "$GITHUB_WORKSPACE/${{ inputs.app_path }}" | tee -a "$GITHUB_OUTPUT"

  # =========================================================================
  # Stage 1 — Preflight: ONE call per enabled kind (stage preflight). Non-publishing: canonical URL resolved from the real Preview
  # identity, target build, effective-config audit, exact D1 binding == the plan's D1. Runs only with d1_migrations (the D1-less
  # path has nothing to pre-validate before a mutation).
  # =========================================================================
  preflight_production:
    name: Preflight (production)
    needs: [gate, plan]
    if: always() && inputs.pipeline_phase != 'verify' && inputs.d1_migrations && needs.gate.result == 'success' && needs.plan.result == 'success' && needs.plan.outputs.on_production == 'true'
    uses: ./.github/workflows/_cf-worker-delivery.yml
    permissions: # ceiling for EVERY job of the called workflow (incl. skipped ones): the stage's own jobs still request read-only
      contents: read
      deployments: write
      pull-requests: write
    with:
      stage: preflight
      kind: production
      target: prod
      tools_ref: ${{ inputs.tools_ref }}
      runner: ${{ inputs.runner }}
      environment: ${{ format('{0}/prod', inputs.app_name) }}
      inputs_json: ${{ toJSON(inputs) }}
      d1_expected_id: ${{ needs.plan.outputs.d1_production }}
      deploy_group: ${{ format('cfv2-leg-{0}-production', github.run_id) }}
      rollback_group: ${{ format('cfv2-leg-{0}-production-rollback', github.run_id) }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PREVIEW_SECRETS: ${{ secrets.PREVIEW_SECRETS }}

  preflight_native_branch:
    name: Preflight (native-branch)
    needs: [gate, plan]
    if: always() && inputs.pipeline_phase != 'verify' && inputs.d1_migrations && needs.gate.result == 'success' && needs.plan.result == 'success' && needs.plan.outputs.on_native_branch == 'true'
    uses: ./.github/workflows/_cf-worker-delivery.yml
    permissions: # ceiling for EVERY job of the called workflow (incl. skipped ones): the stage's own jobs still request read-only
      contents: read
      deployments: write
      pull-requests: write
    with:
      stage: preflight
      kind: native-branch
      target: preview
      tools_ref: ${{ inputs.tools_ref }}
      runner: ${{ inputs.runner }}
      environment: ${{ format('{0}/preview', inputs.app_name) }}
      inputs_json: ${{ toJSON(inputs) }}
      d1_expected_id: ${{ needs.plan.outputs.d1_native_branch }}
      deploy_group: ${{ format('cfv2-leg-{0}-native-branch', github.run_id) }}
      rollback_group: ${{ format('cfv2-leg-{0}-native-branch-rollback', github.run_id) }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PREVIEW_SECRETS: ${{ secrets.PREVIEW_SECRETS }}

  preflight_native_dev:
    name: Preflight (native-dev)
    needs: [gate, plan]
    if: always() && inputs.pipeline_phase != 'verify' && inputs.d1_migrations && needs.gate.result == 'success' && needs.plan.result == 'success' && needs.plan.outputs.on_native_dev == 'true'
    uses: ./.github/workflows/_cf-worker-delivery.yml
    permissions: # ceiling for EVERY job of the called workflow (incl. skipped ones): the stage's own jobs still request read-only
      contents: read
      deployments: write
      pull-requests: write
    with:
      stage: preflight
      kind: native-dev
      target: preview
      tools_ref: ${{ inputs.tools_ref }}
      runner: ${{ inputs.runner }}
      environment: ${{ format('{0}/native-dev', inputs.app_name) }}
      inputs_json: ${{ toJSON(inputs) }}
      d1_expected_id: ${{ needs.plan.outputs.d1_native_dev }}
      deploy_group: ${{ format('cfv2-leg-{0}-native-dev', github.run_id) }}
      rollback_group: ${{ format('cfv2-leg-{0}-native-dev-rollback', github.run_id) }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PREVIEW_SECRETS: ${{ secrets.PREVIEW_SECRETS }}

  preflight_persistent_dev:
    name: Preflight (persistent-dev)
    needs: [gate, plan]
    if: always() && inputs.pipeline_phase != 'verify' && inputs.d1_migrations && needs.gate.result == 'success' && needs.plan.result == 'success' && needs.plan.outputs.on_persistent_dev == 'true'
    uses: ./.github/workflows/_cf-worker-delivery.yml
    permissions: # ceiling for EVERY job of the called workflow (incl. skipped ones): the stage's own jobs still request read-only
      contents: read
      deployments: write
      pull-requests: write
    with:
      stage: preflight
      kind: persistent-dev
      target: dev
      tools_ref: ${{ inputs.tools_ref }}
      runner: ${{ inputs.runner }}
      environment: ${{ format('{0}/dev', inputs.app_name) }}
      inputs_json: ${{ toJSON(inputs) }}
      d1_expected_id: ${{ needs.plan.outputs.d1_persistent_dev }}
      deploy_group: ${{ format('cfv2-leg-{0}-persistent-dev', github.run_id) }}
      rollback_group: ${{ format('cfv2-leg-{0}-persistent-dev-rollback', github.run_id) }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PREVIEW_SECRETS: ${{ secrets.PREVIEW_SECRETS }}

  # =========================================================================
  # Stage 2 — Migration: one call per OWNER of a distinct physical D1 (`owns_<kind>` from the plan). A D1 shared by Native Branch and
  # Native Dev is migrated once, by the Native Branch call. Every migration waits for the preflight of EVERY enabled target
  # (`peers`), so no schema change happens while any target is unvalidated. Independent of every Deploy / Smoke / Rollback.
  # =========================================================================
  migration_production:
    name: Migration (production)
    needs: [plan, preflight_production, preflight_native_branch, preflight_native_dev, preflight_persistent_dev]
    if: always() && inputs.pipeline_phase != 'verify' && inputs.d1_migrations && needs.plan.result == 'success' && needs.plan.outputs.owns_production == 'true'
    uses: ./.github/workflows/_cf-worker-delivery.yml
    permissions: # ceiling for EVERY job of the called workflow (incl. skipped ones): the stage's own jobs still request read-only
      contents: read
      deployments: write
      pull-requests: write
    with:
      stage: migrate
      kind: production
      target: prod
      tools_ref: ${{ inputs.tools_ref }}
      runner: ${{ inputs.runner }}
      environment: ${{ format('{0}/prod', inputs.app_name) }}
      inputs_json: ${{ toJSON(inputs) }}
      d1_migrations: ${{ inputs.d1_migrations }}
      d1_expected_id: ${{ needs.plan.outputs.d1_production }}
      kinds: ${{ needs.plan.outputs.kinds }}
      peers: ${{ format('{{"production":"{0}","native-branch":"{1}","native-dev":"{2}","persistent-dev":"{3}"}}', needs.preflight_production.result, needs.preflight_native_branch.result, needs.preflight_native_dev.result, needs.preflight_persistent_dev.result) }}
      deploy_group: ${{ format('cfv2-leg-{0}-production', github.run_id) }}
      rollback_group: ${{ format('cfv2-leg-{0}-production-rollback', github.run_id) }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PREVIEW_SECRETS: ${{ secrets.PREVIEW_SECRETS }}

  migration_native_branch:
    name: Migration (native-branch)
    needs: [plan, preflight_production, preflight_native_branch, preflight_native_dev, preflight_persistent_dev]
    if: always() && inputs.pipeline_phase != 'verify' && inputs.d1_migrations && needs.plan.result == 'success' && needs.plan.outputs.owns_native_branch == 'true'
    uses: ./.github/workflows/_cf-worker-delivery.yml
    permissions: # ceiling for EVERY job of the called workflow (incl. skipped ones): the stage's own jobs still request read-only
      contents: read
      deployments: write
      pull-requests: write
    with:
      stage: migrate
      kind: native-branch
      target: preview
      tools_ref: ${{ inputs.tools_ref }}
      runner: ${{ inputs.runner }}
      environment: ${{ format('{0}/preview', inputs.app_name) }}
      inputs_json: ${{ toJSON(inputs) }}
      d1_migrations: ${{ inputs.d1_migrations }}
      d1_expected_id: ${{ needs.plan.outputs.d1_native_branch }}
      kinds: ${{ needs.plan.outputs.kinds }}
      peers: ${{ format('{{"production":"{0}","native-branch":"{1}","native-dev":"{2}","persistent-dev":"{3}"}}', needs.preflight_production.result, needs.preflight_native_branch.result, needs.preflight_native_dev.result, needs.preflight_persistent_dev.result) }}
      deploy_group: ${{ format('cfv2-leg-{0}-native-branch', github.run_id) }}
      rollback_group: ${{ format('cfv2-leg-{0}-native-branch-rollback', github.run_id) }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PREVIEW_SECRETS: ${{ secrets.PREVIEW_SECRETS }}

  migration_native_dev:
    name: Migration (native-dev)
    needs: [plan, preflight_production, preflight_native_branch, preflight_native_dev, preflight_persistent_dev]
    if: always() && inputs.pipeline_phase != 'verify' && inputs.d1_migrations && needs.plan.result == 'success' && needs.plan.outputs.owns_native_dev == 'true'
    uses: ./.github/workflows/_cf-worker-delivery.yml
    permissions: # ceiling for EVERY job of the called workflow (incl. skipped ones): the stage's own jobs still request read-only
      contents: read
      deployments: write
      pull-requests: write
    with:
      stage: migrate
      kind: native-dev
      target: preview
      tools_ref: ${{ inputs.tools_ref }}
      runner: ${{ inputs.runner }}
      environment: ${{ format('{0}/native-dev', inputs.app_name) }}
      inputs_json: ${{ toJSON(inputs) }}
      d1_migrations: ${{ inputs.d1_migrations }}
      d1_expected_id: ${{ needs.plan.outputs.d1_native_dev }}
      kinds: ${{ needs.plan.outputs.kinds }}
      peers: ${{ format('{{"production":"{0}","native-branch":"{1}","native-dev":"{2}","persistent-dev":"{3}"}}', needs.preflight_production.result, needs.preflight_native_branch.result, needs.preflight_native_dev.result, needs.preflight_persistent_dev.result) }}
      deploy_group: ${{ format('cfv2-leg-{0}-native-dev', github.run_id) }}
      rollback_group: ${{ format('cfv2-leg-{0}-native-dev-rollback', github.run_id) }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PREVIEW_SECRETS: ${{ secrets.PREVIEW_SECRETS }}

  migration_persistent_dev:
    name: Migration (persistent-dev)
    needs: [plan, preflight_production, preflight_native_branch, preflight_native_dev, preflight_persistent_dev]
    if: always() && inputs.pipeline_phase != 'verify' && inputs.d1_migrations && needs.plan.result == 'success' && needs.plan.outputs.owns_persistent_dev == 'true'
    uses: ./.github/workflows/_cf-worker-delivery.yml
    permissions: # ceiling for EVERY job of the called workflow (incl. skipped ones): the stage's own jobs still request read-only
      contents: read
      deployments: write
      pull-requests: write
    with:
      stage: migrate
      kind: persistent-dev
      target: dev
      tools_ref: ${{ inputs.tools_ref }}
      runner: ${{ inputs.runner }}
      environment: ${{ format('{0}/dev', inputs.app_name) }}
      inputs_json: ${{ toJSON(inputs) }}
      d1_migrations: ${{ inputs.d1_migrations }}
      d1_expected_id: ${{ needs.plan.outputs.d1_persistent_dev }}
      kinds: ${{ needs.plan.outputs.kinds }}
      peers: ${{ format('{{"production":"{0}","native-branch":"{1}","native-dev":"{2}","persistent-dev":"{3}"}}', needs.preflight_production.result, needs.preflight_native_branch.result, needs.preflight_native_dev.result, needs.preflight_persistent_dev.result) }}
      deploy_group: ${{ format('cfv2-leg-{0}-persistent-dev', github.run_id) }}
      rollback_group: ${{ format('cfv2-leg-{0}-persistent-dev-rollback', github.run_id) }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PREVIEW_SECRETS: ${{ secrets.PREVIEW_SECRETS }}

  # =========================================================================
  # Stage 3 — Delivery: ONE call per enabled kind of the SAME internal workflow (deploy -> smoke -> conditional rollback). A kind
  # needs only the Validation Gate, the plan and the migration call(s) of ITS OWN D1; it never waits for, and is never touched by,
  # another kind's Deploy / Smoke / Rollback. Each call receives ONLY its own migration result (own, or the shared-D1 owner's,
  # validated inside the call by kind + D1 id) and only its own hand-off.
  # =========================================================================
  delivery_production:
    name: Delivery (production)
    needs: [gate, plan, migration_production]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.on_production == 'true' && (inputs.pipeline_phase == 'verify' || needs.gate.result == 'success')
    uses: ./.github/workflows/_cf-worker-delivery.yml
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    with:
      stage: deliver
      kind: production
      target: prod
      tools_ref: ${{ inputs.tools_ref }}
      runner: ${{ inputs.runner }}
      environment: ${{ format('{0}/prod', inputs.app_name) }}
      inputs_json: ${{ inputs.pipeline_phase == 'verify' && toJSON(fromJSON(inputs.phase_state).inputs) || toJSON(inputs) }}
      call_inputs_json: ${{ inputs.pipeline_phase == 'verify' && toJSON(inputs) || '' }}
      phase: ${{ inputs.pipeline_phase }}
      d1_migrations: ${{ inputs.pipeline_phase == 'verify' && fromJSON(inputs.phase_state).inputs.d1_migrations || inputs.d1_migrations }}
      d1_expected_id: ${{ inputs.pipeline_phase == 'verify' && fromJSON(inputs.phase_state).d1.production || needs.plan.outputs.d1_production }}
      d1_owner_kind: ${{ needs.plan.outputs.owner_of_production }}
      own_migration_result: ${{ needs.migration_production.result }}
      own_migration_json: ${{ needs.migration_production.outputs.migration_json }}
      handoff_json: ${{ inputs.pipeline_phase == 'verify' && fromJSON(inputs.phase_state).deploy.h_production || '' }}
      migration_json_in: ${{ inputs.pipeline_phase == 'verify' && fromJSON(inputs.phase_state).migration.mj_production || '' }}
      upstream_gate: ${{ inputs.pipeline_phase == 'verify' && inputs.upstream_gate || '' }}
      deploy_group: ${{ format('cfv2-leg-{0}-production', github.run_id) }}
      rollback_group: ${{ format('cfv2-leg-{0}-production-rollback', github.run_id) }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PREVIEW_SECRETS: ${{ secrets.PREVIEW_SECRETS }}
      SMOKE_USERNAME: ${{ secrets.SMOKE_USERNAME }}
      SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}

  delivery_native_branch:
    name: Delivery (native-branch)
    needs: [gate, plan, migration_native_branch]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.on_native_branch == 'true' && (inputs.pipeline_phase == 'verify' || needs.gate.result == 'success')
    uses: ./.github/workflows/_cf-worker-delivery.yml
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    with:
      stage: deliver
      kind: native-branch
      target: preview
      tools_ref: ${{ inputs.tools_ref }}
      runner: ${{ inputs.runner }}
      environment: ${{ format('{0}/preview', inputs.app_name) }}
      inputs_json: ${{ inputs.pipeline_phase == 'verify' && toJSON(fromJSON(inputs.phase_state).inputs) || toJSON(inputs) }}
      call_inputs_json: ${{ inputs.pipeline_phase == 'verify' && toJSON(inputs) || '' }}
      phase: ${{ inputs.pipeline_phase }}
      d1_migrations: ${{ inputs.pipeline_phase == 'verify' && fromJSON(inputs.phase_state).inputs.d1_migrations || inputs.d1_migrations }}
      d1_expected_id: ${{ inputs.pipeline_phase == 'verify' && fromJSON(inputs.phase_state).d1.native_branch || needs.plan.outputs.d1_native_branch }}
      d1_owner_kind: ${{ needs.plan.outputs.owner_of_native_branch }}
      own_migration_result: ${{ needs.migration_native_branch.result }}
      own_migration_json: ${{ needs.migration_native_branch.outputs.migration_json }}
      handoff_json: ${{ inputs.pipeline_phase == 'verify' && fromJSON(inputs.phase_state).deploy.h_native_branch || '' }}
      migration_json_in: ${{ inputs.pipeline_phase == 'verify' && fromJSON(inputs.phase_state).migration.mj_native_branch || '' }}
      upstream_gate: ${{ inputs.pipeline_phase == 'verify' && inputs.upstream_gate || '' }}
      deploy_group: ${{ format('cfv2-leg-{0}-native-branch', github.run_id) }}
      rollback_group: ${{ format('cfv2-leg-{0}-native-branch-rollback', github.run_id) }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PREVIEW_SECRETS: ${{ secrets.PREVIEW_SECRETS }}
      SMOKE_USERNAME: ${{ secrets.SMOKE_USERNAME }}
      SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}

  delivery_native_dev:
    name: Delivery (native-dev)
    needs: [gate, plan, migration_native_dev, migration_native_branch]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.on_native_dev == 'true' && (inputs.pipeline_phase == 'verify' || needs.gate.result == 'success')
    uses: ./.github/workflows/_cf-worker-delivery.yml
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    with:
      stage: deliver
      kind: native-dev
      target: preview
      tools_ref: ${{ inputs.tools_ref }}
      runner: ${{ inputs.runner }}
      environment: ${{ format('{0}/native-dev', inputs.app_name) }}
      inputs_json: ${{ inputs.pipeline_phase == 'verify' && toJSON(fromJSON(inputs.phase_state).inputs) || toJSON(inputs) }}
      call_inputs_json: ${{ inputs.pipeline_phase == 'verify' && toJSON(inputs) || '' }}
      phase: ${{ inputs.pipeline_phase }}
      d1_migrations: ${{ inputs.pipeline_phase == 'verify' && fromJSON(inputs.phase_state).inputs.d1_migrations || inputs.d1_migrations }}
      d1_expected_id: ${{ inputs.pipeline_phase == 'verify' && fromJSON(inputs.phase_state).d1.native_dev || needs.plan.outputs.d1_native_dev }}
      d1_owner_kind: ${{ needs.plan.outputs.owner_of_native_dev }}
      own_migration_result: ${{ needs.migration_native_dev.result }}
      own_migration_json: ${{ needs.migration_native_dev.outputs.migration_json }}
      owner_migration_result: ${{ needs.migration_native_branch.result }}
      owner_migration_json: ${{ needs.migration_native_branch.outputs.migration_json }}
      handoff_json: ${{ inputs.pipeline_phase == 'verify' && fromJSON(inputs.phase_state).deploy.h_native_dev || '' }}
      migration_json_in: ${{ inputs.pipeline_phase == 'verify' && fromJSON(inputs.phase_state).migration.mj_native_dev || '' }}
      upstream_gate: ${{ inputs.pipeline_phase == 'verify' && inputs.upstream_gate || '' }}
      deploy_group: ${{ format('cfv2-leg-{0}-native-dev', github.run_id) }}
      rollback_group: ${{ format('cfv2-leg-{0}-native-dev-rollback', github.run_id) }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PREVIEW_SECRETS: ${{ secrets.PREVIEW_SECRETS }}
      SMOKE_USERNAME: ${{ secrets.SMOKE_USERNAME }}
      SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}

  delivery_persistent_dev:
    name: Delivery (persistent-dev)
    needs: [gate, plan, migration_persistent_dev, migration_native_branch]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.on_persistent_dev == 'true' && (inputs.pipeline_phase == 'verify' || needs.gate.result == 'success')
    uses: ./.github/workflows/_cf-worker-delivery.yml
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    with:
      stage: deliver
      kind: persistent-dev
      target: dev
      tools_ref: ${{ inputs.tools_ref }}
      runner: ${{ inputs.runner }}
      environment: ${{ format('{0}/dev', inputs.app_name) }}
      inputs_json: ${{ inputs.pipeline_phase == 'verify' && toJSON(fromJSON(inputs.phase_state).inputs) || toJSON(inputs) }}
      call_inputs_json: ${{ inputs.pipeline_phase == 'verify' && toJSON(inputs) || '' }}
      phase: ${{ inputs.pipeline_phase }}
      d1_migrations: ${{ inputs.pipeline_phase == 'verify' && fromJSON(inputs.phase_state).inputs.d1_migrations || inputs.d1_migrations }}
      d1_expected_id: ${{ inputs.pipeline_phase == 'verify' && fromJSON(inputs.phase_state).d1.persistent_dev || needs.plan.outputs.d1_persistent_dev }}
      d1_owner_kind: ${{ needs.plan.outputs.owner_of_persistent_dev }}
      own_migration_result: ${{ needs.migration_persistent_dev.result }}
      own_migration_json: ${{ needs.migration_persistent_dev.outputs.migration_json }}
      owner_migration_result: ${{ needs.migration_native_branch.result }}
      owner_migration_json: ${{ needs.migration_native_branch.outputs.migration_json }}
      handoff_json: ${{ inputs.pipeline_phase == 'verify' && fromJSON(inputs.phase_state).deploy.h_persistent_dev || '' }}
      migration_json_in: ${{ inputs.pipeline_phase == 'verify' && fromJSON(inputs.phase_state).migration.mj_persistent_dev || '' }}
      upstream_gate: ${{ inputs.pipeline_phase == 'verify' && inputs.upstream_gate || '' }}
      deploy_group: ${{ format('cfv2-dev-{0}-{1}', github.repository, inputs.d1_lock_scope != '' && inputs.d1_lock_scope || inputs.app_name) }}
      rollback_group: ${{ format('cfv2-dev-{0}-{1}', github.repository, inputs.d1_lock_scope != '' && inputs.d1_lock_scope || inputs.app_name) }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PREVIEW_SECRETS: ${{ secrets.PREVIEW_SECRETS }}
      SMOKE_USERNAME: ${{ secrets.SMOKE_USERNAME }}
      SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}

  # -------------------------------------------------------------------------
  # Release — optional, main only, only after THIS run deployed its own SHA to Production, the Production Smoke verified it at
  # content level (smoke_mode skip / liveness never qualify) and no Rollback ran. It reads ONLY the Production delivery call.
  # -------------------------------------------------------------------------
  release:
    name: Release
    needs: [delivery_production]
    if: always() && inputs.release_cmd != '' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && inputs.dispatch_target != 'persistent-dev' && inputs.pipeline_phase != 'deploy' && needs.delivery_production.result == 'success' && fromJSON(needs.delivery_production.outputs.smoke_json || '{}').deployed_and_verified == 'true' && needs.delivery_production.outputs.rollback_result == ''
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: firstsun-dev/.github/actions/setup@v1
        with:
          setup-node: 'false'
          setup-pnpm: 'false'
      - name: Release
        working-directory: ${{ inputs.app_path }}
        env:
          CMD: ${{ inputs.release_cmd }}
        run: bash -c "$CMD"

  # -------------------------------------------------------------------------
  # Config guard — a production-only Worker must never expose a Dev deployment. Fails the run on ANY event so a
  # misconfigured caller is visible, instead of silently skipping. (A production-only Worker keeps ignoring
  # preview_on_branch_push, whose default is true, for backward compatibility.)
  # -------------------------------------------------------------------------
  config-guard:
    name: Config guard
    if: inputs.pipeline_phase != 'verify' && ((inputs.deployment_strategy == 'production-only' && (inputs.shared_dev_on_branch_push || inputs.shared_dev_native_preview_on_branch_push)) || (inputs.shared_dev_on_branch_push && inputs.shared_dev_native_preview_on_branch_push))
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 2
    steps:
      - run: |
          echo "::error::Invalid Dev channel configuration: production-only cannot be combined with shared_dev_on_branch_push / shared_dev_native_preview_on_branch_push (a production-only Worker must not expose a Dev deployment), and the separate persistent Dev Worker and the Native Dev Preview are conflicting automatic Dev channels - enable only one."
          exit 1

  # -------------------------------------------------------------------------
  # Lifecycle — event-specific handler outside the core DAG. Never deploys, no Cloudflare credentials.
  #   same-repo PR : comment the branch's existing Preview URL
  #   branch delete: retire the GitHub ledger only; the Native Preview is KEPT (owner policy)
  # -------------------------------------------------------------------------
  lifecycle:
    name: Preview lifecycle
    if: inputs.pipeline_phase != 'verify' && inputs.deployment_strategy != 'production-only' && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'delete' && github.event.ref_type == 'branch'))
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    concurrency:
      group: cfv2-lifecycle-${{ github.repository }}-${{ inputs.app_name }}-${{ github.event.pull_request.head.ref || github.event.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: ${{ github.event.pull_request.head.ref || github.event.ref }}
      WORKER_NAME: ${{ inputs.preview_worker_name != '' && inputs.preview_worker_name || inputs.app_name }}
    steps:
      - name: Fetch tooling
        uses: actions/checkout@v6
        with:
          repository: firstsun-dev/.github
          ref: ${{ inputs.tools_ref }}
          path: .cf-tools
          sparse-checkout: actions/cf-preview
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: cd "$TOOLS_DIR" && npm ci --ignore-scripts --no-audit --no-fund
      - name: Compute and validate Preview identity
        env:
          APP: ${{ inputs.app_name }}
        run: |
          [ "$BRANCH" != main ] || { echo "main has no Preview"; echo "SKIP=true" >> "$GITHUB_ENV"; exit 0; }
          NAME="$(node "$TOOLS_DIR/cli.mjs" identity --repo "$GITHUB_REPOSITORY" --worker "$APP" --host-worker "$WORKER_NAME" --ref "refs/heads/$BRANCH" --reserve-native-dev "${{ inputs.shared_dev_native_preview_on_branch_push }}" | sed -n 's/^preview_name=//p')"
          [[ "$NAME" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]] || { echo "::error::unsafe name"; exit 1; }
          { echo "PREVIEW_NAME=$NAME"; echo "ENV_NAME=$APP/preview/$NAME"; } >> "$GITHUB_ENV"
      - name: Comment the existing VERIFIED Preview URL on the PR
        if: env.SKIP != 'true' && github.event_name == 'pull_request'
        env:
          APP: ${{ inputs.app_name }}
        run: |
          # Host-bound known-good lookup: same repository, application, branch ref and HOST Worker, https URL and a
          # content-level verified success. An old host (e.g. blog-preview), another branch or a liveness-only
          # deployment is never advertised.
          ROW="$("$TOOLS_DIR/gh.sh" last-good-preview "$ENV_NAME" "" "refs/heads/$BRANCH" "$WORKER_NAME" "$APP" || true)"
          [ -n "$ROW" ] || { echo "No verified Preview for this branch on host Worker $WORKER_NAME; PR comment unchanged."; exit 0; }
          "$TOOLS_DIR/gh.sh" comment "$BRANCH" "$APP" "${ROW#* }" "${ROW%% *}"
      # Policy (owner decision): deleting a branch does NOT delete its Native Preview. The Preview and its stable
      # URL are kept (Cloudflare cannot remove only the stable URL: Preview `urls` is read-only and
      # `wrangler preview delete` removes the Preview with all deployments). Only the GitHub ledger is retired.
      - name: Retire GitHub ledger (Preview is kept)
        if: env.SKIP != 'true' && github.event_name == 'delete'
        run: |
          # Names are hashless: only touch the ledger if THIS branch owns the name, and not if the branch exists again.
          OWNER="$("$TOOLS_DIR/gh.sh" owner "$ENV_NAME")"
          if [ -n "$OWNER" ] && [ "$OWNER" != "refs/heads/$BRANCH" ]; then
            echo "::notice::Name is owned by $OWNER, not this branch; leaving the ledger alone."; exit 0
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$BRANCH" >/dev/null 2>&1; then
            echo "::notice::Branch exists again; leaving the ledger alone."; exit 0
          fi
          "$TOOLS_DIR/gh.sh" retire "$ENV_NAME"
          {
            echo "### 📌 Branch \`$BRANCH\` deleted — Preview \`$PREVIEW_NAME\` is **kept**"
            echo "- Cloudflare Preview and its stable URL were not touched; GitHub Deployments are marked inactive."
            echo "- No automatic reclaim. To remove it manually:"
            echo "  \`wrangler preview delete --name $PREVIEW_NAME --worker-name $WORKER_NAME --skip-confirmation\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # -------------------------------------------------------------------------
  # Protected persistent Dev (Hybrid) — explicit dispatch on the approved ref only. Never a side effect of a
  # feature-branch push. With dev_build_cmd it is the SAME engine in manual mode (build -> audit -> migration ->
  # publish -> smoke -> ledger; no automatic recovery). Without it, the legacy two-command contract is unchanged.
  # -------------------------------------------------------------------------
  persistent-dev:
    name: Persistent Dev (Hybrid)
    if: inputs.pipeline_phase != 'verify' && github.event_name == 'workflow_dispatch' && inputs.dispatch_target == 'persistent-dev' && inputs.deployment_strategy == 'hybrid' && inputs.persistent_dev_ref != '' && github.ref == inputs.persistent_dev_ref
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 45
    environment: ${{ inputs.app_name }}/dev
    concurrency:
      group: cfv2-dev-${{ github.repository }}-${{ inputs.d1_lock_scope != '' && inputs.d1_lock_scope || inputs.app_name }}
      cancel-in-progress: false
    permissions:
      contents: read
      deployments: write # engine mode only: Dev ledger entry, recorded verified ONLY after the smoke passes
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      # ---- Legacy contract (dev_build_cmd empty): dev_deploy_cmd builds and publishes; never recorded in the Shared
      # Dev last-good ledger, so automatic recovery can never treat it as a known-good release.
      - uses: firstsun-dev/.github/actions/setup@v1
        if: inputs.dev_build_cmd == ''
        with:
          setup-node: 'false'
          setup-pnpm: 'false'
      - name: Deploy persistent Dev
        if: inputs.dev_build_cmd == ''
        working-directory: ${{ inputs.app_path }}
        env:
          CMD: ${{ inputs.dev_deploy_cmd }}
        run: |
          [ -n "$CMD" ] || { echo "::error::dev_deploy_cmd required"; exit 1; }
          bash -c "$CMD"
      - name: Dev smoke (Cron/Queue-adjacent checks)
        if: inputs.dev_build_cmd == '' && inputs.dev_smoke_cmd != ''
        working-directory: ${{ inputs.app_path }}
        env:
          CMD: ${{ inputs.dev_smoke_cmd }}
        run: bash -c "$CMD"
      # ---- Engine contract (dev_build_cmd set).
      - name: Fetch delivery tooling
        if: inputs.dev_build_cmd != ''
        uses: actions/checkout@v6
        with:
          repository: firstsun-dev/.github
          ref: ${{ inputs.tools_ref }}
          path: .cf-tools
          sparse-checkout: |
            actions/cf-deploy
            actions/cf-preview
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - id: engine
        if: inputs.dev_build_cmd != ''
        uses: ./.cf-tools/actions/cf-deploy
        with:
          target: dev
          mode: manual
          inputs_json: ${{ toJSON(inputs) }}
          smoke_username: ${{ secrets.SMOKE_USERNAME }}
          smoke_password: ${{ secrets.SMOKE_PASSWORD }}
