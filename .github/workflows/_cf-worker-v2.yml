name: CF Worker Pipeline v2

# ---------------------------------------------------------------------------
# Cloudflare Worker CI/CD v2 — stage-based CI, ONE target-driven delivery engine.
# OpenSpec: openspec/changes/simplify-cf-ci-stages-and-dev-delivery. Interface / migration guide: docs/cf-worker-v2.md
#
#   CI    (_cf-worker-ci.yml)   Plan -> [Verify tasks || Test tasks || E2E] -> Gate (fail closed). The CALLER owns the task lists.
#     |                         push = Verify; pull_request / merge_group = Verify + Test on the merge candidate; main push = Verify
#   Plan                        ONE delivery for the event, or none: target production | preview | dev x driver worker | native-preview (pure data)
#     |                           push main -> production | same-repo PR (preview_policy pr) -> preview | dispatch (approved ref) -> dev
#   Migrate                     production / dev only (a Preview never migrates): a READ-ONLY D1 precheck first; nothing pending -> verified no-op,
#     |                         NO build; pending -> audit + exact D1 binding, then the migration is applied ONCE
#   Delivery                    _cf-worker-delivery.yml: Deploy -> Smoke -> conditional Rollback (the only variation is the driver)
#     |
#   Release                     optional, main only, only after a VERIFIED Production delivery with no rollback
#
# Outside that DAG: `lifecycle` (same-repo PR closed -> retire the PR Preview ledger; the Preview is kept).
# One run delivers at most ONE target. A feature push never deploys; a manual dispatch can only promote an approved ref to Dev and can never
# deploy Production. The run-level concurrency group below spans the whole run.
#
# Shared actions / nested workflow: `uses: $/actions/<name>` and `uses: $/.github/workflows/...` (GitHub self-repository syntax,
# needs runner >= 2.336.0) resolve to THIS repository at the exact commit of the running workflow, with no checkout into the caller's workspace.
#
# Caller MUST trigger on: push (all branches), pull_request (opened, synchronize, reopened, closed), workflow_dispatch (with a `target` input
# passed as dispatch_target when Dev is enabled), and `merge_group` where a merge queue is required.
# ---------------------------------------------------------------------------

on:
  workflow_call:
    outputs:
      deploy_target:
        description: production | preview | dev (the one target this run delivered); empty when nothing was delivered
        value: ${{ jobs.plan.outputs.target }}
      deploy_driver:
        description: worker | native-preview; empty when nothing was delivered
        value: ${{ jobs.plan.outputs.driver }}
      deploy_url:
        description: URL that was published; empty when nothing was deployed. May be published-but-unverified or rolled back - gate on deploy_verified_url
        value: ${{ fromJSON(jobs.delivery.outputs.handoff || '{}').url }}
      deploy_verified_url:
        description: Same URL, only when the Smoke passed content-level verification; empty for Access-liveness-only, failed, rolled-back, smoke_mode=skip or skipped deployments
        value: ${{ fromJSON(jobs.delivery.outputs.smoke_json || '{}').verified_url }}
      deploy_published_unverified:
        description: true when the deployment is reachable but NOT content-verified (Access liveness only, or smoke_mode=skip)
        value: ${{ fromJSON(jobs.delivery.outputs.smoke_json || '{}').published_unverified }}
      deploy_verified:
        description: true ONLY when this run published its own SHA and its Smoke passed at content level
        value: ${{ fromJSON(jobs.delivery.outputs.smoke_json || '{}').deployed_and_verified }}
      deploy_smoke_level:
        description: skipped | liveness | content | content-sha (verification level of the Smoke; empty when it did not run)
        value: ${{ fromJSON(jobs.delivery.outputs.smoke_json || '{}').smoke_level }}
      version_id:
        description: Production Worker version id (production only)
        value: ${{ fromJSON(jobs.delivery.outputs.handoff || '{}').version_id }}
      previous_version_id:
        description: Production Worker version that was live before this run's publish (production only; the rollback target)
        value: ${{ fromJSON(jobs.delivery.outputs.handoff || '{}').previous_version_id }}
      migration_status:
        description: applied | failed | none - the result of the single Migration job (none when there is no migration, a read-only precheck verified nothing pending, or on a pipeline_phase verify call)
        value: ${{ jobs.migration.outputs.migration_status || 'none' }}
      rollback_result:
        description: restored_verified | restored_unverified | restored_unhealthy | blocked | failed | no_known_good; empty when no rollback ran. Anything but empty is a FAILED run
        value: ${{ jobs.delivery.outputs.rollback_result }}
      deploy_gate_blocked:
        description: true when the cross-service gate (upstream_gate) blocked a verification - the deployment is published but NOT verified and was not rolled back (pipeline_phase verify)
        value: ${{ fromJSON(jobs.delivery.outputs.smoke_json || '{}').gate_blocked == 'true' }}
      phase_state:
        description: pipeline_phase deploy - the validated hand-off (effective inputs, descriptor, deploy result, migration result, concurrency group) for the verify call. Pass it unchanged as phase_state
        value: ${{ format('{{"inputs":{0},"descriptor":{1},"handoff":{2},"migration":{3},"group":{4}}}', jobs.plan.outputs.inputs_json || '{}', jobs.plan.outputs.descriptor || 'null', toJSON(jobs.delivery.outputs.handoff), toJSON(jobs.delivery.outputs.migration_used), toJSON(jobs.plan.outputs.group || format('cfv2-run-{0}', github.run_id))) }}
    inputs:
      app_name:
        description: Unique deployment/identity name (e.g. www, heaven-id). Part of the Preview identity (Worker scope).
        type: string
        required: true
      app_path:
        type: string
        default: .
      app_version:
        type: string
        default: ''
      preview_policy:
        description: >
          none | pr. `pr` = a same-repository PR gets ONE Native Preview `pr-<number>` after its CI Gate passed (fork PRs never deploy; the PR never migrates a remote D1). none = no Preview.
        type: string
        default: none
      dev_driver:
        description: >
          none | native-preview | worker. The stable Dev: a Native Preview named `dev`, or a real `env.dev` Worker (required for Queue consumers / Cron triggers). Updated ONLY by an approved manual promotion.
        type: string
        default: none
      approved_dev_ref:
        description: >
          Branch ref (refs/heads/...) a manual Dev promotion may deliver. Required when dev_driver is not none; any other ref is rejected before any mutation. Protect the `<app>/dev` (or `<app>/native-dev`) GitHub Environment with required reviewers.
        type: string
        default: ''
      dispatch_target:
        description: >
          Pass github.event.inputs.target from the caller; empty or "dev". "dev" selects the manual Dev promotion of a workflow_dispatch. Any other value, or a value on another event, fails the Plan before any mutation.
        type: string
        default: ''
      preview_worker_name:
        description: >
          Host Native Previews under this existing Worker instead of the config's `name`
          (wrangler preview --worker-name). Use when the production Worker must keep workers.dev /
          Preview URLs disabled (Preview URLs need Worker-level previews_enabled).
        type: string
        default: ''
      wrangler_config:
        description: Source Wrangler config path relative to app_path
        type: string
        default: wrangler.toml
      # ---- CI stages (caller-owned task lists) ----
      verify_tasks:
        description: 'JSON array of {"id","cmd"} - fast checks (lint, check, build, unit, fast integration ...). Runs on every eligible push and PR. Ids are unique, lowercase, dashes allowed.'
        type: string
        default: ''
      test_tasks:
        description: 'JSON array of {"id","cmd"} - costly checks (heavy integration, contract ...). Runs on pull_request and merge_group only. Empty is valid.'
        type: string
        default: ''
      fork_runner:
        description: >
          GitHub-hosted runner label for fork pull requests. Empty = a fork PR fails closed (untrusted code never reaches `runner`).
        type: string
        default: ''
      build_cmd:
        description: >
          Application build, run from app_path. The Build Validation job runs it as validation (no deploy artifact);
          Deploy runs it again, independently, for the real target (build_env_prod / build_env_preview).
        type: string
        required: true
      ci_env:
        description: Extra nonsecret env for the Lint/Typecheck/Unit/Integration/Build Validation jobs, one KEY=VALUE per line (applied after the target build env)
        type: string
        default: ''
      use_mailpit:
        description: Start Mailpit for integration/E2E tests
        type: boolean
        default: false
      test_e2e_cmd:
        description: E2E command. Empty = no E2E job (an intentional skip never blocks Migration/Deploy).
        type: string
        default: ''
      test_e2e_setup_cmd:
        type: string
        default: ''
      test_e2e_build_cmd:
        description: Test build for E2E (local URLs, mock services). Never reused for Deploy.
        type: string
        default: ''
      test_e2e_variants:
        description: JSON array of E2E variants (name, args, artifact_suffix); the default is a single run.
        type: string
        default: '[{"name":"","args":"","artifact_suffix":""}]'
      test_e2e_env:
        description: Extra env vars for E2E, one KEY=VALUE per line
        type: string
        default: ''
      # ---- Delivery ----
      build_env_prod:
        description: Build-time env for the Production build, one KEY=VALUE per line (VITE_APP_ENV/VERSION are set automatically)
        type: string
        default: ''
      build_env_preview:
        description: Build-time env for the Preview build, one KEY=VALUE per line
        type: string
        default: ''
      build_env_dev:
        description: Build-time env for the Dev build (either driver), one KEY=VALUE per line (never falls back to the Preview or Production env)
        type: string
        default: ''
      preview_url_suffix:
        description: >
          Optional host suffix of the Preview URLs (`-<worker>.<subdomain>.workers.dev` for workers.dev, `.<custom domain>` for custom-domain
          Preview hosting): the canonical Preview URL is `https://<preview-name><suffix>` (Cloudflare Previews documentation). Normally
          empty: the suffix is read from Cloudflare (Workers subdomain API `preview_url_suffix`) BEFORE the build. Required for custom-domain
          hosting (preview_host_check: false); when both exist they must agree.
        type: string
        default: ''
      smoke_mode:
        description: >
          full (default: built-in HTTP probe + smoke_cmd, current behaviour) | basic (content-level HTTP/health verification
          only, no smoke_cmd) | skip (no request at all: the deployment is Published/Unverified - never Verified, never
          known-good, never released). Applies to every target unless smoke_mode_overrides names it.
        type: string
        default: full
      smoke_mode_overrides:
        description: 'Optional JSON object keyed by target (production | preview | dev), e.g. {"dev":"basic"}; values full | basic | skip. Unknown keys / values fail the plan.'
        type: string
        default: '{}'
      smoke_cmd:
        description: Smoke command from app_path (both targets); receives TARGET_URL, EXPECTED_SHA, DEPLOY_TARGET. Default is an HTTP 2xx probe.
        type: string
        default: ''
      smoke_env:
        description: Extra env vars for smoke_cmd, one KEY=VALUE per line
        type: string
        default: ''
      access_protected_targets:
        description: >
          Space-separated targets (preview and/or prod) where a redirect to Cloudflare Access counts as LIVENESS only
          (published but NOT content/SHA-verified: no Release, not a known-good deployment). Any target not listed fails
          smoke on an Access redirect. For content verification of an Access-protected target, send service-token
          headers through smoke_env PROBE_HEADERS so the probe reaches the application itself.
        type: string
        default: preview
      probe_path:
        description: >
          Path the built-in liveness probe requests on the deployed URL (default `/`). Use when the Worker has no
          route at `/` (e.g. an API-only Worker). Must start with `/`. Applies to Production, Preview and Dev.
        type: string
        default: /
      probe_expect_status:
        description: >
          Exact HTTP status the probe must see at probe_path (e.g. `405` for a POST-only route). Empty = any 2xx. A
          redirect to Cloudflare Access is still handled by access_protected_targets. Pair it with smoke_cmd for
          application-level assertions.
        type: string
        default: ''
      sha_path:
        description: Optional path (e.g. /version.json) that must contain the commit SHA once served (smoke_level content-sha)
        type: string
        default: ''
      preview_host_check:
        description: >
          Before a Native Preview publish, read-only check that the host Worker has previews_enabled (Cloudflare
          Workers subdomain API). Set false for approved custom-domain Preview hosting, where that flag does not
          apply; the strict post-publish URL validation always runs.
        type: boolean
        default: true
      preview_binding_allow:
        description: Space-separated approved high-risk Preview bindings, e.g. "services:ID hyperdrive:H"
        type: string
        default: ''
      preview_deny_resources:
        description: Space-separated Production resource identities Previews must never bind
        type: string
        default: ''
      app_url_prod:
        description: Production URL (environment URL, smoke target)
        type: string
        default: ''
      production_rollback_policy:
        description: automatic | manual | disabled. Worker rollback never reverts D1 schema.
        type: string
        default: manual
      # ---- Migration ----
      d1_migrations:
        description: >
          The Worker has remote D1 migrations; enables the Migration job (before the publish) for Production and Dev. A Preview NEVER migrates a
          remote D1 (schema changes from an arbitrary PR are not applied to a shared database; test SQL locally or on an isolated DB). Leave false for D1-less Workers.
        type: boolean
        default: false
      d1_binding:
        description: D1 binding to migrate when the target declares more than one
        type: string
        default: ''
      d1_lock_scope:
        description: >
          Identity of the PHYSICAL shared D1 (default: app_name). Apps in this repository that share one D1 must use
          the same value so their runs are serialized together: it names the run-level concurrency group (separate
          Production and non-Production groups) and the Shared Dev / persistent-Dev group. GitHub concurrency is
          repository-scoped: it CANNOT lock a D1 shared with ANOTHER repository.
        type: string
        default: ''
      d1_rollback_compat:
        description: >
          Expand/contract attestation for AUTOMATIC Production rollback (production_rollback_policy: automatic). A Worker
          rollback never reverts D1. `expand-contract` = the previous Worker version keeps working on the schema this
          run migrates to (migrations are additive, destructive changes ship one release later). With any other value
          (default `unknown`) a rollback after a run that APPLIED D1 migrations is blocked (fail closed; manual commands
          are printed); the engine additionally refuses it when the applied SQL is not provably additive. Without
          pending migrations the rollback is unaffected.
        type: string
        default: unknown
      # ---- Release ----
      release_cmd:
        description: Optional main-only release command (e.g. semantic-release), run after a verified Production deploy
        type: string
        default: ''
      # ---- Dev ----
      dev_smoke_cmd:
        description: Dev smoke command; receives TARGET_URL, EXPECTED_SHA, DEPLOY_TARGET=dev
        type: string
        default: ''
      app_url_dev:
        description: >
          Canonical URL of the stable Dev (environment URL, smoke target). Required for dev_driver worker. For dev_driver native-preview it is optional:
          when set it is exported to the build as CFV2_TARGET_URL and the URL Cloudflare returns after the publish MUST equal it.
        type: string
        default: ''
      dev_build_cmd:
        description: Dev build from app_path (with build_env_dev); falls back to build_cmd when empty. REQUIRED with d1_migrations (the Dev build must succeed before the Dev D1 is migrated).
        type: string
        default: ''
      dev_wrangler_env:
        description: Named Wrangler environment of the Dev Worker (dev_driver worker) (exported as CLOUDFLARE_ENV; its D1 is env.<name>.d1_databases)
        type: string
        default: dev
      dev_binding_allow:
        description: >
          Shared Dev resource-sharing approvals, whitespace/newline separated `kind:BINDING=exact-identity`
          (r2_buckets=bucket_name, kv_namespaces=id, vectorize=index_name, analytics_engine_datasets=dataset,
          services=worker[#environment]). Only the exact resource is approved; any other bucket/id/service, an unknown
          kind, a D1, a malformed or duplicate entry, or an entry matching no Dev binding fails the audit.
          Example: `r2_buckets:SHINYI_MUYU_VOICE_CACHE=firstsun-blog-assets`.
        type: string
        default: ''
      dev_deny_resources:
        description: Space-separated resource identities (bucket, id, queue, Worker) Shared Dev must never bind. Independent of preview_deny_resources; always wins over dev_binding_allow.
        type: string
        default: ''
      dev_worker_name:
        description: Expected Worker name of the Dev Worker deployment (dev_driver worker); the Astro/adapter-generated effective Wrangler config must match it (e.g. blog-preview)
        type: string
        default: ''
      # ---- Deferred verification (opt-in, e.g. a cross-service smoke that must wait for another Worker) ----
      pipeline_phase:
        description: >
          all (default) | deploy | verify. Opt-in split for a Worker whose Smoke must wait for ANOTHER Worker's job (a job
          inside a reusable workflow cannot `needs` a job of a different call). `deploy` = CI/E2E, Migration, Deploy
          and a Dev publish; NO smoke, rollback or release; its `phase_state` output is the hand-off. `verify` = a
          SECOND call (same workflow, `needs` the deploy call and the other Worker's call) that runs only Smoke,
          Rollback, Smoke / recovery and Release. The default `all` is the unchanged single call.
        type: string
        default: all
      phase_state:
        description: pipeline_phase deploy - the validated hand-off (inputs, enabled kinds, per-kind Deploy / Migration results, concurrency group, target descriptors) for the verify call. Pass it unchanged as phase_state
        value: ${{ format('{{"inputs":{0},"kinds":{1},"deploy":{2},"migration":{3},"group":{4},"descriptors":{5}}}', toJSON(inputs), toJSON(fromJSON(jobs.plan.outputs.kinds || '[]')), format('{{"h_production":{0},"h_native_branch":{1},"h_native_dev":{2},"h_persistent_dev":{3}}}', toJSON(jobs.delivery_production.outputs.handoff), toJSON(jobs.delivery_native_branch.outputs.handoff), toJSON(jobs.delivery_native_dev.outputs.handoff), toJSON(jobs.delivery_persistent_dev.outputs.handoff)), format('{{"mj_production":{0},"mj_native_branch":{1},"mj_native_dev":{2},"mj_persistent_dev":{3}}}', toJSON(jobs.delivery_production.outputs.migration_used), toJSON(jobs.delivery_native_branch.outputs.migration_used), toJSON(jobs.delivery_native_dev.outputs.migration_used), toJSON(jobs.delivery_persistent_dev.outputs.migration_used)), toJSON(jobs.plan.outputs.group || format('cfv2-run-{0}', github.run_id)), toJSON(fromJSON(jobs.plan.outputs.descriptors || '{}'))) }}
      upstream_gate:
        description: pipeline_phase verify only - `needs.<job>.result` of the job the cross-service smoke depends on. success or skipped (unchanged Worker, existing verified environment) satisfies it; anything else blocks the verification, fail closed (no rollback)
        type: string
        default: ''
      runner:
        type: string
        default: linux
    secrets:
      CLOUDFLARE_API_TOKEN:
        description: Account token for Production, Preview and Dev
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false
      PREVIEW_SECRETS:
        description: Optional KEY=VALUE lines of Preview-only secrets exported to the Preview build and smoke
        required: false
      SMOKE_USERNAME:
        required: false
      SMOKE_PASSWORD:
        required: false
      RELEASE_TOKEN:
        description: Token for release_cmd (exported as GH_TOKEN); defaults to nothing, GITHUB_TOKEN is NOT used for releases
        required: false

# One run-level concurrency group per piece of shared mutable state (GitHub `concurrency` cannot span two jobs, so the whole RUN is the unit; CI and
# E2E still run in parallel inside a run). `queue: max` keeps FIFO instead of cancelling an older pending run. The identity is the RESOURCE:
#   main push                          -> cfv2-prod-<d1_lock_scope|app_name>
#   workflow_dispatch target=dev       -> cfv2-nonprod-d1-<scope> with d1_migrations, else cfv2-shared-dev-<app_name> (never the Production group)
#   same-repo PR with preview_policy pr -> cfv2-<app_name>-pr-<number>
#   anything else                      -> a private per-run group (never queues behind a deploy)
# The `cfv2-` prefix is static on purpose: never reuse it (or ${{ github.workflow }}) in a CALLER group, or caller and callee deadlock.
# GitHub evaluates this BEFORE any job, so it cannot read a Plan output: this is the one calculation that must live in YAML. Its canonical twin
# is runLockGroup() in actions/cf-preview/delivery.mjs (the Plan emits it as `group`; the unit tests pin the JS twin and the Plan proves a verify
# call's group before any mutation). A verify call (pipeline_phase=verify) schedules under the group its DEPLOY call recorded in phase_state.
# `queue` is unknown to actionlint 1.7.12: .github/actionlint.yaml.
concurrency:
  group: ${{ inputs.pipeline_phase == 'verify' && (fromJSON(inputs.phase_state).group || format('cfv2-run-{0}', github.run_id)) || (github.event_name == 'workflow_dispatch' && inputs.dispatch_target == 'dev') && (inputs.d1_migrations && format('cfv2-nonprod-d1-{0}', inputs.d1_lock_scope != '' && inputs.d1_lock_scope || inputs.app_name) || format('cfv2-shared-dev-{0}', inputs.app_name)) || (github.event_name == 'push' && github.ref == 'refs/heads/main') && format('cfv2-prod-{0}', inputs.d1_lock_scope != '' && inputs.d1_lock_scope || inputs.app_name) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && inputs.preview_policy == 'pr') && format('cfv2-{0}-pr-{1}', inputs.app_name, github.event.pull_request.number) || format('cfv2-run-{0}', github.run_id) }}
  queue: max

permissions:
  contents: read

# bash -eo pipefail everywhere.
defaults:
  run:
    shell: bash

env:
  NODE_VERSION: 24
  PNPM_STORE_PATH: /cache/pnpm-store
  PLAYWRIGHT_BROWSERS_PATH: /opt/playwright-browsers

jobs:
  # -------------------------------------------------------------------------
  # CI — ONE call of _cf-worker-ci.yml: Plan, the Verify / Test task matrices and E2E in parallel, then the fail-closed Gate. Credential-free. The event
  # decides the stages (push = Verify; pull_request / merge_group = Verify + Test on the merge candidate). Its Gate is the only upstream condition of the Plan.
  # -------------------------------------------------------------------------
  ci:
    name: CI
    if: github.event_name != 'delete' && inputs.pipeline_phase != 'verify' && !(github.event_name == 'pull_request' && github.event.action == 'closed')
    uses: $/.github/workflows/_cf-worker-ci.yml
    with:
      app_name: ${{ inputs.app_name }}
      app_path: ${{ inputs.app_path }}
      app_version: ${{ inputs.app_version }}
      runner: ${{ inputs.runner }}
      fork_runner: ${{ inputs.fork_runner }}
      verify_tasks: ${{ inputs.verify_tasks }}
      test_tasks: ${{ inputs.test_tasks }}
      ci_env: ${{ inputs.ci_env }}
      use_mailpit: ${{ inputs.use_mailpit }}
      build_env_prod: ${{ inputs.build_env_prod }}
      build_env_preview: ${{ inputs.build_env_preview }}
      build_env_dev: ${{ inputs.build_env_dev }}
      test_e2e_cmd: ${{ inputs.test_e2e_cmd }}
      test_e2e_setup_cmd: ${{ inputs.test_e2e_setup_cmd }}
      test_e2e_build_cmd: ${{ inputs.test_e2e_build_cmd }}
      test_e2e_variants: ${{ inputs.test_e2e_variants }}
      test_e2e_env: ${{ inputs.test_e2e_env }}

  # -------------------------------------------------------------------------
  # Plan — pure data, no Cloudflare credentials: THE delivery of this event (or none), its descriptor, the physical D1 to migrate and the canonical lock
  # `group`. Runs only after a passed CI Gate and only for an event that can deliver (main push, same-repo PR with preview_policy pr, dispatch), so a
  # feature push does not pay for it. A verify call plans from phase_state. An explicit but unservable dispatch_target always reaches the Plan, which then
  # ALWAYS fails (resolveDelivery): such a run is red instead of silently green.
  # -------------------------------------------------------------------------
  plan:
    name: Plan
    needs: [ci]
    if: always() && (inputs.pipeline_phase == 'verify' || (needs.ci.result == 'success' && needs.ci.outputs.validation == 'passed' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && inputs.preview_policy == 'pr') || github.event_name == 'workflow_dispatch')) || (inputs.dispatch_target != '' && github.event_name != 'workflow_dispatch'))
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    outputs:
      has_delivery: ${{ steps.plan.outputs.has_delivery }}
      target: ${{ steps.plan.outputs.target }}
      driver: ${{ steps.plan.outputs.driver }}
      descriptor: ${{ steps.plan.outputs.descriptor }}
      inputs_json: ${{ steps.plan.outputs.inputs_json }}
      has_migrations: ${{ steps.plan.outputs.has_migrations }}
      migration: ${{ steps.plan.outputs.migration }}
      group: ${{ steps.plan.outputs.group }}
    steps:
      - uses: actions/checkout@v6
        if: inputs.pipeline_phase != 'verify'
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: $/actions/cf-tools
        with:
          install: 'true'
      - id: plan
        env:
          INPUTS_JSON: ${{ toJSON(inputs) }}
          PHASE_STATE: ${{ inputs.pipeline_phase == 'verify' && inputs.phase_state || '{}' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PHASE: ${{ inputs.pipeline_phase }}
          IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          PR_ACTION: ${{ github.event.action }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          node "$TOOLS_DIR/cli.mjs" plan --event "$GITHUB_EVENT_NAME" --ref "$GITHUB_REF" --phase "$PHASE" --run-id "$GITHUB_RUN_ID" --fork "$IS_FORK" --pr-action "$PR_ACTION" --pr-number "$PR_NUMBER" --app-dir "$GITHUB_WORKSPACE/${{ inputs.app_path }}" | tee -a "$GITHUB_OUTPUT"

  # =========================================================================
  # Migration — the ONE job that mutates a database (production and dev only; a Preview never migrates). Its steps run in order and a failing step stops the
  # job, so every read-only check precedes the single remote mutation:
  #   0. precheck: two read-only SELECTs on the planned physical D1 (identity checked against the plan first). NOTHING pending -> step 1 is skipped, no
  #      target is built here, and the result carries `precheck: verified_no_pending` bound to the D1 id and this commit (the Delivery gate accepts it like an
  #      applied migration; a skipped / failed / stale job never carries it). A failing or unreadable query fails the job (never "nothing pending").
  #   1. target build, effective-config audit, exact D1 binding, stale-SHA guard, then the migration (stage migrate)
  # The plan picked the Environment (main -> <app>/prod with its approvals; dev -> the Dev Environment). Skipped (Delivery proceeds) when there is no migration;
  # never on pull_request, delete or a verify call. The D1 schema is never rolled back automatically.
  # =========================================================================
  migration:
    name: Migrate
    needs: [plan]
    if: always() && inputs.pipeline_phase != 'verify' && needs.plan.result == 'success' && needs.plan.outputs.has_migrations == 'true'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 45
    environment:
      name: ${{ fromJSON(needs.plan.outputs.migration || '{}').environment }}
      # Protection (required reviewers, wait timer, branch policy) and environment secrets still apply; only the GitHub Deployment record is
      # not created - the Deploy job owns it. NOT usable with an environment that has a custom (GitHub App) deployment protection rule: the job fails.
      deployment: false
    permissions:
      contents: read
      deployments: read
    outputs:
      migration_json: ${{ steps.precheck.outputs.precheck == 'pending' && toJSON(steps.migrate.outputs) || toJSON(steps.precheck.outputs) }}
      migration_status: ${{ steps.result.outputs.status }}
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: precheck
        name: Check pending D1 migrations (read-only, no build)
        uses: $/actions/cf-deploy
        with:
          target: ${{ fromJSON(needs.plan.outputs.descriptor).engine_target }}
          descriptor: ${{ needs.plan.outputs.descriptor }}
          kind: ${{ fromJSON(needs.plan.outputs.descriptor).slot }}
          stage: precheck
          inputs_json: ${{ needs.plan.outputs.inputs_json }}
          d1_expected_id: ${{ fromJSON(needs.plan.outputs.migration).d1_id }}
      - id: migrate
        name: Apply pending D1 migrations (once)
        if: steps.precheck.outputs.precheck == 'pending'
        uses: $/actions/cf-deploy
        with:
          target: ${{ fromJSON(needs.plan.outputs.descriptor).engine_target }}
          descriptor: ${{ needs.plan.outputs.descriptor }}
          kind: ${{ fromJSON(needs.plan.outputs.descriptor).slot }}
          stage: migrate
          inputs_json: ${{ needs.plan.outputs.inputs_json }}
          d1_expected_id: ${{ fromJSON(needs.plan.outputs.migration).d1_id }}
          preview_secrets: ${{ fromJSON(needs.plan.outputs.descriptor).engine_target == 'preview' && secrets.PREVIEW_SECRETS || '' }}
      # The one deterministic public status: applied | none (nothing was pending / superseded) when the job succeeded, failed otherwise
      # (also when a validation step stopped the job before the migrate step ran).
      - id: result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          STATE: ${{ steps.migrate.outputs.migration }}
        run: echo "status=$([ "$JOB_STATUS" = success ] && echo "${STATE:-none}" || echo failed)" >> "$GITHUB_OUTPUT"

  # =========================================================================
  # Delivery — ONE call of _cf-worker-delivery.yml (deploy -> smoke -> conditional rollback) for the planned target. It needs the plan and the single
  # Migration job (success, or skipped when nothing is migrated). The driver (worker | native-preview) is the only thing that differs.
  # =========================================================================
  delivery:
    name: ${{ needs.plan.outputs.target || 'delivery' }}
    needs: [plan, migration]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.has_delivery == 'true' && (needs.migration.result == 'success' || needs.migration.result == 'skipped')
    uses: $/.github/workflows/_cf-worker-delivery.yml
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    with:
      descriptor: ${{ needs.plan.outputs.descriptor }}
      runner: ${{ inputs.runner }}
      inputs_json: ${{ needs.plan.outputs.inputs_json }}
      call_inputs_json: ${{ inputs.pipeline_phase == 'verify' && toJSON(inputs) || '' }}
      phase: ${{ inputs.pipeline_phase }}
      migration_result: ${{ needs.migration.result }}
      migration_json: ${{ needs.migration.outputs.migration_json }}
      handoff_json: ${{ inputs.pipeline_phase == 'verify' && fromJSON(inputs.phase_state).handoff || '' }}
      migration_json_in: ${{ inputs.pipeline_phase == 'verify' && fromJSON(inputs.phase_state).migration || '' }}
      upstream_gate: ${{ inputs.pipeline_phase == 'verify' && inputs.upstream_gate || '' }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PREVIEW_SECRETS: ${{ secrets.PREVIEW_SECRETS }}
      SMOKE_USERNAME: ${{ secrets.SMOKE_USERNAME }}
      SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}

  # -------------------------------------------------------------------------
  # Release — optional, main push only, only after THIS run deployed its own SHA to Production, the Production Smoke verified it at content level
  # (smoke_mode skip / liveness never qualify) and no Rollback ran.
  # -------------------------------------------------------------------------
  release:
    name: Release
    needs: [plan, delivery]
    if: always() && inputs.release_cmd != '' && github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.plan.outputs.target == 'production' && inputs.pipeline_phase != 'deploy' && needs.delivery.result == 'success' && fromJSON(needs.delivery.outputs.smoke_json || '{}').deployed_and_verified == 'true' && needs.delivery.outputs.rollback_result == ''
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: $/actions/setup
        with:
          setup-node: 'false'
          setup-pnpm: 'false'
      - name: Release
        working-directory: ${{ inputs.app_path }}
        env:
          CMD: ${{ inputs.release_cmd }}
        run: bash -c "$CMD"

  # -------------------------------------------------------------------------
  # Lifecycle — a same-repo PR with a Preview was closed: retire its ledger (the Preview is kept).
  # -------------------------------------------------------------------------
  lifecycle:
    name: lifecycle
    if: inputs.pipeline_phase != 'verify' && inputs.preview_policy == 'pr' && github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    uses: $/.github/workflows/_cf-worker-lifecycle.yml
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    with:
      app_name: ${{ inputs.app_name }}
      preview_worker_name: ${{ inputs.preview_worker_name }}
      runner: ${{ inputs.runner }}
