name: CF Worker Pipeline v2

# ---------------------------------------------------------------------------
# Cloudflare Worker CI/CD v2 — thin workflow, ONE reusable delivery engine.
# OpenSpec: openspec/changes/refactor-cloudflare-worker-cicd-v2 (PR #57), openspec/changes/add-cloudflare-shared-dev-channel.
# Interface / migration guide: docs/cf-worker-v2-refactor.md
#
#   CI  (_cf-worker-ci.yml)   Lint | Typecheck | Unit | Integration | Build Validation | E2E in parallel -> Validation Gate (fail closed)
#         |
#   Plan                      enabled targets, ONE physical D1, the migration owner (pure data; runs only when CI passed)
#         |
#   Migrate                  ONE job: a READ-ONLY D1 precheck first. Nothing pending -> a verified no-op, NO build here. Pending -> read-only
#         |                   safety checks (target build, effective-config audit, exact D1 binding), then the migration is applied ONCE.
#   Delivery x enabled kinds  _cf-worker-delivery.yml, one call per kind: Deploy -> Smoke -> conditional Rollback, independent per kind
#         |
#   Release                   optional, main only, only after a VERIFIED Production delivery with no rollback
#
# Event handlers outside that DAG: `lifecycle` (_cf-worker-lifecycle.yml: PR comment / branch delete) and `config-guard`.
# The Hybrid protected manual dispatch of persistent Dev is NOT a separate path: it only selects the `persistent-dev` kind in the Plan, then runs this same DAG.
# One pipeline migrates at most one physical D1: distinct databases among the enabled targets are rejected by the plan, before any mutation.
# The run-level concurrency group below spans the whole run. Interface, design record and measurements: docs/cf-worker-v2-refactor.md.
#
# Shared actions / nested workflow: `uses: $/actions/<name>` and `uses: $/.github/workflows/...` (GitHub self-repository syntax,
# needs runner >= 2.336.0; observed: org `linux` runners 2.338.0, GitHub-hosted 2.338.2) resolve to THIS repository at the exact commit of the running workflow, with no checkout into the caller's
# workspace (a plain `./` would resolve against the CALLER's). Version coupling is therefore exact by construction; `tools_ref` is
# a deprecated no-op. Scripts are located relative to their action (`$GITHUB_ACTION_PATH/../cf-preview`, or actions/cf-tools).
#
# Caller MUST trigger on: push (all branches), pull_request, delete, workflow_dispatch.
# `delete` only fires from the DEFAULT branch's workflow file.
# ---------------------------------------------------------------------------

on:
  workflow_call:
    outputs:
      deploy_url:
        description: URL that was published (Preview URL or app_url_prod); empty when nothing was deployed. May be published-but-unverified or rolled back - gate on deploy_verified_url
        value: ${{ fromJSON((jobs.plan.outputs.on_production == 'true' && jobs.delivery_production.outputs.handoff) || (jobs.plan.outputs.on_native_branch == 'true' && jobs.delivery_native_branch.outputs.handoff) || '{}').url }}
      deploy_verified_url:
        description: Same URL, only when the Smoke passed content-level verification; empty for Access-liveness-only, failed, rolled-back, smoke_mode=skip or skipped deployments
        value: ${{ fromJSON((jobs.plan.outputs.on_production == 'true' && jobs.delivery_production.outputs.smoke_json) || (jobs.plan.outputs.on_native_branch == 'true' && jobs.delivery_native_branch.outputs.smoke_json) || '{}').verified_url }}
      deploy_published_unverified:
        description: true when the deployment is reachable but NOT content-verified (Access liveness only, or smoke_mode=skip)
        value: ${{ fromJSON((jobs.plan.outputs.on_production == 'true' && jobs.delivery_production.outputs.smoke_json) || (jobs.plan.outputs.on_native_branch == 'true' && jobs.delivery_native_branch.outputs.smoke_json) || '{}').published_unverified }}
      deploy_verified:
        description: true ONLY when this run published its own SHA and its Smoke passed at content level
        value: ${{ fromJSON((jobs.plan.outputs.on_production == 'true' && jobs.delivery_production.outputs.smoke_json) || (jobs.plan.outputs.on_native_branch == 'true' && jobs.delivery_native_branch.outputs.smoke_json) || '{}').deployed_and_verified }}
      deploy_smoke_level:
        description: skipped | liveness | content | content-sha (verification level of the Smoke; empty when it did not run)
        value: ${{ fromJSON((jobs.plan.outputs.on_production == 'true' && jobs.delivery_production.outputs.smoke_json) || (jobs.plan.outputs.on_native_branch == 'true' && jobs.delivery_native_branch.outputs.smoke_json) || '{}').smoke_level }}
      deploy_target:
        description: prod | preview (the Production / per-branch Native Preview delivery)
        value: ${{ jobs.plan.outputs.on_production == 'true' && 'prod' || jobs.plan.outputs.on_native_branch == 'true' && 'preview' || '' }}
      version_id:
        description: Production Worker version id (prod only)
        value: ${{ fromJSON((jobs.plan.outputs.on_production == 'true' && jobs.delivery_production.outputs.handoff) || (jobs.plan.outputs.on_native_branch == 'true' && jobs.delivery_native_branch.outputs.handoff) || '{}').version_id }}
      previous_version_id:
        description: Production Worker version that was live before this run's publish (prod only; the rollback target)
        value: ${{ fromJSON((jobs.plan.outputs.on_production == 'true' && jobs.delivery_production.outputs.handoff) || (jobs.plan.outputs.on_native_branch == 'true' && jobs.delivery_native_branch.outputs.handoff) || '{}').previous_version_id }}
      migration_status:
        description: applied | failed | none - the result of the single Migration job (none when d1_migrations is false, a read-only precheck verified nothing pending, or on a pipeline_phase verify call)
        value: ${{ jobs.migration.outputs.migration_status || 'none' }}
      rollback_result:
        description: restored_verified | restored_unverified | restored_unhealthy | blocked | failed | no_known_good; empty when no rollback ran. Anything but empty is a FAILED run (first kind of the run that rolled back)
        value: ${{ (jobs.plan.outputs.on_production == 'true' && jobs.delivery_production.outputs.rollback_result) || (jobs.plan.outputs.on_native_branch == 'true' && jobs.delivery_native_branch.outputs.rollback_result) || (jobs.plan.outputs.on_native_dev == 'true' && jobs.delivery_native_dev.outputs.rollback_result) || (jobs.plan.outputs.on_persistent_dev == 'true' && jobs.delivery_persistent_dev.outputs.rollback_result) || '' }}
      dev_url:
        description: persistent-dev (separate Dev Worker) URL that was published (app_url_dev); empty when it did not deploy. May be published-but-unverified - gate on dev_verified_url
        value: ${{ fromJSON((jobs.plan.outputs.on_persistent_dev == 'true' && jobs.delivery_persistent_dev.outputs.handoff) || '{}').url }}
      dev_verified_url:
        description: persistent-dev URL only when content-level verification passed
        value: ${{ fromJSON((jobs.plan.outputs.on_persistent_dev == 'true' && jobs.delivery_persistent_dev.outputs.smoke_json) || '{}').verified_url }}
      dev_published_unverified:
        description: true when persistent-dev published a reachable but NOT content-verified deployment (Access liveness only, or smoke_mode=skip)
        value: ${{ fromJSON((jobs.plan.outputs.on_persistent_dev == 'true' && jobs.delivery_persistent_dev.outputs.smoke_json) || '{}').published_unverified }}
      native_dev_url:
        description: Native Dev Preview URL that was published; empty when Native Dev did not deploy. May be published-but-unverified - gate on native_dev_verified_url
        value: ${{ fromJSON((jobs.plan.outputs.on_native_dev == 'true' && jobs.delivery_native_dev.outputs.handoff) || '{}').url }}
      native_dev_verified_url:
        description: Native Dev URL only when content-level verification passed
        value: ${{ fromJSON((jobs.plan.outputs.on_native_dev == 'true' && jobs.delivery_native_dev.outputs.smoke_json) || '{}').verified_url }}
      native_dev_published_unverified:
        description: true when Native Dev published a reachable but NOT content-verified deployment (Access liveness only, or smoke_mode=skip)
        value: ${{ fromJSON((jobs.plan.outputs.on_native_dev == 'true' && jobs.delivery_native_dev.outputs.smoke_json) || '{}').published_unverified }}
      native_dev_verified:
        description: true ONLY when this run published its own SHA to Native Dev and its Smoke passed at content level
        value: ${{ fromJSON((jobs.plan.outputs.on_native_dev == 'true' && jobs.delivery_native_dev.outputs.smoke_json) || '{}').deployed_and_verified }}
      native_dev_smoke_level:
        description: skipped | liveness | content | content-sha for Native Dev; empty when its Smoke did not run
        value: ${{ fromJSON((jobs.plan.outputs.on_native_dev == 'true' && jobs.delivery_native_dev.outputs.smoke_json) || '{}').smoke_level }}
      deploy_gate_blocked:
        description: true when the cross-service gate (upstream_gate) blocked a verification - the deployment is published but NOT verified and was not rolled back (pipeline_phase verify)
        value: ${{ fromJSON(jobs.delivery_production.outputs.smoke_json || '{}').gate_blocked == 'true' || fromJSON(jobs.delivery_native_branch.outputs.smoke_json || '{}').gate_blocked == 'true' || fromJSON(jobs.delivery_native_dev.outputs.smoke_json || '{}').gate_blocked == 'true' || fromJSON(jobs.delivery_persistent_dev.outputs.smoke_json || '{}').gate_blocked == 'true' }}
      phase_state:
        description: pipeline_phase deploy - the validated hand-off (inputs, enabled kinds, per-kind Deploy / Migration results, concurrency group, target descriptors) for the verify call. Pass it unchanged as phase_state
        value: ${{ format('{{"inputs":{0},"kinds":{1},"deploy":{2},"migration":{3},"group":{4},"descriptors":{5}}}', toJSON(inputs), toJSON(fromJSON(jobs.plan.outputs.kinds || '[]')), format('{{"h_production":{0},"h_native_branch":{1},"h_native_dev":{2},"h_persistent_dev":{3}}}', toJSON(jobs.delivery_production.outputs.handoff), toJSON(jobs.delivery_native_branch.outputs.handoff), toJSON(jobs.delivery_native_dev.outputs.handoff), toJSON(jobs.delivery_persistent_dev.outputs.handoff)), format('{{"mj_production":{0},"mj_native_branch":{1},"mj_native_dev":{2},"mj_persistent_dev":{3}}}', toJSON(jobs.delivery_production.outputs.migration_used), toJSON(jobs.delivery_native_branch.outputs.migration_used), toJSON(jobs.delivery_native_dev.outputs.migration_used), toJSON(jobs.delivery_persistent_dev.outputs.migration_used)), toJSON(jobs.plan.outputs.group || format('cfv2-run-{0}', github.run_id)), toJSON(fromJSON(jobs.plan.outputs.descriptors || '{}'))) }}
    inputs:
      tools_ref:
        description: >
          DEPRECATED, ignored (kept so existing callers keep working). The shared actions and the delivery workflow are referenced
          with the self-repository syntax `$/`, which resolves to the repository AND commit of this workflow, so the tooling can no
          longer drift from the workflow ref the caller pins. Safe to delete from callers.
        type: string
        required: false
        default: ''
      app_name:
        description: Unique deployment/identity name (e.g. www, heaven-id). Part of the Preview identity (Worker scope).
        type: string
        required: true
      app_path:
        type: string
        default: .
      app_version:
        type: string
        default: ''
      deployment_strategy:
        description: production-preview | hybrid | production-only
        type: string
        default: production-preview
      preview_on_branch_push:
        description: Feature Native Preview — one stable Preview URL per non-main branch. Independent of shared_dev_on_branch_push.
        type: boolean
        default: true
      shared_dev_on_branch_push:
        description: >
          Shared Dev — every non-main branch push deploys the ONE configured Dev Worker (app_url_dev); the last
          verified deployment wins. Independent of preview_on_branch_push. Rejected with production-only.
        type: boolean
        default: false
      shared_dev_native_preview_on_branch_push:
        description: >
          Native Dev — every non-main branch push updates the ONE stable, named Native Preview `dev` (host Worker =
          preview_worker_name or app_name, `[previews]` bindings; NOT a Wrangler [env.dev] Worker). The last verified
          deployment of ANY branch wins; pushes are serialized per Worker. Independent of preview_on_branch_push; conflicts
          with shared_dev_on_branch_push (two automatic Dev channels). Rejected with production-only.
        type: boolean
        default: false
      preview_worker_name:
        description: >
          Host Native Previews under this existing Worker instead of the config's `name`
          (wrangler preview --worker-name). Use when the production Worker must keep workers.dev /
          Preview URLs disabled (Preview URLs need Worker-level previews_enabled).
        type: string
        default: ''
      wrangler_config:
        description: Source Wrangler config path relative to app_path
        type: string
        default: wrangler.toml
      # ---- CI (one job; these are steps) ----
      lint_cmd:
        type: string
        default: ''
      typecheck_cmd:
        type: string
        default: ''
      test_unit_cmd:
        type: string
        default: ''
      test_integration_cmd:
        type: string
        default: ''
      build_cmd:
        description: >
          Application build, run from app_path. The Build Validation job runs it as validation (no deploy artifact);
          Deploy runs it again, independently, for the real target (build_env_prod / build_env_preview).
        type: string
        required: true
      ci_env:
        description: Extra nonsecret env for the Lint/Typecheck/Unit/Integration/Build Validation jobs, one KEY=VALUE per line (applied after the target build env)
        type: string
        default: ''
      use_mailpit:
        description: Start Mailpit for integration/E2E tests
        type: boolean
        default: false
      # ---- E2E (own setup and own test build) ----
      test_e2e_cmd:
        description: E2E command. Empty = no E2E job (an intentional skip never blocks Migration/Deploy).
        type: string
        default: ''
      test_e2e_setup_cmd:
        type: string
        default: ''
      test_e2e_build_cmd:
        description: Test build for E2E (local URLs, mock services). Never reused for Deploy.
        type: string
        default: ''
      test_e2e_variants:
        description: JSON array of E2E variants (name, args, artifact_suffix); the default is a single run.
        type: string
        default: '[{"name":"","args":"","artifact_suffix":""}]'
      test_e2e_env:
        description: Extra env vars for E2E, one KEY=VALUE per line
        type: string
        default: ''
      # ---- Deploy ----
      build_env_prod:
        description: Build-time env for the Production build, one KEY=VALUE per line (VITE_APP_ENV/VERSION are set automatically)
        type: string
        default: ''
      build_env_preview:
        description: Build-time env for the Preview build, one KEY=VALUE per line
        type: string
        default: ''
      build_env_shared_dev_native_preview:
        description: Build-time env for the Native Dev build, one KEY=VALUE per line (never falls back to build_env_preview / build_env_prod / build_env_dev; each target compiles its own URLs)
        type: string
        default: ''
      app_url_shared_dev_native_preview:
        description: >
          Optional canonical URL of the Native Dev Preview, known before the build. When set it is exported to the build as
          CFV2_TARGET_URL and the URL Cloudflare returns after the publish MUST equal it (otherwise the publish is rejected: the
          build embeds the wrong URL). Also used as the smoke target.
        type: string
        default: ''
      preview_url_suffix:
        description: >
          Optional host suffix of the Preview URLs (`-<worker>.<subdomain>.workers.dev` for workers.dev, `.<custom domain>` for custom-domain
          Preview hosting): the canonical Preview URL is `https://<preview-name><suffix>` (Cloudflare Previews documentation). Normally
          empty: the suffix is read from Cloudflare (Workers subdomain API `preview_url_suffix`) BEFORE the build. Required for custom-domain
          hosting (preview_host_check: false); when both exist they must agree.
        type: string
        default: ''
      smoke_mode:
        description: >
          full (default: built-in HTTP probe + smoke_cmd, current behaviour) | basic (content-level HTTP/health verification
          only, no smoke_cmd) | skip (no request at all: the deployment is Published/Unverified - never Verified, never
          known-good, never released). Applies to every delivery kind unless smoke_mode_overrides names it.
        type: string
        default: full
      smoke_mode_overrides:
        description: 'Optional JSON object keyed by delivery kind (production | native-branch | native-dev | persistent-dev), e.g. {"native-dev":"basic"}; values full | basic | skip. Unknown keys / values fail the plan.'
        type: string
        default: '{}'
      build_env_dev:
        description: Build-time env for the Shared Dev build, one KEY=VALUE per line (never falls back to the Preview or Production env)
        type: string
        default: ''
      smoke_cmd:
        description: Smoke command from app_path (both targets); receives TARGET_URL, EXPECTED_SHA, DEPLOY_TARGET. Default is an HTTP 2xx probe.
        type: string
        default: ''
      smoke_env:
        description: Extra env vars for smoke_cmd, one KEY=VALUE per line
        type: string
        default: ''
      access_protected_targets:
        description: >
          Space-separated targets (preview and/or prod) where a redirect to Cloudflare Access counts as LIVENESS only
          (published but NOT content/SHA-verified: no Release, not a known-good deployment). Any target not listed fails
          smoke on an Access redirect. For content verification of an Access-protected target, send service-token
          headers through smoke_env PROBE_HEADERS so the probe reaches the application itself.
        type: string
        default: preview
      probe_path:
        description: >
          Path the built-in liveness probe requests on the deployed URL (default `/`). Use when the Worker has no
          route at `/` (e.g. an API-only Worker). Must start with `/`. Applies to Production, Preview and Dev.
        type: string
        default: /
      probe_expect_status:
        description: >
          Exact HTTP status the probe must see at probe_path (e.g. `405` for a POST-only route). Empty = any 2xx. A
          redirect to Cloudflare Access is still handled by access_protected_targets. Pair it with smoke_cmd for
          application-level assertions.
        type: string
        default: ''
      sha_path:
        description: Optional path (e.g. /version.json) that must contain the commit SHA once served (smoke_level content-sha)
        type: string
        default: ''
      preview_host_check:
        description: >
          Before a Native Preview publish, read-only check that the host Worker has previews_enabled (Cloudflare
          Workers subdomain API). Set false for approved custom-domain Preview hosting, where that flag does not
          apply; the strict post-publish URL validation always runs.
        type: boolean
        default: true
      preview_binding_allow:
        description: Space-separated approved high-risk Preview bindings, e.g. "services:ID hyperdrive:H"
        type: string
        default: ''
      preview_deny_resources:
        description: Space-separated Production resource identities Previews must never bind
        type: string
        default: ''
      app_url_prod:
        description: Production URL (environment URL, smoke target)
        type: string
        default: ''
      production_rollback_policy:
        description: automatic | manual | disabled. Worker rollback never reverts D1 schema.
        type: string
        default: manual
      # ---- Migration ----
      d1_migrations:
        description: >
          The Worker has remote D1 migrations; enables the Migration STEP of the delivery engine (after the build and
          config audit, before the publish). Production, Preview and Shared Dev apply the same project-owned SQL to
          their own D1. Leave false for D1-less Workers.
        type: boolean
        default: false
      d1_binding:
        description: D1 binding to migrate when the target declares more than one
        type: string
        default: ''
      d1_lock_scope:
        description: >
          Identity of the PHYSICAL shared D1 (default: app_name). Apps in this repository that share one D1 must use
          the same value so their runs are serialized together: it names the run-level concurrency group (separate
          Production and non-Production groups) and the Shared Dev / persistent-Dev group. GitHub concurrency is
          repository-scoped: it CANNOT lock a D1 shared with ANOTHER repository.
        type: string
        default: ''
      d1_rollback_compat:
        description: >
          Expand/contract attestation for AUTOMATIC Production rollback (production_rollback_policy: automatic). A Worker
          rollback never reverts D1. `expand-contract` = the previous Worker version keeps working on the schema this
          run migrates to (migrations are additive, destructive changes ship one release later). With any other value
          (default `unknown`) a rollback after a run that APPLIED D1 migrations is blocked (fail closed; manual commands
          are printed); the engine additionally refuses it when the applied SQL is not provably additive. Without
          pending migrations the rollback is unaffected.
        type: string
        default: unknown
      # ---- Release ----
      release_cmd:
        description: Optional main-only release command (e.g. semantic-release), run after a verified Production deploy
        type: string
        default: ''
      # ---- Hybrid persistent Dev ----
      persistent_dev_ref:
        description: Approved ref (refs/heads/...) allowed to deploy persistent Dev via dispatch
        type: string
        default: ''
      dev_deploy_cmd:
        description: >
          RETIRED - must be empty. The engine is the only publisher (it publishes the audited Dev Wrangler config itself); a non-empty
          value fails the Plan before anything is built, migrated or published. Build in dev_build_cmd (or build_cmd). The input is kept
          declared only so a stale caller gets this explicit error instead of a workflow-syntax failure.
        type: string
        default: ''
      dev_smoke_cmd:
        description: Dev smoke command (persistent-dev and Shared Dev); Shared Dev also receives TARGET_URL=app_url_dev, EXPECTED_SHA, DEPLOY_TARGET=dev
        type: string
        default: ''
      app_url_dev:
        description: Stable Shared Dev URL (environment URL, smoke target). Required when shared_dev_on_branch_push is true.
        type: string
        default: ''
      dev_build_cmd:
        description: Dev build from app_path (with build_env_dev), build only; falls back to build_cmd when empty. REQUIRED with d1_migrations (the Dev build must succeed before the Dev D1 is migrated). Required by the persistent-dev kind (automatic and manual dispatch alike).
        type: string
        default: ''
      dev_wrangler_env:
        description: Named Wrangler environment of the Shared Dev Worker (exported as CLOUDFLARE_ENV; its D1 is env.<name>.d1_databases)
        type: string
        default: dev
      dev_binding_allow:
        description: >
          Shared Dev resource-sharing approvals, whitespace/newline separated `kind:BINDING=exact-identity`
          (r2_buckets=bucket_name, kv_namespaces=id, vectorize=index_name, analytics_engine_datasets=dataset,
          services=worker[#environment]). Only the exact resource is approved; any other bucket/id/service, an unknown
          kind, a D1, a malformed or duplicate entry, or an entry matching no Dev binding fails the audit.
          Example: `r2_buckets:SHINYI_MUYU_VOICE_CACHE=firstsun-blog-assets`.
        type: string
        default: ''
      dev_deny_resources:
        description: Space-separated resource identities (bucket, id, queue, Worker) Shared Dev must never bind. Independent of preview_deny_resources; always wins over dev_binding_allow.
        type: string
        default: ''
      dev_worker_name:
        description: Expected Worker name of the Shared Dev deployment; the Astro/adapter-generated effective Wrangler config must match it (e.g. blog-preview)
        type: string
        default: ''
      dispatch_target:
        description: Pass github.event.inputs.target from the caller; empty (default) or "persistent-dev". "persistent-dev" only SELECTS the persistent-dev delivery kind for a workflow_dispatch of the approved persistent_dev_ref (hybrid); the run is the standard CI -> Plan -> Migrate -> Deploy -> Smoke -> Rollback pipeline. Any other value, or an unapproved ref, fails the Plan before any mutation.
        type: string
        default: ''
      pipeline_phase:
        description: >
          all (default) | deploy | verify. Opt-in split for a Worker whose Smoke must wait for ANOTHER Worker's job (a job
          inside a reusable workflow cannot `needs` a job of a different call). `deploy` = CI/E2E, Migration, Deploy
          and Shared Dev publish; NO smoke, rollback or release; its `phase_state` output is the hand-off. `verify` = a
          SECOND call (same workflow, `needs` the deploy call and the other Worker's call) that runs only Smoke,
          Rollback, Shared Dev smoke / recovery and Release. The default `all` is the unchanged single call.
        type: string
        default: all
      phase_state:
        description: pipeline_phase verify only - the `phase_state` output of the deploy call, passed unchanged. Validated as data; the engine inputs come from it, so a verify call repeats only app_name, app_path, tools_ref, runner, production_rollback_policy, release_cmd and the secrets.
        type: string
        default: '{}'
      upstream_gate:
        description: pipeline_phase verify only - `needs.<job>.result` of the job the cross-service smoke depends on. success or skipped (unchanged Worker, existing verified environment) satisfies it; anything else blocks the verification, fail closed (no rollback)
        type: string
        default: ''
      runner:
        type: string
        default: linux
    secrets:
      CLOUDFLARE_API_TOKEN:
        description: Account token for Production, Preview and Dev
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false
      PREVIEW_SECRETS:
        description: Optional KEY=VALUE lines of Preview-only secrets exported to the Preview build and smoke
        required: false
      SMOKE_USERNAME:
        required: false
      SMOKE_PASSWORD:
        required: false
      RELEASE_TOKEN:
        description: Token for release_cmd (exported as GH_TOKEN); defaults to nothing, GITHUB_TOKEN is NOT used for releases
        required: false

# One run-level concurrency group per piece of shared mutable state (GitHub `concurrency` cannot span two jobs, so the whole RUN is the
# unit; CI and E2E still run in parallel inside a run). `queue: max` keeps FIFO instead of cancelling an older pending run (beyond 100
# GitHub cancels the extra run: fail-closed, it deploys nothing). The identity is the RESOURCE, not the app: `d1_lock_scope` replaces
# app_name so apps that share one physical D1 share one group, and Production and non-Production are always different groups:
#   main                               -> cfv2-prod-<d1_lock_scope|app_name>
#   branch, d1_migrations, a non-main channel enabled (Preview and/or Shared Dev, strategy != production-only)
#                                      -> cfv2-nonprod-d1-<d1_lock_scope|app_name>   (Preview AND Shared Dev D1)
#   branch, Shared Dev on, no D1 lock  -> cfv2-shared-dev-<app_name>                  (the ONE Dev Worker)
#   branch, both channels off          -> cfv2-<app_name>-preview-<branch>            (CI-only: no shared D1 serialization)
#   workflow_dispatch target=persistent-dev (any approved ref, main included) -> the SAME group as the automatic Shared Dev push
#                                      (cfv2-nonprod-d1-<scope> with d1_migrations, else cfv2-shared-dev-<app>): never the Production group
#   PR / delete / any other event      -> a private group (never queues behind a deploy)
# The `cfv2-` prefix is static on purpose: never reuse it (or ${{ github.workflow }}) in a CALLER group, or caller and callee deadlock.
# A repo-local group does NOT protect a D1 shared with another repository. `queue` is unknown to actionlint 1.7.12: .github/actionlint.yaml.
#
# GitHub evaluates this BEFORE any job, so it cannot read a Plan output: this is the one calculation that must live in YAML. Its canonical
# twin is runLockGroup() in actions/cf-preview/delivery.mjs (the Plan emits it as `group`; test-workflow-contract.py renders this expression
# and compares both over a scenario matrix). A verify call (pipeline_phase=verify) schedules under the group its DEPLOY call recorded in
# phase_state; the Plan job then proves, before any mutation, that it equals runLockGroup() of the deploy call's own inputs - a wrong or
# forged value fails the run there, it can never mutate under another lock.
concurrency:
  group: ${{ inputs.pipeline_phase == 'verify' && (fromJSON(inputs.phase_state).group || format('cfv2-run-{0}', github.run_id)) || ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref_type == 'branch') && ((github.event_name == 'workflow_dispatch' && inputs.dispatch_target == 'persistent-dev') && (inputs.d1_migrations && format('cfv2-nonprod-d1-{0}', inputs.d1_lock_scope != '' && inputs.d1_lock_scope || inputs.app_name) || format('cfv2-shared-dev-{0}', inputs.app_name)) || github.ref == 'refs/heads/main' && format('cfv2-prod-{0}', inputs.d1_lock_scope != '' && inputs.d1_lock_scope || inputs.app_name) || (inputs.deployment_strategy != 'production-only' && (inputs.preview_on_branch_push || inputs.shared_dev_on_branch_push || inputs.shared_dev_native_preview_on_branch_push) && inputs.d1_migrations && format('cfv2-nonprod-d1-{0}', inputs.d1_lock_scope != '' && inputs.d1_lock_scope || inputs.app_name) || (inputs.deployment_strategy != 'production-only' && (inputs.shared_dev_on_branch_push || inputs.shared_dev_native_preview_on_branch_push) && format('cfv2-shared-dev-{0}', inputs.app_name) || format('cfv2-{0}-preview-{1}', inputs.app_name, github.ref_name)))) || format('cfv2-run-{0}', github.run_id) }}
  queue: max

permissions:
  contents: read

# bash -eo pipefail everywhere.
defaults:
  run:
    shell: bash

env:
  NODE_VERSION: 24
  PNPM_STORE_PATH: /cache/pnpm-store
  PLAYWRIGHT_BROWSERS_PATH: /opt/playwright-browsers

jobs:
  # -------------------------------------------------------------------------
  # CI — ONE call of _cf-worker-ci.yml (six parallel checks + the fail-closed Validation Gate). Credential-free; fork PRs run it, same-repo
  # PRs are covered by the push run of the same SHA. Its verdict is the only upstream condition of the Plan.
  # -------------------------------------------------------------------------
  # CI — ONE call of _cf-worker-ci.yml: Lint, Typecheck, Unit, Integration, Build Validation and E2E as six independent, parallel jobs,
  # then the fail-closed Validation Gate. Credential-free; fork PRs run it, same-repo PRs are covered by the push run of the same SHA.
  # Its result is the only upstream condition of the Plan.
  # -------------------------------------------------------------------------
  ci:
    name: CI
    if: github.event_name != 'delete' && inputs.pipeline_phase != 'verify' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository)
    uses: $/.github/workflows/_cf-worker-ci.yml
    with:
      app_name: ${{ inputs.app_name }}
      app_path: ${{ inputs.app_path }}
      app_version: ${{ inputs.app_version }}
      runner: ${{ inputs.runner }}
      lint_cmd: ${{ inputs.lint_cmd }}
      typecheck_cmd: ${{ inputs.typecheck_cmd }}
      test_unit_cmd: ${{ inputs.test_unit_cmd }}
      test_integration_cmd: ${{ inputs.test_integration_cmd }}
      build_cmd: ${{ inputs.build_cmd }}
      ci_env: ${{ inputs.ci_env }}
      use_mailpit: ${{ inputs.use_mailpit }}
      build_env_prod: ${{ inputs.build_env_prod }}
      build_env_preview: ${{ inputs.build_env_preview }}
      build_env_dev: ${{ inputs.build_env_dev }}
      # The CI environment follows the INTENDED deployment target, not only the ref: a persistent-dev dispatch (even from `main`) and an
      # automatic push whose ONLY target is Shared Dev are validated against the Dev build env (never Production env vars); several kinds
      # at once keep the Preview contract. Pure event/input resolution (CI runs before the Plan; the Plan stays
      # the authorization gate). JS twin: delivery.mjs ciTargetEnv.
      ci_target_env: ${{ github.event_name == 'workflow_dispatch' && inputs.dispatch_target == 'persistent-dev' && 'dev' || (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main' && inputs.dispatch_target == '' && inputs.deployment_strategy != 'production-only' && inputs.shared_dev_on_branch_push && !inputs.preview_on_branch_push && !inputs.shared_dev_native_preview_on_branch_push && 'dev' || github.ref == 'refs/heads/main' && 'prod' || 'preview' }}
      test_e2e_cmd: ${{ inputs.test_e2e_cmd }}
      test_e2e_setup_cmd: ${{ inputs.test_e2e_setup_cmd }}
      test_e2e_build_cmd: ${{ inputs.test_e2e_build_cmd }}
      test_e2e_variants: ${{ inputs.test_e2e_variants }}
      test_e2e_env: ${{ inputs.test_e2e_env }}

  # -------------------------------------------------------------------------
  # Plan — pure data, no Cloudflare credentials: the enabled delivery kinds of THIS event, the ONE physical D1 they share (distinct
  # databases fail the plan) and its migration owner, the per-kind `on_<kind>` switches and target `descriptors`, the canonical lock `group`.
  # Runs only after a passed CI, so every job below that needs the plan is implicitly gated by CI. A verify call plans from phase_state.
  # -------------------------------------------------------------------------
  plan:
    name: Plan
    needs: [ci]
    # The last clause makes an explicit but unservable request (a dispatch_target on a tag / PR / push / delete event) reach the Plan even
    # without a passed CI: the Plan then ALWAYS fails (resolveDeliveryTargets), so such a run is red instead of silently green, and it
    # can never emit a target (no downstream job runs).
    if: always() && (inputs.pipeline_phase == 'verify' || (needs.ci.result == 'success' && needs.ci.outputs.validation == 'passed' && github.ref_type == 'branch' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) || (inputs.dispatch_target != '' && (github.event_name != 'workflow_dispatch' || github.ref_type != 'branch')))
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    outputs:
      kinds: ${{ steps.plan.outputs.kinds }}
      descriptors: ${{ steps.plan.outputs.descriptors }}
      has_targets: ${{ steps.plan.outputs.has_targets }}
      has_migrations: ${{ steps.plan.outputs.has_migrations }}
      migration: ${{ steps.plan.outputs.migration }}
      on_production: ${{ steps.plan.outputs.on_production }}
      on_native_branch: ${{ steps.plan.outputs.on_native_branch }}
      on_native_dev: ${{ steps.plan.outputs.on_native_dev }}
      on_persistent_dev: ${{ steps.plan.outputs.on_persistent_dev }}
      group: ${{ steps.plan.outputs.group }}
    steps:
      - uses: actions/checkout@v6
        if: inputs.pipeline_phase != 'verify'
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: $/actions/cf-tools
        with:
          install: 'true'
      - id: plan
        env:
          INPUTS_JSON: ${{ toJSON(inputs) }}
          PHASE_STATE: ${{ inputs.pipeline_phase == 'verify' && inputs.phase_state || '{}' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PHASE: ${{ inputs.pipeline_phase }}
        run: |
          node "$TOOLS_DIR/cli.mjs" plan --event "$GITHUB_EVENT_NAME" --ref "$GITHUB_REF" --phase "$PHASE" --run-id "$GITHUB_RUN_ID" --app-dir "$GITHUB_WORKSPACE/${{ inputs.app_path }}" | tee -a "$GITHUB_OUTPUT"

  # =========================================================================
  # Migration — the ONE job that mutates a database; there is no separate Preflight stage. Its steps run in this order and a failing step
  # stops the job, so every read-only check precedes the single remote mutation:
  #   0. precheck (stage precheck): two read-only SELECTs on the owner's exact physical D1 (identity checked against the plan first). NOTHING
  #      pending -> steps 1-2 are skipped, no target is built here, and the result carries `precheck: verified_no_pending` bound to the owner,
  #      the D1 id and this commit (the Delivery gate accepts it like an applied migration; a skipped / failed / stale job never carries it).
  #      A failing or unreadable query fails the job (never read as "nothing pending"). Pending, or anything it cannot prove -> steps 1-2.
  #   1. each enabled target that is not the owner: target build, effective-config audit, exact D1 binding (stage preflight)
  #   2. the owner: target build, audit, exact D1 binding, stale-SHA guard, then the migration (stage migrate)
  # The plan picked the owner and its Environment (main -> <app>/prod with its approvals; else the shared Preview/Dev D1). Skipped (Delivery
  # proceeds) without d1_migrations; never on pull_request, delete or a verify call. The D1 schema is never rolled back automatically.
  # =========================================================================
  migration:
    name: Migrate
    needs: [plan]
    if: always() && inputs.pipeline_phase != 'verify' && inputs.d1_migrations && needs.plan.result == 'success' && needs.plan.outputs.has_migrations == 'true'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 45
    environment:
      name: ${{ fromJSON(needs.plan.outputs.migration || '{}').environment }}
    permissions:
      contents: read
      deployments: read # Preview identity guard reads the ledger owner (no ledger entry is written here)
    outputs:
      migration_json: ${{ steps.precheck.outputs.precheck == 'pending' && toJSON(steps.migrate.outputs) || toJSON(steps.precheck.outputs) }}
      migration_status: ${{ steps.result.outputs.status }}
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      # Read-only first: when the owner's physical D1 has NOTHING pending, no target is built here (each Deploy still builds, audits and checks
      # its D1 binding before it publishes, and its gate requires this verified result). Pending -> the full path below, unchanged.
      - id: precheck
        name: Check pending D1 migrations (read-only, no build)
        uses: $/actions/cf-deploy
        with:
          target: ${{ fromJSON(needs.plan.outputs.descriptors)[fromJSON(needs.plan.outputs.migration).kind].target }}
          descriptor: ${{ toJSON(fromJSON(needs.plan.outputs.descriptors)[fromJSON(needs.plan.outputs.migration).kind]) }}
          kind: ${{ fromJSON(needs.plan.outputs.migration).kind }}
          stage: precheck
          inputs_json: ${{ toJSON(inputs) }}
          d1_expected_id: ${{ fromJSON(needs.plan.outputs.migration).d1_id }}
      - name: Verify native-dev build and D1 binding
        if: steps.precheck.outputs.precheck == 'pending' && needs.plan.outputs.on_native_dev == 'true' && fromJSON(needs.plan.outputs.migration).kind != 'native-dev'
        uses: $/actions/cf-deploy
        with:
          target: ${{ fromJSON(needs.plan.outputs.descriptors)['native-dev'].target }}
          descriptor: ${{ toJSON(fromJSON(needs.plan.outputs.descriptors)['native-dev']) }}
          kind: native-dev
          stage: preflight
          inputs_json: ${{ toJSON(inputs) }}
          d1_expected_id: ${{ fromJSON(needs.plan.outputs.descriptors)['native-dev'].d1_expected_id }}
          preview_secrets: ${{ fromJSON(needs.plan.outputs.descriptors)['native-dev'].target == 'preview' && secrets.PREVIEW_SECRETS || '' }}
      - name: Verify persistent-dev build and D1 binding
        if: steps.precheck.outputs.precheck == 'pending' && needs.plan.outputs.on_persistent_dev == 'true' && fromJSON(needs.plan.outputs.migration).kind != 'persistent-dev'
        uses: $/actions/cf-deploy
        with:
          target: ${{ fromJSON(needs.plan.outputs.descriptors)['persistent-dev'].target }}
          descriptor: ${{ toJSON(fromJSON(needs.plan.outputs.descriptors)['persistent-dev']) }}
          kind: persistent-dev
          stage: preflight
          inputs_json: ${{ toJSON(inputs) }}
          d1_expected_id: ${{ fromJSON(needs.plan.outputs.descriptors)['persistent-dev'].d1_expected_id }}
          preview_secrets: ${{ fromJSON(needs.plan.outputs.descriptors)['persistent-dev'].target == 'preview' && secrets.PREVIEW_SECRETS || '' }}
      - id: migrate
        name: Apply pending D1 migrations (once)
        if: steps.precheck.outputs.precheck == 'pending'
        uses: $/actions/cf-deploy
        with:
          target: ${{ fromJSON(needs.plan.outputs.descriptors)[fromJSON(needs.plan.outputs.migration).kind].target }}
          descriptor: ${{ toJSON(fromJSON(needs.plan.outputs.descriptors)[fromJSON(needs.plan.outputs.migration).kind]) }}
          kind: ${{ fromJSON(needs.plan.outputs.migration).kind }}
          stage: migrate
          inputs_json: ${{ toJSON(inputs) }}
          d1_expected_id: ${{ fromJSON(needs.plan.outputs.migration).d1_id }}
          preview_secrets: ${{ fromJSON(needs.plan.outputs.descriptors)[fromJSON(needs.plan.outputs.migration).kind].target == 'preview' && secrets.PREVIEW_SECRETS || '' }}
      # The one deterministic public status: applied | none (nothing was pending / superseded) when the job succeeded, failed otherwise
      # (also when a validation step stopped the job before the migrate step ran).
      - id: result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          STATE: ${{ steps.migrate.outputs.migration }}
        run: echo "status=$([ "$JOB_STATUS" = success ] && echo "${STATE:-none}" || echo failed)" >> "$GITHUB_OUTPUT"

  # =========================================================================
  # Delivery — ONE call per enabled kind of _cf-worker-delivery.yml (deploy -> smoke -> conditional rollback). A kind needs only the plan and
  # the single Migration job (success, or skipped when nothing is migrated) and is never touched by another kind's Deploy / Smoke / Rollback.
  # =========================================================================
  delivery_production:
    name: production
    needs: [plan, migration]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.on_production == 'true' && (needs.migration.result == 'success' || needs.migration.result == 'skipped')
    uses: $/.github/workflows/_cf-worker-delivery.yml
    permissions: &delivery_permissions
      contents: read
      deployments: write
      pull-requests: write
    with:
      descriptor: ${{ toJSON(fromJSON(needs.plan.outputs.descriptors)['production']) }}
      runner: ${{ inputs.runner }}
      inputs_json: ${{ inputs.pipeline_phase == 'verify' && toJSON(fromJSON(inputs.phase_state).inputs) || toJSON(inputs) }}
      call_inputs_json: ${{ inputs.pipeline_phase == 'verify' && toJSON(inputs) || '' }}
      phase: ${{ inputs.pipeline_phase }}
      migration_result: ${{ needs.migration.result }}
      migration_json: ${{ needs.migration.outputs.migration_json }}
      handoff_json: ${{ inputs.pipeline_phase == 'verify' && fromJSON(inputs.phase_state).deploy.h_production || '' }}
      migration_json_in: ${{ inputs.pipeline_phase == 'verify' && fromJSON(inputs.phase_state).migration.mj_production || '' }}
      upstream_gate: ${{ inputs.pipeline_phase == 'verify' && inputs.upstream_gate || '' }}
    secrets: &delivery_secrets
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PREVIEW_SECRETS: ${{ secrets.PREVIEW_SECRETS }}
      SMOKE_USERNAME: ${{ secrets.SMOKE_USERNAME }}
      SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}

  delivery_native_branch:
    name: native-branch
    needs: [plan, migration]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.on_native_branch == 'true' && (needs.migration.result == 'success' || needs.migration.result == 'skipped')
    uses: $/.github/workflows/_cf-worker-delivery.yml
    permissions: *delivery_permissions
    with:
      descriptor: ${{ toJSON(fromJSON(needs.plan.outputs.descriptors)['native-branch']) }}
      runner: ${{ inputs.runner }}
      inputs_json: ${{ inputs.pipeline_phase == 'verify' && toJSON(fromJSON(inputs.phase_state).inputs) || toJSON(inputs) }}
      call_inputs_json: ${{ inputs.pipeline_phase == 'verify' && toJSON(inputs) || '' }}
      phase: ${{ inputs.pipeline_phase }}
      migration_result: ${{ needs.migration.result }}
      migration_json: ${{ needs.migration.outputs.migration_json }}
      handoff_json: ${{ inputs.pipeline_phase == 'verify' && fromJSON(inputs.phase_state).deploy.h_native_branch || '' }}
      migration_json_in: ${{ inputs.pipeline_phase == 'verify' && fromJSON(inputs.phase_state).migration.mj_native_branch || '' }}
      upstream_gate: ${{ inputs.pipeline_phase == 'verify' && inputs.upstream_gate || '' }}
    secrets: *delivery_secrets

  delivery_native_dev:
    name: native-dev
    needs: [plan, migration]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.on_native_dev == 'true' && (needs.migration.result == 'success' || needs.migration.result == 'skipped')
    uses: $/.github/workflows/_cf-worker-delivery.yml
    permissions: *delivery_permissions
    with:
      descriptor: ${{ toJSON(fromJSON(needs.plan.outputs.descriptors)['native-dev']) }}
      runner: ${{ inputs.runner }}
      inputs_json: ${{ inputs.pipeline_phase == 'verify' && toJSON(fromJSON(inputs.phase_state).inputs) || toJSON(inputs) }}
      call_inputs_json: ${{ inputs.pipeline_phase == 'verify' && toJSON(inputs) || '' }}
      phase: ${{ inputs.pipeline_phase }}
      migration_result: ${{ needs.migration.result }}
      migration_json: ${{ needs.migration.outputs.migration_json }}
      handoff_json: ${{ inputs.pipeline_phase == 'verify' && fromJSON(inputs.phase_state).deploy.h_native_dev || '' }}
      migration_json_in: ${{ inputs.pipeline_phase == 'verify' && fromJSON(inputs.phase_state).migration.mj_native_dev || '' }}
      upstream_gate: ${{ inputs.pipeline_phase == 'verify' && inputs.upstream_gate || '' }}
    secrets: *delivery_secrets

  delivery_persistent_dev:
    name: persistent-dev
    needs: [plan, migration]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.on_persistent_dev == 'true' && (needs.migration.result == 'success' || needs.migration.result == 'skipped')
    uses: $/.github/workflows/_cf-worker-delivery.yml
    permissions: *delivery_permissions
    with:
      descriptor: ${{ toJSON(fromJSON(needs.plan.outputs.descriptors)['persistent-dev']) }}
      runner: ${{ inputs.runner }}
      inputs_json: ${{ inputs.pipeline_phase == 'verify' && toJSON(fromJSON(inputs.phase_state).inputs) || toJSON(inputs) }}
      call_inputs_json: ${{ inputs.pipeline_phase == 'verify' && toJSON(inputs) || '' }}
      phase: ${{ inputs.pipeline_phase }}
      migration_result: ${{ needs.migration.result }}
      migration_json: ${{ needs.migration.outputs.migration_json }}
      handoff_json: ${{ inputs.pipeline_phase == 'verify' && fromJSON(inputs.phase_state).deploy.h_persistent_dev || '' }}
      migration_json_in: ${{ inputs.pipeline_phase == 'verify' && fromJSON(inputs.phase_state).migration.mj_persistent_dev || '' }}
      upstream_gate: ${{ inputs.pipeline_phase == 'verify' && inputs.upstream_gate || '' }}
    secrets: *delivery_secrets

  # -------------------------------------------------------------------------
  # Release — optional, main only, only after THIS run deployed its own SHA to Production, the Production Smoke verified it at
  # content level (smoke_mode skip / liveness never qualify) and no Rollback ran. It reads ONLY the Production delivery call.
  # -------------------------------------------------------------------------
  release:
    name: Release
    needs: [delivery_production]
    if: always() && inputs.release_cmd != '' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && inputs.dispatch_target != 'persistent-dev' && inputs.pipeline_phase != 'deploy' && needs.delivery_production.result == 'success' && fromJSON(needs.delivery_production.outputs.smoke_json || '{}').deployed_and_verified == 'true' && needs.delivery_production.outputs.rollback_result == ''
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: $/actions/setup
        with:
          setup-node: 'false'
          setup-pnpm: 'false'
      - name: Release
        working-directory: ${{ inputs.app_path }}
        env:
          CMD: ${{ inputs.release_cmd }}
        run: bash -c "$CMD"

  # -------------------------------------------------------------------------
  # Config guard — a production-only Worker must never expose a Dev deployment, and the two automatic Dev channels conflict. Fails the run
  # on ANY event so a misconfigured caller is visible. (production-only keeps ignoring preview_on_branch_push=true, for compatibility.)
  # -------------------------------------------------------------------------
  config-guard:
    name: Guard
    if: inputs.pipeline_phase != 'verify' && ((inputs.deployment_strategy == 'production-only' && (inputs.shared_dev_on_branch_push || inputs.shared_dev_native_preview_on_branch_push)) || (inputs.shared_dev_on_branch_push && inputs.shared_dev_native_preview_on_branch_push))
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 2
    steps:
      - run: |
          echo "::error::Invalid Dev channel configuration: production-only cannot be combined with shared_dev_on_branch_push / shared_dev_native_preview_on_branch_push (a production-only Worker must not expose a Dev deployment), and the separate persistent Dev Worker and the Native Dev Preview are conflicting automatic Dev channels - enable only one."
          exit 1

  # -------------------------------------------------------------------------
  # Event handlers outside the delivery DAG, one small reusable workflow each: `lifecycle` (same-repo PR -> comment the verified Preview URL;
  # branch delete -> retire the ledger, the Preview is KEPT).
  # -------------------------------------------------------------------------
  lifecycle:
    name: lifecycle
    if: inputs.pipeline_phase != 'verify' && inputs.deployment_strategy != 'production-only' && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'delete' && github.event.ref_type == 'branch'))
    uses: $/.github/workflows/_cf-worker-lifecycle.yml
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    with:
      app_name: ${{ inputs.app_name }}
      preview_worker_name: ${{ inputs.preview_worker_name }}
      reserve_native_dev: ${{ inputs.shared_dev_native_preview_on_branch_push }}
      runner: ${{ inputs.runner }}
