name: Postgres Migration Test

# ---------------------------------------------------------------------------
# Reusable workflow: validates and applies Atlas-managed Postgres migrations
# against an ephemeral, disposable database. No production secrets involved.
# ---------------------------------------------------------------------------

on:
  workflow_call:
    inputs:
      migrations-path:
        description: Path to the Atlas migrations directory
        type: string
        default: 'db/migrations'
      atlas-config:
        description: Path to the Atlas config file (atlas.hcl)
        type: string
        default: 'db/atlas.hcl'
      postgres-version:
        description: Postgres major version to test against
        type: string
        default: '16'
      runner:
        description: Runner label
        type: string
        default: ubuntu-latest

jobs:
  test:
    name: Validate & Apply Migrations
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:${{ inputs.postgres-version }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          # Let Actions allocate an available host port. Self-hosted runners
          # commonly already have (or reserve) 5432, so a fixed mapping is
          # not a reliable way for the job process to reach this service.
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres -d test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ATLAS_VERSION: v1.3.0
    steps:
      - uses: actions/checkout@v6

      # The job.services context is only available inside steps, not in the
      # job-level env block. On the self-hosted fleet, this job executes in a
      # runner container while service ports are published on the Docker host;
      # the bridge gateway reaches that host (127.0.0.1 would be the runner).
      - name: Configure ephemeral Postgres URL
        env:
          POSTGRES_PORT: ${{ job.services.postgres.ports[5432] }}
        run: |
          set -euo pipefail
          DOCKER_HOST_GATEWAY=$(docker network inspect bridge --format '{{(index .IPAM.Config 0).Gateway}}')
          echo "DATABASE_URL=postgres://postgres:test@${DOCKER_HOST_GATEWAY}:${POSTGRES_PORT}/test?sslmode=disable" >> "$GITHUB_ENV"

      - name: Install Atlas CLI
        run: |
          curl -sSf https://atlasgo.sh | sh -s -- --community --yes --version "$ATLAS_VERSION"
          atlas version

      - name: Validate migration directory
        run: |
          atlas migrate validate \
            --dir "file://${{ inputs.migrations-path }}" \
            --config "file://${{ inputs.atlas-config }}"

      - name: Apply migrations to ephemeral database
        run: |
          atlas migrate apply \
            --dir "file://${{ inputs.migrations-path }}" \
            --config "file://${{ inputs.atlas-config }}" \
            --url "$DATABASE_URL"

      - name: Verify clean migration state
        run: |
          STATUS=$(atlas migrate status \
            --dir "file://${{ inputs.migrations-path }}" \
            --config "file://${{ inputs.atlas-config }}" \
            --url "$DATABASE_URL")
          echo "$STATUS"
          if ! echo "$STATUS" | grep -q "Migration Status: OK"; then
            echo "::error::Migration status is not clean after apply (expected 'Migration Status: OK')"
            exit 1
          fi
          if echo "$STATUS" | grep -qE "Pending Files:[[:space:]]*[1-9]"; then
            echo "::error::Migration status shows pending migrations after apply"
            exit 1
          fi
