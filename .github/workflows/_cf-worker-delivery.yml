name: CF Worker delivery (one target)

# ---------------------------------------------------------------------------
# INTERNAL — called ONLY by _cf-worker-v2.yml (one `uses:` per enabled delivery kind). Not a public entrypoint.
# OpenSpec: openspec/changes/unify-cf-worker-v2-delivery-targets. Contract: docs/cf-worker-v2-unified-delivery.md
#
# ONE implementation of target delivery, parameterised by the target descriptor (`kind` production | native-branch | native-dev |
# persistent-dev), reusing the audited engine (actions/cf-deploy -> actions/cf-preview/engine.sh). A call handles exactly ONE target,
# so every `needs.<job>.outputs.*` below is unambiguous: there is no matrix, no shared output key, no completion-order merge.
#
#   deploy -> smoke -> conditional rollback of THIS kind, independent of every other kind
#   (pipeline_phase deploy = deploy only; verify = smoke + rollback from the handed-over deploy result)
#
# `manual: true` (kind persistent-dev only; the public workflow sets it for the protected workflow_dispatch of the approved ref) runs the
# single `manual` job INSTEAD of deploy / smoke / rollback: the same engine in manual mode (stage all: build -> audit -> migration -> publish
# -> smoke -> ledger; NO automatic recovery) or, when dev_build_cmd is empty, the legacy two-command contract (never recorded in the
# last-good ledger). Plan and Migration do not run for a dispatch, so there is no descriptor and no migration hand-over; the job reads its
# settings from inputs_json. Its Environment `<app>/dev`, narrower permissions and concurrency group are properties of the job itself.
#
# Pre-mutation validation and the D1 migration are NOT here: the public workflow runs them once, in its single Migration job, and
# passes the result in (`migration_result` / `migration_json`).
#
# Reusable-workflow constraints honoured here: static `uses:` in the caller; the engine is `uses: $/actions/cf-deploy` (the
# self-repository syntax: this repository at the running commit, nothing checked out into the caller's workspace); permissions never exceed the calling job's; secrets are passed
# explicitly; the GitHub Environment is a job property of the called workflow; job-level concurrency only (the workflow-level
# group belongs to the public workflow, reusing it here would deadlock).
# ---------------------------------------------------------------------------

on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: linux
      inputs_json:
        description: toJSON of the effective public inputs (the deploy call's inputs for a deferred verify). Data only.
        type: string
        required: true
      call_inputs_json:
        description: Deferred verify only - toJSON of the verify call's inputs (identity cross-check)
        type: string
        default: ''
      phase:
        description: pipeline_phase - all | deploy | verify
        type: string
        default: all
      d1_migrations:
        type: boolean
        default: false
      migration_result:
        description: needs.migration.result of the single Migration job ('skipped' when d1_migrations is false or on a verify call)
        type: string
        default: ''
      migration_json:
        description: the Migration job's migration_json output (the one deterministic migration result of the run)
        type: string
        default: ''
      handoff_json:
        description: verify only - the deploy result of THIS kind from phase_state
        type: string
        default: ''
      migration_json_in:
        description: verify only - the migration result of THIS kind from phase_state
        type: string
        default: ''
      upstream_gate:
        description: verify only - needs.<job>.result of the job the cross-service smoke depends on
        type: string
        default: ''
      descriptor:
        description: toJSON of THIS kind's target descriptor (versioned, validated by the Plan job and re-validated by the engine). Carries the engine target, GitHub Environment, concurrency groups, expected physical D1, migration owner and smoke mode; never a secret. `{}` with manual (no Plan runs for the dispatch; unused).
        type: string
        required: true
      manual:
        description: persistent-dev only - the protected manual dispatch of the approved ref; runs the `manual` job instead of deploy / smoke / rollback
        type: boolean
        default: false
    outputs:
      handoff:
        description: the validated deploy result of THIS kind (own publish in the deploy phase, the handed-over one in the verify phase)
        value: ${{ jobs.deploy.outputs.handoff || jobs.smoke.outputs.handoff }}
      migration_used:
        description: the migration result this kind's deployment depended on (shared-D1 mapping resolved)
        value: ${{ jobs.deploy.outputs.migration_used || jobs.smoke.outputs.migration_used }}
      smoke_json:
        description: engine outputs of this kind's Smoke
        value: ${{ jobs.smoke.outputs.smoke_json }}
      smoke_status:
        description: success | failure | none (nothing published, so nothing was smoked)
        value: ${{ jobs.smoke.outputs.smoke_status }}
      rollback_result:
        description: restored_verified | restored_unverified | restored_unhealthy | blocked | failed | no_known_good; empty when no rollback ran
        value: ${{ jobs.rollback.outputs.rollback_result }}
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false
      PREVIEW_SECRETS:
        required: false
      SMOKE_USERNAME:
        required: false
      SMOKE_PASSWORD:
        required: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # -------------------------------------------------------------------------
  # Deploy — target-specific Build + Publish (stage publish) of THIS kind: its own URL (resolved before the build), its own build
  # env, the audited artifact only. Depends on the run's single Migration result and on nothing
  # of any other kind. A green Deploy means "published", not "verified".
  # -------------------------------------------------------------------------
  deploy:
    name: Deploy
    if: inputs.phase != 'verify' && !inputs.manual
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 45
    concurrency:
      group: ${{ fromJSON(inputs.descriptor).deploy_group }}
      cancel-in-progress: false
    environment:
      name: ${{ fromJSON(inputs.descriptor).environment }}
      url: ${{ steps.engine.outputs.url }}
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    outputs:
      handoff: ${{ toJSON(steps.engine.outputs) }}
      migration_used: ${{ steps.engine.outputs.migration_used }}
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: engine
        uses: $/actions/cf-deploy
        with:
          target: ${{ fromJSON(inputs.descriptor).target }}
          descriptor: ${{ inputs.descriptor }}
          kind: ${{ fromJSON(inputs.descriptor).kind }}
          stage: publish
          migration_result: ${{ inputs.migration_result }}
          migration_json: ${{ inputs.migration_json }}
          inputs_json: ${{ inputs.inputs_json }}
          d1_expected_id: ${{ fromJSON(inputs.descriptor).d1_expected_id }}
          preview_secrets: ${{ fromJSON(inputs.descriptor).target == 'preview' && secrets.PREVIEW_SECRETS || '' }}

  # -------------------------------------------------------------------------
  # Smoke — verifies THIS kind's deployment only (stage verify, no Cloudflare credentials): smoke_mode full | basic | skip.
  # Starts the moment THIS kind's deploy is done. A kind that published nothing (stale / superseded / failed) has nothing to
  # verify: smoke_status=none and no verification is claimed.
  # -------------------------------------------------------------------------
  smoke:
    name: Smoke Tests
    needs: [deploy]
    if: always() && inputs.phase != 'deploy' && !inputs.manual
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    outputs:
      smoke_json: ${{ toJSON(steps.engine.outputs) }}
      smoke_status: ${{ steps.res.outputs.status }}
      handoff: ${{ inputs.phase == 'verify' && inputs.handoff_json || '' }}
      migration_used: ${{ inputs.phase == 'verify' && inputs.migration_json_in || '' }}
    env:
      GH_TOKEN: ${{ github.token }}
      HANDOFF: ${{ inputs.phase == 'verify' && inputs.handoff_json || needs.deploy.outputs.handoff }}
    steps:
      - id: go
        name: Did this run publish ${{ fromJSON(inputs.descriptor).kind }}?
        run: |
          h="${HANDOFF:-}"; [ -n "$h" ] || h='{}'
          echo "go=$(printf '%s' "$h" | jq -r '.published == "true"')" >> "$GITHUB_OUTPUT"
      # GitHub appends `success` (with no environment_url: nothing was published) to the Environment deployment when the Deploy
      # job ends, even when the stale guard skipped every publish step. This job runs after Deploy ended, so it can correct that
      # record: a superseded Production run is "inactive", not a successful deployment with a blank URL. Production only.
      - name: Mark a superseded Production deployment inactive
        if: steps.go.outputs.go != 'true' && fromJSON(inputs.descriptor).kind == 'production'
        env:
          ENV_NAME: ${{ fromJSON(inputs.descriptor).environment }}
        run: |
          h="${HANDOFF:-}"; [ -n "$h" ] || h='{}'
          [ "$(printf '%s' "$h" | jq -r '.stale == "true"')" = true ] || exit 0
          id="$(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=$(printf %s "$ENV_NAME" | jq -sRr @uri)&sha=$GITHUB_SHA&per_page=1" -q '.[0].id // empty')" || id=""
          if [ -z "$id" ]; then echo "::warning::no $ENV_NAME deployment at $GITHUB_SHA to mark as superseded"; exit 0; fi
          gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" -f state=inactive -f log_url="${GITHUB_SERVER_URL:-https://github.com}/$GITHUB_REPOSITORY/actions/runs/${GITHUB_RUN_ID:-0}" \
            -f description="Superseded by a newer push before publish; nothing deployed" >/dev/null \
            || echo "::warning::could not mark the superseded $ENV_NAME deployment inactive"
      - uses: actions/checkout@v6
        if: steps.go.outputs.go == 'true'
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: engine
        if: steps.go.outputs.go == 'true'
        uses: $/actions/cf-deploy
        with:
          target: ${{ fromJSON(inputs.descriptor).target }}
          descriptor: ${{ inputs.descriptor }}
          kind: ${{ fromJSON(inputs.descriptor).kind }}
          stage: verify
          inputs_json: ${{ inputs.inputs_json }}
          call_inputs_json: ${{ inputs.call_inputs_json }}
          d1_expected_id: ${{ fromJSON(inputs.descriptor).d1_expected_id }}
          preview_secrets: ${{ fromJSON(inputs.descriptor).target == 'preview' && secrets.PREVIEW_SECRETS || '' }}
          smoke_username: ${{ secrets.SMOKE_USERNAME }}
          smoke_password: ${{ secrets.SMOKE_PASSWORD }}
          deploy_outputs: ${{ env.HANDOFF }}
          upstream_gate: ${{ inputs.phase == 'verify' && inputs.upstream_gate || '' }}
      - id: res
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          GO: ${{ steps.go.outputs.go }}
        run: echo "status=$([ "$GO" = true ] && echo "$JOB_STATUS" || echo none)" >> "$GITHUB_OUTPUT"
      # Failure-only evidence with short retention; never a delivery dependency.
      - name: Upload smoke report (failure only)
        uses: actions/upload-artifact@v7
        if: failure()
        continue-on-error: true
        with:
          name: smoke-report-${{ fromJSON(inputs.descriptor).kind }}-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  # -------------------------------------------------------------------------
  # Revert on Verify Failure — runs ONLY for THIS kind, ONLY when its Smoke FAILED on a deployment this run published (never
  # after a blocked cross-service gate, never after smoke_mode=skip). Another kind's failure or success cannot reach it.
  #   production : policy `automatic` only; fail closed (recorded previous version, additive D1 change, failed version still live)
  #   other kinds: redeploy the last known-good deployment of THAT target, unless a newer deployment of it has started
  # The job is green ONLY when the previous deployment was restored and content-verified. D1 is never rolled back.
  # -------------------------------------------------------------------------
  rollback:
    name: Revert on Verify Failure
    needs: [deploy, smoke]
    if: always() && inputs.phase != 'deploy' && !inputs.manual && needs.smoke.outputs.smoke_status == 'failure' && (fromJSON(inputs.descriptor).kind != 'production' || fromJSON(inputs.inputs_json).production_rollback_policy == 'automatic') && fromJSON(needs.smoke.outputs.smoke_json || '{}').gate_blocked != 'true'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 45
    concurrency:
      group: ${{ fromJSON(inputs.descriptor).rollback_group }}
      cancel-in-progress: false
    environment:
      name: ${{ fromJSON(inputs.descriptor).environment }}
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    outputs:
      rollback_result: ${{ steps.engine.outputs.rollback_result }}
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      HANDOFF: ${{ inputs.phase == 'verify' && inputs.handoff_json || needs.deploy.outputs.handoff }}
      MIGJSON: ${{ inputs.phase == 'verify' && inputs.migration_json_in || needs.deploy.outputs.migration_used }}
      SMOKEJSON: ${{ needs.smoke.outputs.smoke_json }}
    steps:
      - id: go
        name: Did the Smoke of ${{ fromJSON(inputs.descriptor).kind }} fail on a deployment this run published?
        env:
          POLICY_OK: ${{ fromJSON(inputs.descriptor).kind != 'production' || fromJSON(inputs.inputs_json).production_rollback_policy == 'automatic' }}
        run: |
          h="${HANDOFF:-}"; [ -n "$h" ] || h='{}'; k="${SMOKEJSON:-}"; [ -n "$k" ] || k='{}'
          pub="$(printf '%s' "$h" | jq -r '.published == "true"')"
          blocked="$(printf '%s' "$k" | jq -r '.gate_blocked == "true"')"
          if [ "$pub" = true ] && [ "$blocked" != true ] && [ "$POLICY_OK" = true ]; then echo "go=true" >> "$GITHUB_OUTPUT"; else echo "go=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v6
        if: steps.go.outputs.go == 'true'
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: engine
        if: steps.go.outputs.go == 'true'
        uses: $/actions/cf-deploy
        with:
          target: ${{ fromJSON(inputs.descriptor).target }}
          descriptor: ${{ inputs.descriptor }}
          kind: ${{ fromJSON(inputs.descriptor).kind }}
          stage: rollback
          inputs_json: ${{ inputs.inputs_json }}
          call_inputs_json: ${{ inputs.call_inputs_json }}
          d1_expected_id: ${{ fromJSON(inputs.descriptor).d1_expected_id }}
          preview_secrets: ${{ fromJSON(inputs.descriptor).target == 'preview' && secrets.PREVIEW_SECRETS || '' }}
          smoke_username: ${{ secrets.SMOKE_USERNAME }}
          smoke_password: ${{ secrets.SMOKE_PASSWORD }}
          deploy_outputs: ${{ env.HANDOFF }}
          migration_outputs: ${{ env.MIGJSON }}
          smoke_outputs: ${{ env.SMOKEJSON }}

  # -------------------------------------------------------------------------
  # Manual persistent Dev (Hybrid) — explicit dispatch of the approved ref only (the caller's `if` checks dispatch_target, strategy hybrid and
  # persistent_dev_ref; the engine re-checks the ref). Never a side effect of a feature-branch push. Runs INSTEAD of deploy / smoke / rollback.
  #   dev_build_cmd set   : the SAME delivery engine in manual mode, ONE job (build -> audit -> migration -> publish -> smoke -> ledger,
  #                         recorded verified ONLY after the smoke passes; no automatic recovery)
  #   dev_build_cmd empty : the legacy two-command contract, unchanged (dev_deploy_cmd builds AND publishes, dev_smoke_cmd checks). It is never
  #                         recorded in the Shared Dev last-good ledger, so automatic recovery can never treat it as known-good.
  # The Environment `<app>/dev` is a property of this job, so its protection rules and approvals apply exactly as for the automatic kind.
  # -------------------------------------------------------------------------
  manual:
    name: manual
    if: inputs.manual
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 45
    environment: ${{ fromJSON(inputs.inputs_json).app_name }}/dev
    concurrency:
      group: cfv2-dev-${{ github.repository }}-${{ fromJSON(inputs.inputs_json).d1_lock_scope != '' && fromJSON(inputs.inputs_json).d1_lock_scope || fromJSON(inputs.inputs_json).app_name }}
      cancel-in-progress: false
    permissions:
      contents: read
      deployments: write # engine mode only: Dev ledger entry, recorded verified ONLY after the smoke passes
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      # ---- Engine contract (dev_build_cmd set)
      - id: engine
        if: fromJSON(inputs.inputs_json).dev_build_cmd != ''
        uses: $/actions/cf-deploy
        with:
          target: dev
          mode: manual
          inputs_json: ${{ inputs.inputs_json }}
          smoke_username: ${{ secrets.SMOKE_USERNAME }}
          smoke_password: ${{ secrets.SMOKE_PASSWORD }}
      # ---- Legacy contract (dev_build_cmd empty)
      - uses: $/actions/setup
        if: fromJSON(inputs.inputs_json).dev_build_cmd == ''
        with:
          setup-node: 'false'
          setup-pnpm: 'false'
      - name: Deploy persistent Dev
        if: fromJSON(inputs.inputs_json).dev_build_cmd == ''
        working-directory: ${{ fromJSON(inputs.inputs_json).app_path }}
        env:
          CMD: ${{ fromJSON(inputs.inputs_json).dev_deploy_cmd }}
        run: |
          [ -n "$CMD" ] || { echo "::error::dev_deploy_cmd required"; exit 1; }
          bash -c "$CMD"
      - name: Dev smoke (Cron/Queue-adjacent checks)
        if: fromJSON(inputs.inputs_json).dev_build_cmd == '' && fromJSON(inputs.inputs_json).dev_smoke_cmd != ''
        working-directory: ${{ fromJSON(inputs.inputs_json).app_path }}
        env:
          CMD: ${{ fromJSON(inputs.inputs_json).dev_smoke_cmd }}
        run: bash -c "$CMD"
