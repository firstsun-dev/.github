name: CF Worker v2 pipeline tests

# Self-tests of the shared Cloudflare Worker pipeline: three independent suites in parallel, ONE stable required check (`Pipeline Gate`).
#   static  actionlint, shellcheck, workflow / action structure       unit    pure logic (tasks, routing, planning, gates, CLI contract)
#   safety  engine scenarios with stub wrangler / gh / curl (no provider side effects)
# No `paths` filter: a required check must exist for every PR. Read-only; nothing is deployed or migrated from here.
# Real GitHub scheduling / permissions / reusable-workflow calls are proven by the canary on cf-v2-scratch-caller, not emulated here.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cf-v2-pipeline-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    name: Static
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: pip install --quiet pyyaml==6.0.1
      - name: Install actionlint
        run: bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12 "$RUNNER_TEMP" && echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: scripts/cf-preview/test.sh static

  unit:
    name: Unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: cd actions/cf-preview && npm ci --ignore-scripts --omit=optional --no-audit --no-fund
      - run: scripts/cf-preview/test.sh unit

  safety:
    name: Safety
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: cd actions/cf-preview && npm ci --ignore-scripts --omit=optional --no-audit --no-fund
      - run: scripts/cf-preview/test.sh safety

  # Fail closed: every suite must have SUCCEEDED; failure, cancellation and a skip all fail the gate.
  gate:
    name: Pipeline Gate
    needs: [static, unit, safety]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          STATIC: ${{ needs.static.result }}
          UNIT: ${{ needs.unit.result }}
          SAFETY: ${{ needs.safety.result }}
        run: |
          bad=0
          for s in STATIC UNIT SAFETY; do [ "${!s}" = success ] || { echo "::error::$s finished '${!s}' (must succeed)"; bad=1; }; done
          exit "$bad"
