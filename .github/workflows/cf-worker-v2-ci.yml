name: CF Worker v2 contract tests

on:
  pull_request:
    paths:
      - '.github/workflows/_cf-worker-v2.yml'
      - '.github/workflows/cf-worker-v2-ci.yml'
      - '.github/actionlint.yaml'
      - 'actions/cf-preview/**'
      - 'actions/cf-deploy/**'
      - 'actions/cf-ci-check/**'
      - 'scripts/cf-preview/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/_cf-worker-v2.yml'
      - '.github/actionlint.yaml'
      - 'actions/cf-preview/**'
      - 'actions/cf-deploy/**'
      - 'actions/cf-ci-check/**'
      - 'scripts/cf-preview/**'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install tooling deps
        run: cd actions/cf-preview && npm ci --ignore-scripts --no-audit --no-fund
      - name: Workflow + composite action contract (DAG, gating matrix, credential isolation, concurrency, engine order, cross-repo references)
        run: |
          pip install --quiet pyyaml==6.0.1
          python3 scripts/cf-preview/test-workflow-contract.py
      - name: Unit tests (identity, event/target matrix, preflight, Dev resource policy, migration target, D1 consistency, artifact digest, protected env)
        run: node --test scripts/cf-preview/lib.test.mjs
      - name: build.sh / publish.sh behaviour, all targets, same-artifact contract (stub wrangler)
        run: scripts/cf-preview/test-deploy.sh
      - name: migrate.sh behaviour (stub wrangler)
        run: scripts/cf-preview/test-migrate.sh
      - name: Smoke verification, fail-closed (stub curl)
        run: scripts/cf-preview/test-smoke.sh
      - name: Execute the real Deploy / Shared Dev / persistent-Dev jobs incl. the composite engine with stubs (migration step order, stale runs, recovery, env-override protection, Release gate)
        run: python3 scripts/cf-preview/test-jobs.py
      - name: Env import is data, not code
        run: scripts/cf-preview/test-parse-env.sh
      - name: Preview probe classification (stub curl)
        run: scripts/cf-preview/test-probe.sh
      - name: GitHub ledger / PR comment idempotency (stub gh)
        run: scripts/cf-preview/test-gh.sh
      - name: shellcheck (warnings and above)
        run: |
          shellcheck -x -S warning -P SCRIPTDIR actions/cf-preview/*.sh scripts/cf-preview/*.sh
          python3 scripts/cf-preview/shellcheck-actions.py
      - name: actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color .github/workflows/_cf-worker-v2.yml .github/workflows/cf-worker-v2-ci.yml
