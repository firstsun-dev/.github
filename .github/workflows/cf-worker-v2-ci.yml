name: CF Worker v2 contract tests

on:
  pull_request:
    paths:
      - '.github/workflows/_cf-worker-v2.yml'
      - '.github/workflows/cf-worker-v2-ci.yml'
      - 'actions/cf-preview/**'
      - 'scripts/cf-preview/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/_cf-worker-v2.yml'
      - 'actions/cf-preview/**'
      - 'scripts/cf-preview/**'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install tooling deps
        run: cd actions/cf-preview && npm ci --ignore-scripts --no-audit --no-fund
      - name: Unit tests (identity, event matrix, preflight, URL, stale guard)
        run: node --test scripts/cf-preview/lib.test.mjs
      - name: publish.sh behaviour (stub wrangler)
        run: scripts/cf-preview/test-publish.sh
      - name: GitHub ledger / PR comment idempotency (stub gh)
        run: scripts/cf-preview/test-gh.sh
      - name: actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color .github/workflows/_cf-worker-v2.yml
