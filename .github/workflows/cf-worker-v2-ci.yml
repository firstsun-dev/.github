name: CF Worker v2 contract tests

on:
  pull_request:
    paths:
      - '.github/workflows/_cf-worker-v2.yml'
      - '.github/workflows/_cf-worker-delivery.yml'
      - '.github/workflows/cf-worker-v2-ci.yml'
      - '.github/actionlint.yaml'
      - 'actions/cf-preview/**'
      - 'actions/cf-preview-gc/**'
      - '.github/workflows/_cf-worker-preview-gc.yml'
      - 'actions/cf-deploy/**'
      - 'actions/cf-ci-check/**'
      - 'scripts/cf-preview/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/_cf-worker-v2.yml'
      - '.github/workflows/_cf-worker-delivery.yml'
      - '.github/workflows/_cf-worker-delivery.yml'
      - '.github/actionlint.yaml'
      - 'actions/cf-preview/**'
      - 'actions/cf-preview-gc/**'
      - '.github/workflows/_cf-worker-preview-gc.yml'
      - 'actions/cf-deploy/**'
      - 'actions/cf-ci-check/**'
      - 'scripts/cf-preview/**'

permissions:
  contents: read

# Validation only (read-only, no deployment or migration is ever started from here): a newer PR commit supersedes the
# older run. main pushes are never cancelled. Deployment/migration concurrency lives in the called workflows.
concurrency:
  group: cf-v2-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install tooling deps
        run: cd actions/cf-preview && npm ci --ignore-scripts --no-audit --no-fund
      - name: Python deps
        run: pip install --quiet pyyaml==6.0.1
      - name: FAST profile (contract, unit, stub shell tests) - fails early, before the expensive chain
        run: LOGDIR="$RUNNER_TEMP/cf-v2-tests" scripts/cf-preview/test.sh fast
      - name: FULL profile remainder - real Migration -> Deploy -> Smoke -> Rollback chains, Shared/persistent Dev, deferred verify (groups run in parallel)
        run: LOGDIR="$RUNNER_TEMP/cf-v2-tests" scripts/cf-preview/test.sh chain
      - name: shellcheck (warnings and above)
        run: |
          shellcheck -x -S warning -P SCRIPTDIR actions/cf-preview/*.sh scripts/cf-preview/*.sh
          python3 scripts/cf-preview/shellcheck-actions.py
      - name: actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color .github/workflows/_cf-worker-v2.yml .github/workflows/_cf-worker-delivery.yml .github/workflows/_cf-worker-delivery.yml .github/workflows/_cf-worker-preview-gc.yml .github/workflows/cf-worker-v2-ci.yml
