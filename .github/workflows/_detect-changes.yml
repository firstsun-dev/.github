name: Detect Changed Paths

# ---------------------------------------------------------------------------
# Reusable path-detection workflow.
# Diffs base-sha..head-sha and matches changed files (added/modified/deleted/
# renamed) against caller-supplied newline-separated glob patterns for three
# independent categories: db, app, config.
#
# Fail-safe base handling: if base-sha is empty, all-zero (new branch / first
# push), or not present in the checkout (force-push, pruned history), the diff
# range cannot be trusted. Rather than erroring or guessing, ALL three
# categories report 'true' (and `base_resolved` is 'false'). A missing
# base never produces a false negative. head-sha must always resolve.
#
# Callers that must not treat "no diff" as "deploy everything" (e.g. manual
# workflow_dispatch deploys) should skip this workflow and select categories
# from their own inputs.
# ---------------------------------------------------------------------------

on:
  workflow_call:
    inputs:
      db-paths:
        description: Newline-separated glob patterns for DB migration paths
        type: string
        required: true
      app-paths:
        description: Newline-separated glob patterns for application paths
        type: string
        required: true
      config-paths:
        description: Newline-separated glob patterns for config paths
        type: string
        required: true
      base-sha:
        description: >-
          Base commit SHA to diff from. May be empty, all zeros, or unknown to
          the checkout; in that case every category is reported as changed.
        type: string
        required: true
      head-sha:
        description: Head commit SHA to diff to
        type: string
        required: true
      runner:
        description: Runner label
        type: string
        default: ubuntu-latest
    outputs:
      db_changed:
        description: "'true' if any changed file matches db-paths"
        value: ${{ jobs.detect.outputs.db_changed }}
      app_changed:
        description: "'true' if any changed file matches app-paths"
        value: ${{ jobs.detect.outputs.app_changed }}
      config_changed:
        description: "'true' if any changed file matches config-paths"
        value: ${{ jobs.detect.outputs.config_changed }}
      base_resolved:
        description: "'false' if base-sha was unusable and all categories were forced to 'true'"
        value: ${{ jobs.detect.outputs.base_resolved }}

jobs:
  detect:
    name: Detect Changes
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 5
    outputs:
      db_changed: ${{ steps.match.outputs.db_changed }}
      app_changed: ${{ steps.match.outputs.app_changed }}
      config_changed: ${{ steps.match.outputs.config_changed }}
      base_resolved: ${{ steps.match.outputs.base_resolved }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Match changed files against path patterns
        id: match
        env:
          BASE_SHA: ${{ inputs.base-sha }}
          HEAD_SHA: ${{ inputs.head-sha }}
          DB_PATTERNS: ${{ inputs.db-paths }}
          APP_PATTERNS: ${{ inputs.app-paths }}
          CONFIG_PATTERNS: ${{ inputs.config-paths }}
        run: |
          set -euo pipefail

          if [ -z "$HEAD_SHA" ] || ! git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null; then
            echo "::error::head-sha '${HEAD_SHA}' is empty or not a commit in this checkout"
            exit 1
          fi

          ZERO_SHA=0000000000000000000000000000000000000000
          BASE_RESOLVED=true
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "$ZERO_SHA" ] \
             || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            BASE_RESOLVED=false
            echo "::notice::base-sha '${BASE_SHA}' is empty/zero/unavailable; treating all categories as changed (fail-safe)."
            CHANGED_FILES=()
          else
            # --no-renames lists both sides of a rename so moving a file out of
            # a matched path is still detected. Includes added/modified/deleted.
            mapfile -t CHANGED_FILES < <(git diff --name-only --no-renames "$BASE_SHA" "$HEAD_SHA")
          fi
          echo "base_resolved=$BASE_RESOLVED" >> "$GITHUB_OUTPUT"

          match_any() {
            local patterns_str="$1"
            local file pattern
            local -a patterns=()
            while IFS= read -r pattern; do
              [ -z "$pattern" ] && continue
              patterns+=("$pattern")
            done <<< "$patterns_str"

            [ "$BASE_RESOLVED" = "false" ] && return 0
            for file in "${CHANGED_FILES[@]}"; do
              [ -z "$file" ] && continue
              for pattern in "${patterns[@]}"; do
                # shellcheck disable=SC2053
                if [[ "$file" == $pattern ]]; then
                  return 0
                fi
              done
            done
            return 1
          }

          shopt -s globstar nullglob extglob

          if match_any "$DB_PATTERNS"; then
            echo "db_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "db_changed=false" >> "$GITHUB_OUTPUT"
          fi

          if match_any "$APP_PATTERNS"; then
            echo "app_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "app_changed=false" >> "$GITHUB_OUTPUT"
          fi

          if match_any "$CONFIG_PATTERNS"; then
            echo "config_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "config_changed=false" >> "$GITHUB_OUTPUT"
          fi
